# 특정금전신탁 계약서 온톨로지 — 제약 계층 (SPEC §C)
#
# 이 파일이 **도메인 지식의 단일 출처**다. 코드에는 제약을 박지 않는다.
# 새 문서 종류 대응 = 이 파일을 새로 쓰는 것이지 코드를 고치는 것이 아니다.
#
# 인식(recognition) vs 제약(constraint) — SPEC §7
#   여기 있는 것: "무엇이 참이어야 하는가" (이미 추출된 fact에 대고 검사 가능)
#   여기 없는 것: "이 PDF 포맷에서 어떻게 알아보는가" (원문을 먹어 fact를 만드는 것 → recognizers.py)
#   단, 어떤 recognizer 를 쓸지는 여기서 **고른다**(structure.*.recognizer). 구현은 코드, 선택은 선언.

version: 1
doc_type: 특정금전신탁
source_document: ss2207_special_trust.pdf

# ---------------------------------------------------------------------------
# Competency questions (§C12.2) — 이 시스템이 답해야 하는 질문.
# **여기 쓰이지 않는 제약은 만들지 않는다.** 바다를 끓이지 않기 위한 범위 제한이며,
# 각 제약은 근거 CQ 를 달아 존재 이유를 추적 가능하게 한다.
# ---------------------------------------------------------------------------
competency_questions:
  CQ1: 요약서의 보수·수수료가 계약(별지1)과 일치하는가?
  CQ2: 별지1의 모든 값이 요약서에 누락 없이 반영됐는가?
  CQ3: 계약 기간·금액 같은 핵심 조건이 요약서에 정확히 옮겨졌는가?
  CQ4: 계약서 본문의 조항이 빠짐없이 청크로 남아 검색·인용이 가능한가?
  CQ5: 선택된 운용방법이 요구하는 위험고지가 요약서에 있는가?   # 추론 페이즈(§C11-3) — 미구현

# ---------------------------------------------------------------------------
# 클래스 (열거) — SPEC §4 facet 2축
# ---------------------------------------------------------------------------
classes:
  role:
    kind: enum
    values: [약관본문, 별지1_입력, 별지2_변경]
    note: |
      TBox/ABox 대응 (§C4). 약관본문 = 공리의 출처(규칙),
      별지1_입력·별지2_변경 = 그 공리가 구속하는 인스턴스(값).
  level:
    kind: enum
    values: [조, 항, 호, 필드, 표]

# ---------------------------------------------------------------------------
# 구조 모델 (§C6) — "무엇이 어떻게 중첩되는가"
# recognizer 는 이 선언을 이 PDF 포맷에서 실현할 뿐, 구조의 단일 출처는 여기다.
# ---------------------------------------------------------------------------
structure:
  조:
    has: [번호, 제목]
    contains: 항
    ordinal: true
    recognizer: korean_article        # recognizers.py 의 등록된 어댑터 이름
    chunk: primary                    # 조 = 기본 청크 단위
    chunk_boundary: hard              # 청크는 이 경계를 절대 넘지 않음 (shape 와 같은 출처)
  항:
    has: [번호]
    contains: 호
    ordinal: true
    recognizer: circled_clause
    chunk: split_if_long              # 조가 매우 길 때만 항 단위 분할 (의미 경계에서만)
  호:
    has: [번호]
    ordinal: true
    recognizer: numbered_item
    chunk: inline                     # 호는 부모 항의 items[] 로 담는다
  별지:
    contains: 필드
    chunk: per_field                  # 별지는 필드/표 단위
    field_links_to: 조                # 별지 필드는 cross-ref 로 조에 대응
    recognizer: appendix_marker
  필드:
    has: [이름, 값]
    recognizer: appendix_field        # 별지 표의 라벨-값 셀 쌍
  표:
    has: [행, 열]
    recognizer: table_block           # 체크박스 그리드·다단 조건표 포함

# 문서 파트 → role. 파트 경계는 마커로 인식한다(§6 T2).
parts:
  - { role: 약관본문,    default: true }
  - { role: 별지1_입력,  starts_at: "[별지1]", appendix_no: 1 }
  - { role: 별지2_변경,  starts_at: "[별지2]", appendix_no: 2 }

# ---------------------------------------------------------------------------
# 프로퍼티
# ---------------------------------------------------------------------------
properties:
  refs:
    type: object_property
    range: [조, 별지]
    note: 존재하는 조 또는 별지로 해소돼야 한다 (§9-7). 미해소는 경고.
  topic:
    type: derived
    formula: "{article_title}({article})"
  cross_ref_explicit:
    type: object_property
    range: [조]
    applies_to_role: [별지1_입력, 별지2_변경]
    recognizer: contract_article_cell

# ---------------------------------------------------------------------------
# 별지1 필드 = Part B 검증 대상 (§B4)
# source_of_truth · equals · aliases 가 교차문서 공리다.
# 필드 집합은 ss2207 별지1을 파싱해 확인한 실제 구성이다.
# ---------------------------------------------------------------------------
fields:
  계좌번호:
    cq: [CQ2]
    provenance: { origin: ss2207_별지1, approved_by: 구현자, date: 2026-08-04 }
    value_type: account_no
    source_of_truth: 별지1_입력
    equals: 요약서.계좌번호
    aliases: [계좌번호, 신탁계좌번호]

  신탁금액:
    cq: [CQ3]
    provenance: { origin: ss2207_별지1, approved_by: 구현자, date: 2026-08-04 }
    value_type: number
    constraints: [">0", "cardinality==1"]
    article: 제2조
    source_of_truth: 별지1_입력
    equals: 요약서.신탁금액
    aliases: [투자금액, 신탁원금, 투자원금, 가입금액]

  신탁기간:
    cq: [CQ3]
    provenance: { origin: ss2207_별지1, approved_by: 구현자, date: 2026-08-04 }
    value_type: date_range
    constraints: ["end > start"]
    article: 제3조
    source_of_truth: 별지1_입력
    equals: 요약서.신탁기간
    aliases: [투자기간, 계약기간, 신탁계약기간]

  운용내역 통지여부:
    cq: [CQ2]
    provenance: { origin: ss2207_별지1, approved_by: 구현자, date: 2026-08-04 }
    value_type: option_set
    article: 제7조
    source_of_truth: 별지1_입력
    equals: 요약서.운용내역 통지여부
    aliases: [운용내역 통지, 운용보고 방식, 자산운용보고서 수령]

  기본보수:
    cq: [CQ1]
    provenance: { origin: ss2207_별지1, approved_by: 구현자, date: 2026-08-04 }
    value_type: percent
    article: 제12조
    source_of_truth: 별지1_입력
    equals: 요약서.기본보수
    aliases: [신탁보수, 보수율, 운용보수]

  수익보수:
    cq: [CQ1]
    provenance: { origin: ss2207_별지1, approved_by: 구현자, date: 2026-08-04 }
    value_type: percent
    article: 제12조
    source_of_truth: 별지1_입력
    equals: 요약서.수익보수
    aliases: [성과보수, 초과성과보수]

  지급주기:
    cq: [CQ2]
    provenance: { origin: ss2207_별지1, approved_by: 구현자, date: 2026-08-04 }
    value_type: text
    article: 제13조
    source_of_truth: 별지1_입력
    equals: 요약서.지급주기
    aliases: [이익지급주기, 배당주기]

  원금지급비율:
    cq: [CQ2]
    provenance: { origin: ss2207_별지1, approved_by: 구현자, date: 2026-08-04 }
    value_type: percent
    article: 제13조
    source_of_truth: 별지1_입력
    equals: 요약서.원금지급비율
    aliases: [원금지급 비율]

  지급기간:
    cq: [CQ2]
    provenance: { origin: ss2207_별지1, approved_by: 구현자, date: 2026-08-04 }
    value_type: date_range
    article: 제13조
    source_of_truth: 별지1_입력
    equals: 요약서.지급기간
    aliases: [이익지급기간]

  지급계좌:
    cq: [CQ2]
    provenance: { origin: ss2207_별지1, approved_by: 구현자, date: 2026-08-04 }
    value_type: account_no
    article: 제13조
    source_of_truth: 별지1_입력
    equals: 요약서.지급계좌
    aliases: [이익지급계좌, 입금계좌]

  중도해지수수료:
    cq: [CQ1]
    provenance: { origin: ss2207_별지1, approved_by: 구현자, date: 2026-08-04 }
    value_type: range_tiers
    article: 제15조
    source_of_truth: 별지1_입력
    equals: 요약서.중도해지수수료
    aliases: [중도상환수수료, 해지수수료, 중도해지 수수료율]

  신탁자금 운용방법:
    cq: [CQ2]
    provenance: { origin: ss2207_별지1, approved_by: 구현자, date: 2026-08-04 }
    value_type: option_set
    article: 제5조
    source_of_truth: 별지1_입력
    equals: 요약서.신탁자금 운용방법
    aliases: [운용방법, 운용대상, 편입자산]

  세부 운용지시:
    cq: [CQ2]
    provenance: { origin: ss2207_별지1, approved_by: 구현자, date: 2026-08-04 }
    value_type: text
    article: 제5조
    source_of_truth: 별지1_입력
    equals: 요약서.세부 운용지시
    aliases: []
    note: |
      의도적 공백. 요약서엔 '투자전략' 이라는 이름으로 값이 실제로 있지만
      별칭이 없어 UNMAPPED 로 잡혀야 한다. '투자전략' 을 추가하면 MATCH 로 바뀐다.
      코드 수정 없이 온톨로지만으로 매핑이 늘어나는지를 검증하는 항목이다.

  만기일:
    cq: [CQ3]
    provenance: { origin: ss2207_별지1, approved_by: 구현자, date: 2026-08-04 }
    value_type: date
    derived: "신탁기간.end"
    source_of_truth: 별지1_입력
    equals: 요약서.만기일
    aliases: [만기일, 계약종료일]
    note: 별지1에 직접 없고 계산으로만 존재. '동일' 이 아니라 '계산상 일관' 으로 판정(§B7).

# ---------------------------------------------------------------------------
# 구조 shape (§C6) — 이름은 선언, 검사 로직은 validate.py 에 등록되어 있다.
# ---------------------------------------------------------------------------
shapes:
  - no_chunk_crosses_조_boundary        # §9-2
  - every_조_has_exactly_one_번호
  - refs_resolve_to_existing_target     # §9-7
  - appendix_field_links_to_article     # §9-5
  - chunk_boundaries_are_semantic       # §9-6 (토큰 예산 폐기 — §D1)
  - required_tags_present               # role·topic·level·provenance.page (§9-1)

# ---------------------------------------------------------------------------
# 본문(role=약관본문)에서 유도한 공리 — LLM 후보 추출 + 사람 승인 (§C5-4)
# 아래 두 건은 ss2207 원문에서 실제로 확인된 문장이다.
# ---------------------------------------------------------------------------
axioms_from_text:
  - id: 제2조①-신탁금액정의
    source: 제2조①
    quote: "이 신탁의 신탁금액은 [별지1]신탁계약 세부내역에 기재된 금액으로 한다."
    rule: "신탁금액 == 별지1.신탁금액"
    kind: equivalence
    approved: true

  - id: 제3조-신탁기간정의
    source: 제3조
    quote: "신탁기간은 [별지1] 신탁계약 세부내역에 기재된 기간으로 하며…"
    rule: "신탁기간 == 별지1.신탁기간"
    kind: equivalence
    approved: true

  - id: 제4조①-수익자기본값
    source: 제4조①
    quote: "단, 수익자를 별도로 기재하지 않을 때에는 위탁자와 수익자가 동일한 것으로 본다."
    rule: "if 수익자 is null then 수익자 := 위탁자"
    kind: default_value
    approved: true

  - id: 제15조③-일부출금은중도해지
    source: 제15조③
    quote: "위탁자가 제2조 제3항에 따라 신탁금을 출금하는 경우 그 범위 내에서 제1항의 중도해지가 있는 것으로 본다."
    rule: "출금(신탁금) ⊑ 중도해지"
    kind: subsumption
    approved: false
    note: 추론 페이즈(§C11) 대상. 현재는 검증에 쓰지 않는다.
