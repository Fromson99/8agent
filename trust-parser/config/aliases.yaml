# 요약서 필드 별칭 (SPEC §B6)
#
#   key   = 별지1(정답)의 정규 필드명
#   value = 요약서에서 같은 의미로 쓰이는 이름들 (다대일)
#
# 새 요약서 템플릿이 나오면 코드를 고치지 말고 이 파일만 갱신한다.
# 매핑은 "무엇과 무엇을 비교할지"만 정한다. 값이 같은지는 별개 단계(§B7)에서 판단한다.
#
# 주의: 골든 쌍 acct_001 은 '세부 운용지시' 의 별칭을 **일부러 비워** 두었다.
#       요약서엔 '투자전략' 이라는 이름으로 값이 실제로 있지만 UNMAPPED 로 잡혀야 하고,
#       아래 주석을 풀면 MATCH 로 바뀌어야 한다. 그 전환이 골든 테스트의 검증 항목이다.

version: 1

aliases:
  계좌번호:
    - 계좌번호
    - 신탁계좌번호

  신탁금액:
    - 투자금액
    - 신탁원금
    - 투자원금
    - 가입금액

  신탁기간:
    - 투자기간
    - 계약기간
    - 신탁계약기간

  운용내역 통지여부:
    - 운용내역 통지
    - 운용보고 방식
    - 자산운용보고서 수령

  기본보수:
    - 신탁보수
    - 보수율
    - 운용보수

  수익보수:
    - 성과보수
    - 초과성과보수

  지급주기:
    - 이익지급주기
    - 배당주기

  원금지급비율:
    - 원금지급 비율

  지급기간:
    - 이익지급기간

  지급계좌:
    - 이익지급계좌
    - 입금계좌

  중도해지수수료:
    - 중도상환수수료
    - 해지수수료
    - 중도해지 수수료율

  신탁자금 운용방법:
    - 운용방법
    - 운용대상
    - 편입자산

  세부 운용지시: []
    # - 투자전략      ← 주석을 풀면 UNMAPPED → MATCH 로 바뀐다
    # - 운용지시
