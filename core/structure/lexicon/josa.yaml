# 조사 어휘 — mention 판별의 언어 신호 (구조 해석기 게이트 3)
#
# 구분자 매치 **바로 뒤에 공백 없이** 이 형태가 붙으면 그 매치는 구역 경계가 아니라
# 본문 속 참조다. `제3장의 규정`, `제19조(설명의무)에 따라`, `[별지1]의 위탁자` 가 그것이다.
# 진짜 제목 뒤에는 조사가 붙지 않는다 — 제목 명사가 오거나 줄이 끝난다.
#
# 이것이 꼬리 길이(max_tail) 임계값을 대체한다. 임계값은 문서마다 튜닝해야 하는 숫자라
# 구분자의 속성이 될 수 없지만, 조사는 언어의 속성이라 구분자가 들고 다닐 수 있다.
version: 1

# 긴 것부터 검사한다(에서 가 에 에 먹히지 않게) — 로더가 길이순으로 정렬한다.
josa:
  - 에서는
  - 에서도
  - 에게는
  - 으로는
  - 으로도
  - 에서
  - 에게
  - 에는
  - 에도
  - 으로
  - 이나
  - 라도
  - 부터
  - 까지
  - 처럼
  - 보다
  - 의
  - 에
  - 을
  - 를
  - 은
  - 는
  - 이
  - 가
  - 과
  - 와
  - 로
  - 만
  - 도
  - 나

# 연쇄 참조 — 조사는 아니지만 같은 일을 한다.
# `제19조제3항에 따라` 처럼 구분자 바로 뒤에 또 다른 구분자가 공백 없이 이어지면
# 그것은 인용문이지 구역 경계가 아니다. 경계는 자기 줄에서 혼자 시작한다.
chained_reference:
  - '제\s*\d+\s*(?:조|항|호|목|장|절|편|관)'
  - '각\s*(?:호|목)'
