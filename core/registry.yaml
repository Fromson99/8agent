# 등록부 (registry) — 시스템의 문서 처리 능력 목록 (SPEC §00.2)
#
# 이 파일 하나가 "지금 무엇을 처리할 수 있는가"의 답이다.
# 새 문서 유형 지원 = **코드 수정이 아니라 route 등록**이다.
#
# 규칙 — 같은 doc_type 은 누가 호출하든 반드시 같은 파서·형식·용어집으로 처리된다.
#   에이전트는 `router.route(파일, doc_type=...)` 만 호출할 수 있고,
#   형식·용어집 경로를 스스로 고를 수 없다. 그것을 코드로 강제하는 것이 core/router.py 다.
#
# doc_type 은 호출자가 지정한다 — 자동 판별(detect)은 뺐다. 사용자가 유형에 맞게
# 넣는 운영이고, "그 유형이 맞긴 한가"는 fitness 게이트가 정량으로 판정한다.
#
# 등록 절차(§00.5): 샘플 3~5개 확보 → 인식기 결정 → 용어집 작성 →
#                   형식 확정(홀드아웃 검증) → 게이트 임계 정의 → 여기에 등록.

version: 1

# 파싱 로직 플러그인 — ID → "모듈:함수" (ParseResult 를 돌려주는 호출 가능 객체).
# 코어는 이 표를 **데이터로** 읽는다. 코어 코드에 doc_type 분기는 없다(§00.5 의존 방향).
parsers:
  auto: core.parse_adapter:parse                      # 확장자로 갈라 준다 (pdf/docx/hwp/md)
  transcript: agents.agent6.src.transcript:parse      # 발화턴 계열 (STT 전사 JSON)

routes:
  # --- 조/항/호 계열 -------------------------------------------------------
  - doc_type: 특정금전신탁
    parser: auto
    format: agents/agent1/formats/trust_contract.format.json
    glossary: agents/agent1/glossary/trust_contract.glossary.yaml
    threshold: 0.70
    owner: agent1

  # --- 부/항목/세목 계열 ---------------------------------------------------
  - doc_type: 투자설명서
    parser: auto
    format: agents/agent1/formats/prospectus.format.json
    glossary: agents/agent1/glossary/prospectus.glossary.yaml
    threshold: 0.70
    owner: agent1

  # --- 법령 계열 (조/항/호/목) --------------------------------------------
  - doc_type: 금소법
    parser: auto
    format: agents/agent6/formats/statute.format.json
    glossary: agents/agent6/glossary/statute.glossary.yaml
    threshold: 0.60
    owner: agent6
    note: "코퍼스 원문을 계약서와 같은 파이프라인에 태운다 (AGENT6 §2)"

  - doc_type: 금소법시행령
    parser: auto
    format: agents/agent6/formats/decree.format.json
    glossary: agents/agent6/glossary/decree.glossary.yaml
    threshold: 0.60
    owner: agent6
    note: "구조는 법률과 같은 조/항/호/목이지만 doc_type 이 다르므로 형식도 별개다"

  # --- 번호 항목 계열 (로마숫자 → N. → N)) --------------------------------
  - doc_type: 표준투자권유준칙
    parser: auto
    format: agents/agent6/formats/kofia_rule.format.json
    glossary: agents/agent6/glossary/kofia_rule.glossary.yaml
    threshold: 0.60
    owner: agent6
    note: "법령이 아니라 모범규준. 113p 에서 제N조 마커가 1개뿐이라 조/항/호 인식기가 통하지 않는다"

  # --- 발화턴 계열 ---------------------------------------------------------
  - doc_type: STT전사
    parser: transcript
    format: agents/agent6/formats/transcript.format.json
    glossary: agents/agent6/glossary/transcript.glossary.yaml
    threshold: 0.50
    owner: agent6
    note: "발화 하나가 section 하나. 근거 인용 좌표가 곧 section_id 다"
