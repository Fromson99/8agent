# 과제5 서브태스크 1 — 내규·외규 QA 예시
#
# 태스크: 내규(예시 내규 3종) 또는 외규(corpus/ 법령·규정)에 대한 단순 조회 질의.
# 내규 근거는 examples/task5-risk-agent/internal-rules/ 의 예시 문서,
# 외규 근거는 corpus/ 실물에서 실측 확인한 조문이다.
# 내규 질문은 별도 표기 없으면 현행(위험관리기준시행세칙 v2, 2026. 7. 1. 개정)을 기준으로 답한다.

items:
  - id: t5s1-01
    kind: 내규
    question: >-
      우리 회사 총위험한도가 자기자본의 몇 퍼센트까지야?
    answer: >-
      위험관리기준시행세칙 제7조제1항에 따라 총위험액을 직전 사업연도말 자기자본의
      100분의 35 이내로 관리한다(2026. 7. 1. 개정으로 40%에서 35%로 축소).
      한도 변경은 같은 조 제2항에 따라 위험관리위원회 의결 사항이다.
    sources:
      - doc: 위험관리기준시행세칙(v2)
        article: 제7조
    eval_points:
      - 현행 기준 35%
      - 구판(40%)이 아닌 현행 답변

  - id: t5s1-02
    kind: 내규
    question: >-
      순자본비율 내부 관리목표랑 조기경보 기준이 어떻게 되지?
    answer: >-
      위험관리기준시행세칙 제9조에 따라 내부 관리목표는 순자본비율 500% 이상 유지,
      450% 미달 시 리스크관리부가 조기경보를 발령하고 위험관리책임자에게 보고한다.
    sources:
      - doc: 위험관리기준시행세칙(v2)
        article: 제9조
    eval_points:
      - 관리목표 500%
      - 조기경보 450%

  - id: t5s1-03
    kind: 내규
    question: >-
      부서 위험한도를 초과한 게 확인되면 실무적으로 뭐부터 해야 해?
    answer: >-
      위험관리기준시행세칙 제11조에 따라 (1) 부서장이 인지 즉시 위험관리책임자에게 보고하고,
      (2) 3영업일 이내에 한도초과 해소계획을 제출하며, (3) 위험관리책임자가 이행상황을
      점검해 위험관리위원회에 보고한다.
    sources:
      - doc: 위험관리기준시행세칙(v2)
        article: 제11조
    eval_points:
      - 즉시 보고
      - 3영업일 내 해소계획
      - 위원회 보고 체계

  - id: t5s1-04
    kind: 내규
    question: >-
      500억짜리 회사채 총액인수 딜인데 승인은 어디까지 받아야 하나?
    answer: >-
      투자및인수위험관리지침 제3조제1항에 따라 인수금액 500억 원 이상인 딜은 실행 전
      투자심사위원회의 심의·의결이 필요하다(500억 원 미만이면 부문장 전결).
      또한 같은 지침 제4조의 인수 한도(동일 딜 자기자본의 15%, 인수잔량 합계 50%)를
      점검하고, 한도 초과 시에는 위험관리위원회의 사전 승인까지 받아야 한다.
    sources:
      - doc: 투자및인수위험관리지침
        article: 제3조·제4조
    eval_points:
      - 500억 원 기준으로 투자심사위원회 의결
      - 한도 초과 시 위험관리위원회 사전 승인 추가

  - id: t5s1-05
    kind: 외규
    question: >-
      금융투자업규정상 위험관리지침에 꼭 들어가야 하는 항목들이 뭐야?
    answer: >-
      금융투자업규정 제3-44조제2항이 필수 기재사항을 정한다. 1종 금융투자업자의 경우
      순자본비율 및 자산부채비율의 수준, 운용자산의 내용과 위험의 정도, 자산의 운용방법,
      고위험 자산의 기준과 운용한도, 콜차입 등 단기차입금 한도, 내부적인 보고 및 승인체계,
      위반에 대한 내부 징계내용·절차, 위험관리조직의 구성·운영 등이다. 같은 조 제4항에 따라
      지침을 제정·변경하면 금융감독원장에게 보고해야 한다.
    sources:
      - doc: 금융투자업규정
        article: 제3-44조제2항·제4항
    eval_points:
      - 필수 항목 열거 (순자본비율 수준·고위험자산 한도·단기차입금 한도·승인체계 등)
      - 제정·변경 시 금감원장 보고 의무

  - id: t5s1-06
    kind: 외규
    question: >-
      위험관리 관련해서 이사회가 직접 심의·의결해야 하는 사항이 법규상 뭐가 있지?
    answer: >-
      금융투자업규정 제3-43조제1항에 따라 (1) 경영전략에 부합하는 위험관리 기본방침 수립,
      (2) 부담 가능한 위험 수준의 결정, (3) 적정투자한도 또는 손실허용한도 승인,
      (4) 위험관리지침의 제정·개정은 이사회 심의·의결 사항이다. 다만 이사회 내
      위험관리위원회를 두어 그 업무를 담당하게 할 수 있다. 위험관리기준 마련 의무 자체는
      금융회사의 지배구조에 관한 법률 제27조에 근거한다.
    sources:
      - doc: 금융투자업규정
        article: 제3-43조제1항
      - doc: 금융회사의 지배구조에 관한 법률
        article: 제27조
    eval_points:
      - 4가지 의결 사항
      - 위험관리위원회 위임 가능
      - 지배구조법 제27조 연결

  - id: t5s1-07
    kind: 외규
    question: >-
      순자본비율이 100% 아래로 떨어지면 감독당국 관련해서 뭘 해야 하고 무슨 일이 생기나?
    answer: >-
      금융투자업규정 제3-26조제4항에 따라 1종 금융투자업자는 순자본비율이 100%에 미달하면
      지체없이 금융감독원장에게 보고해야 하고, 제5항에 따라 100% 이상을 회복할 때까지
      매달 해당 비율을 다음 달 20일까지 보고해야 한다. 아울러 같은 조 제1항의 경영개선권고
      요건(별표10의2)에 해당하면 금융위원회가 인력·조직 개선, 신규업무 진출 제한,
      자본금 증액 등의 조치를 권고한다. 분기별 정기 보고·공시 의무는 자본시장법
      제30조제3항에 별도로 있다.
    sources:
      - doc: 금융투자업규정
        article: 제3-26조
      - doc: 자본시장과 금융투자업에 관한 법률
        article: 제30조제3항
    eval_points:
      - 지체없이 보고 + 매달 보고
      - 경영개선권고와의 연결
      - 제30조제3항 분기보고와 구분

  - id: t5s1-08
    kind: 내규+외규
    question: >-
      장외파생상품 거래 하나 체결하려면 내규·법규상 승인이랑 확인 절차가 각각 뭐가 필요해?
    answer: >-
      법규: 자본시장법 제166조의2제1항에 따라 매매를 할 때마다 파생상품업무책임자(법 제28조의2)의
      승인이 필요하고(제4호), 상대방이 일반투자자면 위험회피 목적 거래에 한하며 회피하려는
      위험의 종류·금액을 확인하고 자료를 보관해야 한다(제1호).
      내규: 위험관리기준시행세칙 제12조가 같은 내용을 규정하므로 파생상품업무책임자 승인과
      위험회피 목적 확인을 실행 전에 완료해야 하고, 딜 연계 거래면 투자및인수위험관리지침
      제10조도 적용된다.
    sources:
      - doc: 자본시장과 금융투자업에 관한 법률
        article: 제166조의2제1항
      - doc: 위험관리기준시행세칙(v2)
        article: 제12조
      - doc: 투자및인수위험관리지침
        article: 제10조
    eval_points:
      - 파생상품업무책임자 승인 (매 거래)
      - 일반투자자 위험회피 목적 확인·자료 보관
      - 내규와 외규 근거를 모두 제시
