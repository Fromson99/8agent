# 과제5 서브태스크 2 — 내규 ↔ 외규 상충 점검 예시 Q&A
#
# 태스크: 내규 조문을 지목하거나 주제를 주면, 관련 외규를 회수해 상충·미비·부합을 판정하고
#         근거와 정비 의견을 제시한다.
# 예시 내규(위험관리기준시행세칙 v2)에는 의도적으로 심어둔 상충 2건 + 미비 1건이 있고,
# "상충처럼 보이지만 아닌" 음성 예시도 포함한다.
#
# verdict: 상충 | 미비 | 부합 (기대 판정)

items:
  - id: t5s2-01
    verdict: 상충
    question: >-
      위험관리기준시행세칙 제12조제2항에서 순자본비율 120% 미달이면 신규 장외파생상품
      매매를 중지한다고 돼 있는데, 이거 법에 맞는 기준인가?
    answer: >-
      상충이다. 자본시장법 제166조의2제1항제3호는 영업용순자본에서 총위험액을 차감한 금액을
      인가업무 단위별 자기자본 합계로 나눈 값(순자본비율에 상당)이 100분의 150에 미달하면
      그 미달상태가 해소될 때까지 신규 장외파생상품 매매를 중지하도록 한다. 내규가 중지
      기준을 120%로 정한 것은 법정 기준(150%)보다 완화된 것이어서, 순자본비율이 120~150%
      구간일 때 내규상으로는 거래가 허용되지만 법 위반이 된다. 2026. 7. 1. 개정 전(구판 v1)
      에는 150%로 법과 일치했으므로, 이번 개정을 되돌리는 재개정이 필요하다.
    sources:
      - doc: 위험관리기준시행세칙(v2)
        article: 제12조제2항
      - doc: 자본시장과 금융투자업에 관한 법률
        article: 제166조의2제1항제3호
      - doc: 위험관리기준시행세칙(v1)
        article: 제12조제2항
    eval_points:
      - 법정 기준 150% 대비 내규 120%의 완화를 상충으로 판정
      - 120~150% 구간에서 법 위반 발생이라는 구체적 시나리오
      - 개정 전에는 부합했다는 이력 인식 (v1 대비)

  - id: t5s2-02
    verdict: 상충
    question: >-
      세칙 제18조제2항에 경미한 사항은 리스크관리부장 전결로 세칙을 개정할 수 있다는
      단서가 새로 생겼는데 문제없나?
    answer: >-
      상충 소지가 있다. 금융투자업규정 제3-43조제1항제4호는 위험관리지침의 제정·개정을
      이사회 심의·의결 사항으로 정하고, 위임하더라도 이사회 내 위험관리위원회까지만
      허용한다. 세칙이 위험관리지침에 해당하는 이상 부서장 전결 개정은 이 체계와 맞지 않는다.
      또한 금융투자업규정 제3-44조제4항은 지침 제정·변경 시 금융감독원장 보고를 요구하는데,
      부서장 전결 경로에는 이 보고 절차에 대한 규정이 없다. 단서를 삭제하거나
      "위원회 사후 추인 + 금감원장 보고"를 전제한 문구로 정비할 것을 권고한다.
    sources:
      - doc: 위험관리기준시행세칙(v2)
        article: 제18조제2항
      - doc: 금융투자업규정
        article: 제3-43조제1항제4호·제3-44조제4항
    eval_points:
      - 제·개정 권한이 이사회(위원회)에 있어야 함
      - 금감원장 보고 절차 누락 지적
      - 정비 방향 의견 제시

  - id: t5s2-03
    verdict: 부합
    question: >-
      세칙 제17조 감독당국 보고 조항이 지금 규정대로면 충분한가?
    answer: >-
      현행(v2)은 부합한다. 금융투자업규정 제3-26조제4항·제5항은 순자본비율 100% 미달 시
      지체없이 금융감독원장에게 보고하고, 회복 시까지 매달 다음 달 20일까지 보고하도록
      하는데, 세칙 제17조제1항·제2항이 이를 그대로 반영하고 있다. 참고로 구판(v1)은
      "분기 종료 후 45일 이내 보고"로 규정해 자본시장법 제30조제3항의 분기별 정기보고와
      혼동한 것으로 보이며 외규와 상충했으나, 2026. 7. 1. 개정으로 해소되었다.
    sources:
      - doc: 위험관리기준시행세칙(v2)
        article: 제17조
      - doc: 금융투자업규정
        article: 제3-26조제4항·제5항
    eval_points:
      - 현행 부합 판정
      - 구판의 상충 이력과 그 원인(분기보고와의 혼동) 설명

  - id: t5s2-04
    verdict: 부합
    question: >-
      우리 내규는 순자본비율을 500% 이상 유지하라고 하는데 금융투자업규정 기준은 100%잖아.
      기준이 다른데 이것도 상충인가?
    answer: >-
      상충이 아니다. 금융투자업규정 제3-26조의 100%는 감독상 최저 기준(경영개선권고·보고
      의무의 발동 기준)이고, 내규의 500%는 회사가 자율적으로 정한 더 보수적인 내부
      관리목표다. 금융투자업규정 제3-44조제2항제1호는 오히려 회사가 내부적으로 관리할
      순자본비율 수준을 지침에 정하도록 요구하므로, 법정 기준보다 강화된 내부 기준은
      상충이 아니라 외규가 예정한 바다. 내규가 외규보다 완화된 경우에만 상충이 문제된다.
    sources:
      - doc: 위험관리기준시행세칙(v2)
        article: 제9조
      - doc: 금융투자업규정
        article: 제3-26조·제3-44조제2항제1호
    eval_points:
      - 보수적 강화는 상충 아님 (방향성 판단)
      - 내부관리기준 설정 자체가 외규의 요구사항임을 지적

  - id: t5s2-05
    verdict: 부합
    question: >-
      금융투자업규정이 위험관리지침에 담으라고 하는 항목들, 우리 세칙이 다 커버하고 있나?
      빠진 게 있으면 알려줘.
    answer: >-
      대체로 커버한다. 금융투자업규정 제3-44조제2항 기준으로 — 순자본비율 수준(세칙 제9조),
      단기차입금 한도(제13조), 보고·승인체계(제10조·제11조), 위험관리조직(제4조~제6조),
      한도(제7조·제8조)는 규정돼 있다. 다만 위반에 대한 내부 징계내용·절차(제2항제8호)는
      세칙에 직접 규정이 없고 투자및인수위험관리지침 제11조가 인사 내규로 미루고 있으므로,
      위험관리 내규 체계 전체로는 근거가 있으나 세칙 본문에 연결 조항을 두는 것이 명확하다.
      고위험 자산의 기준과 운용한도(제2항제4호)도 세칙에는 명시 조항이 없어 보완 검토 대상이다.
    sources:
      - doc: 금융투자업규정
        article: 제3-44조제2항
      - doc: 위험관리기준시행세칙(v2)
        article: 제9조·제10조·제11조·제13조
      - doc: 투자및인수위험관리지침
        article: 제11조
    eval_points:
      - 항목별 대응 관계 매핑
      - 미비 후보(징계 절차·고위험 자산 기준) 식별
      - 문서 여러 개에 걸친 종합 판단
