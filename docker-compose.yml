# 구조 해석 검수 서비스 — 이 저장소의 **기본** 서비스다.
#
#   docker compose up -d --build
#   open http://localhost:5566
#   docker compose logs -f
#   docker compose down
#
# 레거시 두 엔진(archive/trust-parser-v1 · first-agent)을 싣는 API 는
# `deploy/api/docker-compose.yml` 에 따로 있다. 이 서비스는 core.structure 만 있으면 돈다.

# 프로젝트 이름을 못 박는다 — 디렉토리 이름이 바뀌어도 기존 볼륨
# (8-agent_structure-data · 8-agent_hf-models)에 계속 붙는다.
name: 8-agent

services:
  structure:
    build:
      context: .                          # 루트여야 core/ 를 복사할 수 있다
      dockerfile: deploy/structure/Dockerfile
      args:
        BAKE_MODELS: "${BAKE_MODELS:-1}"  # 0 이면 빌드가 빨라지고 첫 요청이 느려진다
    image: structure-interpreter:latest
    container_name: structure-viewer
    ports:
      - "${PORT:-5566}:5566"
    environment:
      # 키는 이미지에 굽지 않는다 — 셸/CI 환경변수나 호스트 .env 에서 주입한다.
      # 없으면 잔여 해소(S5b)만 못 하고 결정론 경로는 그대로 돈다.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-}"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-40}"
      STRUCTURE_STORE: /data/structure
      # 등록한 규칙은 문서 스토어 **밖**에 둔다 — 안에 두면 문서 삭제 API 의
      # rmtree 반경에 들어간다. (예전 자리 /data/structure/custom 에 이미 규칙이
      # 있다면 data/custom/ 으로 옮기면 된다.)
      STRUCTURE_CUSTOM_DIR: /data/custom
      # 용어집·참조 링크의 정본. 코드 기본값(STORE.parent)도 같은 곳을 가리키지만
      # **명시**한다 — 기본값이 바뀌어도 사람이 이은 용어·링크가 마운트 밖으로
      # 새면 안 된다. 컨테이너를 지워도 남아야 하는 파일들이다.
      GLOSSARY_STORE: /data/glossary.json
      RAG_LINKS_STORE: /data/links.json
      STRUCTURE_RENDER_SCALE: "${STRUCTURE_RENDER_SCALE:-2.0}"
    volumes:
      # 올린 문서·해석 결과·페이지 캐시·등록한 규칙·용어집·참조 링크.
      # **바인드 마운트**다 — 화면에서 올린 PDF 와 해석 산출을 호스트에서 그대로 열어
      # 볼 수 있어야 한다(named volume 이면 `docker cp` 없이는 못 본다).
      # /data 전체를 마운트한다 — 예전처럼 /data/structure 만 마운트하면
      # glossary.json·links.json 이 컨테이너 쓰기 계층에 떨어져 재생성 때 사라진다.
      - ${DATA_DIR:-./data}:/data
      # 도클링 모델 캐시. BAKE_MODELS=0 으로 빌드했다면 첫 요청 때 여기로 받는다.
      - hf-models:/models
      # 개발 중 재빌드를 없앤다. 이미지에도 같은 파일이 있으므로 이 줄들을 지우면
      # 그대로 이미지 안의 것이 뜬다.
      #   viewer  새로고침만으로 반영된다 (StaticFiles 가 매 요청 디스크를 읽는다)
      #   core/api 파이썬이라 **컨테이너 재시작**이 필요하다
      #           (`docker compose restart structure`). 이게 없으면 코드를 고쳐도
      #           이미지에 구운 옛 코드가 계속 돈다 — 실제로 그래서 "다시 해석"이
      #           아무것도 안 바꾸는 것처럼 보였다.
      - ./api:/app/api:ro
      - ./core:/app/core:ro
    # 개발 중에는 코드가 바뀌면 **스스로 다시 뜬다.** 이게 없으면 바인드로 파일만
    # 새것이고 실행 중인 파이썬은 프로세스 시작 때 임포트한 옛 코드다 —
    # 실제로 그래서 "다시 해석" 이 옛 결과를 그대로 냈다.
    # 끄려면 RELOAD=0 (운영은 꺼 두는 편이 낫다).
    # umask 000 — /data 는 호스트(jin)와 컨테이너(app, uid 10001)가 **둘 다**
    # 쓰는 바인드 마운트다. umask 를 열지 않으면 한쪽이 만든 파일을 다른 쪽이
    # 못 고친다 — 실제로 판정 지문·검수 승인 쓰기가 조용히 막혔었다(개발 설정).
    command: >
      sh -c 'umask 000 && exec uvicorn api.structure_app:app --host 0.0.0.0 --port 5566
      ${RELOAD_FLAG:---reload --reload-dir /app/core --reload-dir /app/api}'
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5566/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  hf-models:
