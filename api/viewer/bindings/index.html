<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구조화 연결</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="bar">
  <div class="brand">구조화 연결</div>
  <span class="sub" id="summary">불러오는 중…</span>
  <button id="newFolder" title="연결의 기본 단위인 폴더를 여기서 바로 만든다">
    ＋ 폴더</button>
  <button id="newFormat" title="빈 틀을 캔버스에 놓고, 문서를 이어 실행하면 만들어집니다">
    ＋ 새 구조화</button>
  <label class="chk" title="마커 체계를 LLM 이 유도한다 (ANTHROPIC_API_KEY 필요)">
    <input type="checkbox" id="useLlm"> LLM 유도
  </label>
  <button id="tidy" title="자리를 자동으로 정리한다">자리 정리</button>
  <div class="grow"></div>
  <a class="navlink" href="/">← 문서·데이터</a>
  <a class="navlink" href="/structure/">검수 화면 →</a>
</header>

<div id="banner" class="banner hidden"></div>

<main class="layout">
  <aside class="panel src">
    <div class="phead">
      <b>틀 · 폴더 · 문서</b>
      <span class="sub">캔버스로 끌어다 놓기</span>
    </div>
    <input id="q" type="search" placeholder="이름으로 찾기">
    <div id="srcList" class="srclist"></div>
    <div class="phelp">
      기본 단위는 <b>폴더</b>입니다. 폴더를 틀에 이으면 그 안의 문서 전부가 그 틀로 잘립니다.
      특이한 문서 하나는 <b>따로 끌어다 다른 틀에 이어</b> 예외로 둘 수 있습니다 —
      문서 연결이 폴더 연결을 이깁니다.
      <div class="legend">
        <span><i class="l firm"></i>폴더 → 틀</span>
        <span><i class="l exc"></i>문서 예외</span>
        <span><i class="l draftw"></i>초안 (실행 전)</span>
        <span><i class="l own"></i>소속 — 어느 폴더에서 나왔나</span>
        <span><i class="l builtin"></i>내장 (형식이 정함)</span>
      </div>
    </div>
  </aside>

  <section class="panel canvaswrap">
    <div id="canvas" class="canvas">
      <svg id="wires" class="wires"></svg>
      <div id="nodes"></div>
      <div id="empty" class="empty">
        <p>왼쪽에서 폴더나 문서를 끌어다 놓고, <b>＋ 새 구조화</b> 로 틀을 놓으세요.</p>
        <p class="dim">노드 오른쪽 고리(●)에서 끌어 다른 노드에 놓으면 이어집니다.</p>
      </div>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
