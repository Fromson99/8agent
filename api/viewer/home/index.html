<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문서·데이터 관리</title>
<link rel="stylesheet" href="styles.css">
<!-- 예전 딥링크 호환 — 루트가 검수 화면이던 시절의 `/?doc=…` 을 그대로 넘긴다.
     화면이 그려지기 전에 돌려야 하므로 head 에서 동기로 처리한다. -->
<script>
  if (new URLSearchParams(location.search).has("doc"))
    location.replace("/structure/" + location.search + location.hash);
</script>
</head>
<body>

<header class="top">
  <h1>문서·데이터 관리</h1>
  <span class="sub" id="summary">불러오는 중…</span>
  <span class="grow"></span>
  <nav class="nav">
    <a class="navlink" href="/structure/">구조 해석 검수</a>
    <a class="navlink" href="/bindings/">구조화 연결</a>
    <a class="navlink" href="/glossary/">용어집</a>
    <a class="navlink" href="/links/">참조 연결</a>
    <a class="navlink" href="/rag/">질의응답</a>
    <a class="navlink" href="/agent6/">AGENT6</a>
    <a class="navlink" href="/logs/">로그</a>
  </nav>
</header>

<div id="banner" class="banner hidden"></div>

<main class="wrap">

  <!-- 저장 현황 — 파일이 정본인 시스템이라 "지금 무엇이 얼마나 있나"가 첫 정보다 -->
  <section id="stats" class="stats"></section>

  <!-- 올리기 — 끌어다 놓거나 클릭. 올리면 바로 구조 해석까지 돈다 -->
  <section class="dropwrap">
    <label id="drop" class="drop">
      <input type="file" id="file" accept="application/pdf,.xml,.hwp,.hwpx,.docx" multiple hidden>
      <b>PDF·HWP·DOCX·법령 XML 을 끌어다 놓거나 클릭해서 올리기</b>
      <span class="sub">올리면 바로 구조 해석이 돌고, 같은 파일을 다시 올리면 제자리 갱신됩니다
        (법령 XML 은 추론 없이 태그 계층 그대로 · HWP·DOCX 는 합성 지면 위에 섭니다)</span>
    </label>
    <div class="upopts">
      <input id="upFolder" list="folderList"
             placeholder="폴더 (선택) — 예: 법령문서"
             title="올리는 문서를 묶어 둘 폴더. 폴더에 구조화 틀을 연결하면 그 틀로 잘린다">
      <label class="chk" title="결정론이 못 가른 잔여만 배치 1콜로 묻는다 · 틀 만들기에서는 마커 유도에 쓴다 (ANTHROPIC_API_KEY 필요)">
        <input type="checkbox" id="useLlm"> LLM 잔여 해소 · 틀 유도
      </label>
    </div>
  </section>
  <datalist id="folderList"></datalist>
  <div id="uplist" class="uplist"></div>

  <!-- 처리된 문서 — 이름이 정보다. 연필로 바로 고친다 -->
  <section class="pane">
    <div class="panehead">
      <b id="docTitle">문서</b>
      <button id="mkFolder" title="빈 폴더를 먼저 만들어 두고 문서를 넣을 수 있습니다">＋ 폴더 만들기</button>
      <input id="q" type="search" placeholder="이름·폴더로 찾기">
      <span class="grow"></span>
      <span class="sub">이름을 바꿔도 내용 해시(id)와 해석 결과는 그대로입니다</span>
    </div>
    <div id="docs" class="docs"></div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
