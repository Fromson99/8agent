<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>검토 지식 E2E 실행 결과</title>
<style>body{font:16px/1.7 system-ui,sans-serif;background:#f2f5f6;color:#182c39;margin:0}main{max-width:1080px;margin:auto;padding:40px 24px}header{border-bottom:2px solid #254c61;padding-bottom:24px}h1{font-size:32px;margin:8px 0}h2{font-size:22px}a{color:#176658}.tag{font-size:13px;letter-spacing:.08em;color:#496474}article{background:white;border:1px solid #d8e2e6;border-radius:12px;padding:28px;margin:24px 0}.status{float:right;padding:3px 12px;border-radius:6px;background:#edf1f4}.pass{background:#d6eee4;color:#235744}.answer{white-space:pre-wrap;border-left:3px solid #43856d;padding:4px 20px}.meta{color:#526675;font-size:14px}.row{display:flex;gap:24px;flex-wrap:wrap}details{margin-top:16px}pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}button{font:inherit;padding:8px 14px;background:#173e51;color:white;border:0;border-radius:6px;cursor:pointer}code{background:#e6ecef;padding:3px}#message{padding:20px}footer{color:#526675;padding-top:30px}</style>
<main><header><div class="tag">LOCAL E2E · ADR-0959</div><h1>검토 지식에서 실제 답변까지</h1><p id="environment">실행 기록을 읽고 있습니다.</p><div class="row"><a href="/legal-knowledge/">지식 편집·게시 화면 →</a><button onclick="load()">기록 새로고침</button></div></header><p>보유 원문을 그대로 조회한 공개 질문 3건입니다. 지식 게시 → 기존 RAG 입력 → 원문 조사 → 인용 답변 → 동일 요청 재사용을 확인합니다.</p><section id="cases"></section><footer>이 화면은 저장된 실행 결과를 보여줍니다. 법률 정답률·속도 개선·Oracle 및 GENOS 현장 검증 결과를 뜻하지 않습니다. 새 질문 실험은 별도 실행 명세와 예산으로 기록합니다.</footer></main>
<script>
function node(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}
async function load(){const r=await fetch('/e2e/results');if(r.status===401){location.href='/e2e/login';return}const data=await r.json();document.querySelector('#environment').textContent=data.environment;const root=document.querySelector('#cases');root.replaceChildren();for(const c of data.cases){const a=node('article','');const label=c.status==='FAILED'?(c.error_code==='429'?'공급자 제한 (429)':'실행 실패'):c.status==='PASS_LIMITED'?'원문 전달 · 결론 미확정':c.answer_coverage==='PARTIAL'?'부분 답변 · 연결 확인':'인용 답변 · 연결 확인';a.append(node('span',label,'status '+(c.status.startsWith('PASS')?'pass':'')),node('div',c.topic_reference+' 공개 주제','tag'),node('h2',c.question));if(c.answer){const answer=node('div','','answer');for(const block of c.answer.text.split(/\n\n+/)){const p=node('p','');for(const part of block.split(/(\*\*[^*]+\*\*)/g)){p.append(part.startsWith('**')&&part.endsWith('**')?node('strong',part.slice(2,-2)):document.createTextNode(part))}answer.append(p)}a.append(answer)}else a.append(node('p',c.error||'아직 실행하지 않았습니다. 터미널에서 e2e.py run을 실행하세요.'));a.append(node('p',`모델 ${c.model_calls??0}회 · ${Math.round(c.seconds??0)}초 · 중복 요청 ${c.duplicate_additional_calls===0?'추가 호출 0회':'검사 미실행'}`,'meta'));if(c.knowledge){const refs=c.knowledge.bindings.flatMap(b=>b.items);a.append(node('p','적용 지식 '+refs.map(i=>i.ref.id+' / v'+i.ref.revision+' / '+i.application_status).join(', '),'meta'));const d=node('details','');d.append(node('summary','적용 버전·미확인 사항'),node('pre',JSON.stringify(c.knowledge,null,2)));a.append(d)}const link=node('a','원본 API 응답');link.href='/e2e/receipt/'+encodeURIComponent(c.case_id);a.append(link);root.append(a)}}load().catch(e=>{document.querySelector('#cases').textContent='기록을 읽지 못했습니다: '+e.message});
</script></html>
