name: Ontology pipeline contract

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - "00_SYSTEM/ONTOLOGY_PIPELINE.json"
      - "00_SYSTEM/SCHEMAS/**"
      - "01_DATA/CONTRACTS/**"
      - "02_BACKEND/lawrag/ontology/**"
      - "02_BACKEND/lawrag/core/batch.py"
      - "02_BACKEND/lawrag/core/legal_graph/**"
      - "02_BACKEND/lawrag/pipeline/ontology.py"
      - "02_BACKEND/lawrag/api/routers/pipeline.py"
      - "02_BACKEND/lawrag/api/viewer/pipeline/**"
      - "05_TESTS/LEGACY_TESTS/core/test_ontology_pipeline.py"
      - "08_DEPLOYMENT/CI/ontology_pipeline_check.sh"
      - ".github/workflows/ontology-pipeline.yml"
  push:
    tags:
      - "ontology-v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install contract test dependencies
        run: >-
          python -m pip install -e .
          pytest jsonschema==4.26.0 fastapi==0.141.1 httpx pyyaml requests numpy
      - name: Validate ontology lifecycle
        env:
          PYTHON_BIN: python
        run: 08_DEPLOYMENT/CI/ontology_pipeline_check.sh
      - name: Build reusable Python package
        run: python -m pip wheel --no-deps --no-build-isolation --wheel-dir 90_RUNTIME/OUT/wheels .
      - name: Upload deployable package
        uses: actions/upload-artifact@v4
        with:
          name: lawrag-ontology-${{ github.sha }}
          path: 90_RUNTIME/OUT/wheels/*.whl
          if-no-files-found: error
          retention-days: 14
