name: SSOT contracts
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '00_SYSTEM/**'
      - '01_DATA/CONTRACTS/**'
      - '02_BACKEND/PIPELINE/**'
      - '02_BACKEND/ENGINES/**'
      - '06_TOOLS/AUDIT/legal_semantic_contract.py'
      - '06_TOOLS/AUDIT/pipeline_data_contract.py'
      - '06_TOOLS/pipeline.py'
      - '05_TESTS/CONTRACTS/**'
      - '.github/workflows/ssot-contracts.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema==4.26.0' pytest
      - run: python -B 06_TOOLS/AUDIT/legal_semantic_contract.py --check
      - run: python -B 06_TOOLS/AUDIT/pipeline_data_contract.py
      - run: python -B 06_TOOLS/pipeline.py check
      - run: python -B -m pytest -q -o addopts= -o cache_dir=/tmp/ssot-pytest-cache 05_TESTS/CONTRACTS
