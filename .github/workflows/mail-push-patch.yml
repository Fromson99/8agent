name: Mail push patch ZIP

on:
  push:
  workflow_dispatch:
    inputs:
      recipient:
        description: "받는 이메일(비우면 PATCH_MAIL_TO 변수, 그것도 없으면 발신 Gmail)"
        required: false
        type: string
      before_sha:
        description: "비교 시작 SHA(비우면 현재 커밋의 부모)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  mail-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select push range
        id: range
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          INPUT_BEFORE: ${{ inputs.before_sha }}
        run: |
          before="${INPUT_BEFORE:-$EVENT_BEFORE}"
          if [[ -z "$before" ]]; then
            before="0000000000000000000000000000000000000000"
          fi
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and mail incremental ZIP
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PATCH_MAIL_TO: ${{ inputs.recipient || vars.PATCH_MAIL_TO }}
        run: |
          mkdir -p var/out/ship
          short_sha="${GITHUB_SHA:0:12}"
          safe_ref="${GITHUB_REF_NAME//\//-}"
          python scripts/push_patch_mail.py run \
            --before '${{ steps.range.outputs.before }}' \
            --after '${{ steps.range.outputs.after }}' \
            --out "var/out/ship/8agent-patch-${safe_ref}-${short_sha}.zip"
