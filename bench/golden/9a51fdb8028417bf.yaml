# 골든 구조 — **초안**. 페이지 그림을 모델에게 읽혀 받아 적은 계층이다.
#
#   문서    자본시장과 금융투자업에 관한 법률
#   원본    data/structure/9a51fdb8028417bf/source.pdf  (9쪽)
#   읽은이  claude-sonnet-5 (페이지 그림 9장, 쪽마다 한 번씩)
#   만든것  scripts/golden_vlm.py · 물음과 답은 bench/golden/_raw/9a51fdb8028417bf/ 에
#
# ## 이 파일의 쓸모는 회귀가 아니라 **눈금 맞추기**다
#
# 이 문서는 law.go.kr **XML 에서 들여온 것**이라 계층을 원천이 선언한다(`제1편`,
# `제2장`, `제3절` … 전부 태그다). 즉 정답을 이미 안다. 그래서 여기서 재는 것은
# 우리 해석이 아니라 **골든을 만드는 방법 자체**다 — 그림만 보고 읽힌 모델이
# 선언된 정답과 얼마나 맞나.
#
#   161줄 중 160줄 일치 (99%). 틀린 1줄은 아래 `# 모델 오답`.
#
# 그 1줄이 어떤 종류의 실수인지가 중요하다. `제38조(상호)` 는 `제1관 신의성실의무
# 등` 소속인데 모델은 한 단 위(`제1절`)로 봤다. 관이 어디까지 거느리는지는
# **들여쓰기로 드러나지 않고 서수 열로만 드러난다** — 그리고 이 PDF 는 XML 에서
# 합성한 것이라(`core/structure/synthpdf.py`) 실물 인쇄본의 들여쓰기가 아예 없다.
# 그림으로 못 보는 축에서 틀렸다는 뜻이므로, 실물 PDF(금소법)에는 이 실수가 그대로
# 옮겨간다고 볼 수 없다. 다만 **관·절의 사정거리는 모델이 약한 자리**임은 남는다.
#
# 쪽은 띄엄띄엄 골랐다(8-10, 15-17, 114-116). 편·장·절·관·조·항·호·목이 모두
# 한 번씩은 나오도록 고른 것이고, 각 묶음은 이어진 쪽이라 쪽 넘김도 재진다.
#
# ## 왜 블록 번호로 적나
#
# 마디 id 는 해석할 때마다 바뀐다. 블록 번호(`idx`)는 파싱 산출의 읽기 순서라
# 재해석해도 그대로다 — 규칙을 고쳐 가며 전후를 재려면 눈금이 변하지 않아야
# 한다.
#
# ## 뿌리는 왜 expect 에 없나
#
# `golden_check` 는 '뿌리다' 와 '마디를 못 세웠다' 를 둘 다 부모 없음으로 읽는다.
# 뿌리를 채점하면 마디를 아예 놓친 경우가 헛통과한다. 그래서 `roots:` 로 빼서
# 사람이 읽게만 두고 점수에는 넣지 않는다.

