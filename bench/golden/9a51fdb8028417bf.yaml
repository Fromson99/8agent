roots:
  - {block: 178, kind: 호, text: "4. 제336조에 따른 종합금융회사"}
  - {block: 179, kind: 호, text: "5. 제355조제1항에 따라 인가를 받은 자(이하 \"자금중개회사\"라 한다)"}
  - {block: 180, kind: 호, text: "6. 제360조제1항에 따라 인가를 받은 자(이하 \"단기금융회사\"라 한다)"}
  - {block: 181, kind: 호, text: "7. 제365조제1항에 따라 등록한 자(이하 \"명의개서대행회사\"라 한다)"}
  - {block: 182, kind: 호, text: "8. 제370조에 따라 설립된 금융투자 관계 단체"}
  - {block: 183, kind: 항, text: "<18> 이 법에서 \"집합투자기구\"란 집합투자를 수행하기 위한 기구로서 다음 각 호의 것을 말한다. <개정 "}
  - {block: 192, kind: 항, text: "<19> 이 법에서 \"사모집합투자기구\"란 집합투자증권을 사모로만 발행하는 집합투자기구로서 대통령령으로 정하는"}
  - {block: 195, kind: 항, text: "<20> 이 법에서 \"집합투자재산\"이란 집합투자기구의 재산으로서 투자신탁재산, 투자회사재산, 투자유한회사재산"}
  - {block: 196, kind: 항, text: "<21> 이 법에서 \"집합투자증권\"이란 집합투자기구에 대한 출자지분(투자신탁의 경우에는 수익권을 말한다)이 "}
  - {block: 197, kind: 항, text: "<22> 이 법에서 \"집합투자규약\"이란 집합투자기구의 조직, 운영 및 투자자의 권리ㆍ의무를 정한 것으로서 투"}
  - {block: 198, kind: 항, text: "<23> 이 법에서 \"집합투자자총회\"란 집합투자기구의 투자자 전원으로 구성된 의사결정기관으로서 수익자총회, "}
  - {block: 199, kind: 항, text: "<24> 이 법에서 \"신탁\"이란 「신탁법」 제2조의 신탁을 말한다. <개정 2011.7.25>"}
  - {block: 200, kind: 항, text: "<25> 이 법에서 \"금융투자상품거래청산업\"이란 금융투자업자 및 대통령령으로 정하는 자(이하 \"청산대상업자\""}
  - {block: 201, kind: 항, text: "<26> 이 법에서 \"신용평가업\"이란 다음 각 호의 어느 하나에 해당하는 것에 대한 신용상태를 평가(이하 \""}
  - {block: 204, kind: 항, text: "<27> 이 법에서 \"온라인소액투자중개업자\"란 온라인상에서 누구의 명의로 하든지 타인의 계산으로 다음 각 호"}
  - {block: 207, kind: 항, text: "<28> 이 법에서 \"일반 사모집합투자업\"이란 집합투자업 중 일반 사모집합투자기구를 통한 집합투자를 영업으로"}
  - {block: 208, kind: 항, text: "<29> 이 법에서 \"일반 사모집합투자업자\"란 집합투자업자 중 일반 사모집합투자업을 영위하는 자를 말한다. "}
  - {block: 209, kind: 항, text: "<30> 이 법에서 \"기업성장집합투자업\"이란 집합투자업 중 제229조제6호에 따른 기업성장집합투자기구를 통한"}
  - {block: 210, kind: 항, text: "<31> 이 법에서 \"기업성장집합투자업자\"란 집합투자업자 중 기업성장집합투자업을 영위하는 자를 말한다. <신"}
