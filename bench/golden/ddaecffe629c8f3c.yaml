# 골든 구조 — **초안**. 페이지 그림을 모델에게 읽혀 받아 적은 계층이다.
#
#   문서    금융소비자 보호에 관한 법률 (금소법)
#   원본    data/structure/ddaecffe629c8f3c/source.pdf  (25쪽)
#   읽은이  claude-sonnet-5 (페이지 그림 25장, 쪽마다 한 번씩)
#   만든것  scripts/golden_vlm.py · 물음과 답은 bench/golden/_raw/ddaecffe629c8f3c/ 에
#
# ## 어디까지 사람이 봤나
#
# 기계가 적은 정답에 코드를 맞추면 틀린 정답을 굳히게 된다. 그래서 **현재 해석과
# 어긋난 7줄은 사람이 원문을 보고 확정했다.** 나머지 561줄은 현재 해석과 이미
# 일치하므로 따로 보지 않았다 — 둘이 같다고 둘 다 옳은 것은 아니지만, 그건 이
# 골든이 아니라 다른 방법으로 잡을 문제다.
#
#   `# 애매`  모델이 스스로 확신 없다고 한 줄 21건. 부모는 현재 해석과 같다.
#
# ## 확정한 7줄 — 5건은 모델이 틀렸고 2건은 우리가 틀렸다
#
# **블록 601 (제69조 ①~⑤)** — 한 블록이 마커를 둘 얹고 있다:
#
#     [blk 601] 제69조(과태료) ① 다음 각 호의 어느 하나에 해당하는 자에게는 …
#
# `제69조` 와 `①` 이 같은 줄에 있다. 우리 해석은 이 블록에서 마디 **둘**을 연다
# (제69조 → ①). 그런데 골든은 `블록 → 부모` 한 줄뿐이라 그 사실을 적을 수 없다.
# 모델은 블록 하나에 답 하나만 낼 수 있어서 601 의 부모를 602(제 자식)로, ②~⑤ 를
# 제68조(600) 밑으로 보냈다. 둘 다 틀렸다 — ⑤ 가 "제1항부터 제4항까지에 따른
# 과태료는" 이라고 스스로 밝히므로 ①~⑤ 는 한 조(제69조) 안이다. 601→591(제8장),
# ②~⑤→601 로 고쳤다. **이건 우리 해석의 결함이 아니라 골든 형식의 한계다.**
#
# **블록 645·647 (`<599>`, `<600>부터 <626>까지`)** — 여기는 우리가 틀렸다.
# 부칙 제7조(다른 법률의 개정)의 항 번호가 ⑳을 넘어가 `<599>` 꼴로 인쇄되는데,
# 우리는 이 마커 계열을 몰라 **마디를 아예 세우지 못한다**(645·647 둘 다 마디가
# 아니다). 모델 말이 맞다. 고치지 않고 그대로 둔다 — 골든이 잡아야 할 구멍이다.
#
# ## `1)` 은 목으로 묶여 있다
#
# 별표·부칙의 `가. → 1) → …` 에서 `1)` 계열은 판정 종류에 값이 없어 목으로
# 들어갔다(`# 애매` 21줄이 대부분 이것이다). **부모는 옳다** — 축 이름만 뭉뚱그려져
# 있으므로 `목_부모` 점수를 읽을 때 두 계열이 섞여 있음을 감안하라.
#
# ## 왜 블록 번호로 적나
#
# 마디 id 는 해석할 때마다 바뀐다. 블록 번호(`idx`)는 파싱 산출의 읽기 순서라
# 재해석해도 그대로다 — 규칙을 고쳐 가며 전후를 재려면 눈금이 변하지 않아야
# 한다.
#
# ## 뿌리는 왜 expect 에 없나
#
# `golden_check` 는 '뿌리다' 와 '마디를 못 세웠다' 를 둘 다 부모 없음으로 읽는다.
# 뿌리를 채점하면 마디를 아예 놓친 경우가 헛통과한다. 그래서 `roots:` 로 빼서
# 사람이 읽게만 두고 점수에는 넣지 않는다.

