  - {block: 58, kind: 조, text: "제4조(금융회사등의 업종구분) 금융회사등은 다음 각 호에서 정하는 바에 따라 이 법에 따른 금융상품직접판매업"}
  - {block: 75, kind: 조, text: "제5조(적용범위) 이 법은 「자본시장과 금융투자업에 관한 법률」 제6조제5항제1호에 해당하는 경우에는 적용하"}
  - {block: 76, kind: 조, text: "제6조(다른 법률과의 관계) 금융소비자 보호에 관하여 다른 법률에서 특별히 정한 경우를 제외하고는 이 법에서"}
  - {block: 77, kind: 장, text: "제2장 금융소비자의 권리와 책무 및 국가와 금융상품판매업자등의 책무"}
  - {block: 101, kind: 장, text: "제3장 금융상품판매업자등의 등록 등"}
  - {block: 139, kind: 장, text: "제4장 금융상품판매업자등의 영업행위 준수사항 제1절 영업행위 일반원칙"}
  - {block: 346, kind: 장, text: "제5장 금융소비자 보호"}
  - {block: 467, kind: 장, text: "제6장 감독 및 처분"}
  - {block: 583, kind: 장, text: "제7장 보칙"}
  - {block: 591, kind: 장, text: "제8장 벌칙"}
  - {block: 636, kind: 부칙, text: "부칙 <제21065호,2025. 10. 1.>(정부조직법)"}

