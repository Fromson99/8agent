id: C-17
name: 위법계약해지권 고지
type: 존재형
when: always
note: >
  대기 중인 앵커: 준칙 17-③의 제목이 "위법계약의 해지" 이고 실측 2회(목차·제목)다. 본문에
  거의 반복되지 않는 제목 용어라 해소가 정확할 가능성이 높지만, KOFIA-R 이 배차되지 않아
  지금 걸면 이미 해소된 이 항목이 미해소로 바뀐다. 배차 후
  `{ doc: KOFIA-R, term: 위법계약의 해지 }` 를 추가한다.
basis:
  - { doc: KSB, section: "제47조", note: "위법계약의 해지" }
operational_definition: >
  판매규제 위반이 있었던 경우 고객이 계약의 해지를 **요구할 수 있다**는 권리를 고지했는지
  판정한다. 일반 중도해지(B-13)와는 다른 권리다 — "중도해지 가능"은 이 항목의 충족이 아니다.
  위반 사실을 안 날부터 일정 기간이라는 조건까지 말하면 더 좋지만, 권리의 존재가 전달되면
  충족으로 본다.
  근거는 **PB의 발화만** 인정한다.
  판정은 낱말이 아니라 뜻으로 한다.
  위반 예: 위법계약해지권 언급이 전혀 없는 경우, "중도해지는 언제든 가능하십니다"(다른 권리),
  "문제 생기면 저한테 말씀하세요, 알아서 처리해 드립니다"(권리 고지가 아니라 개인적 약속),
  "그런 일은 없을 테니 아실 필요 없습니다"(권리 고지를 회피).
  적법 예: "판매 과정에 법 위반이 있었다면 정해진 기간 안에 계약 해지를 요구하실 수 있습니다",
  "설명이 빠졌거나 잘못됐다면 위법계약해지를 신청하실 권리가 있습니다",
  "위반 사실을 아신 날부터 1년 안에 계약 해지를 요구하실 수 있습니다".
few_shot:
  - { utterance: "판매 과정에 법 위반이 있으면 위법계약해지를 요구하실 수 있습니다.", verdict: PASS, reason: "권리 고지" }
  - { utterance: "중도해지는 언제든 가능하십니다.", verdict: FAIL, reason: "일반 해지와 혼동 — 위법계약해지권 고지가 아니다" }
  - { utterance: "설명이 빠졌거나 잘못된 게 있으면 계약 해지를 신청하실 권리가 있습니다.", verdict: PASS, reason: "낱말은 달라도 권리의 내용이 전달됨" }
  - { utterance: "문제 생기면 저한테 바로 말씀하세요. 제가 알아서 처리해 드립니다.", verdict: FAIL, reason: "법적 권리가 아니라 개인적 약속 — 고지가 아니다" }
  - { utterance: "그런 일 생길 리 없으니 굳이 아실 필요는 없습니다.", verdict: FAIL, reason: "권리 고지 회피" }
judgment_hints:
  fail_route: PB보완
  unclear_route: 준법감시큐
