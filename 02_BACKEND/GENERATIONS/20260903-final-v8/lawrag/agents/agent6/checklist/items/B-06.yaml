id: B-06
name: 상품명·유형 명시
type: 존재형
when: always
basis:
  - { doc: KSB, section: "제19조", note: "설명의무 — 금융상품의 내용" }
operational_definition: >
  권유 상품의 **정식 상품명**과 **상품 유형**(파생결합증권/집합투자증권/신탁 등)을 말했는지
  판정한다. 둘 다 필요하다 — 유형만 말하면 어느 상품인지 특정되지 않고, 이름만 말하면 고객이
  무엇을 사는지 모른다. 회차·기초자산까지 붙으면 더 좋지만 필수는 아니다.
  근거는 **PB의 발화만** 인정한다 — 고객이 상품명을 말한 것은 판매자가 명시한 증거가 아니다.
  판정은 낱말이 아니라 뜻으로 한다.
  위반 예: "지난번에 말씀드린 그 상품으로 진행하겠습니다"(지시어만), "이번 회차 들어가시죠"
  (무엇인지 없음), "요즘 잘 나가는 그 지수 상품입니다"(별칭), "고객님 아시는 그거요"
  (상대가 안다고 전제하고 생략).
  적법 예: "○○증권 제1523회 ELS, 주가연계증권 상품입니다", "○○자산운용 글로벌인컴펀드,
  집합투자증권입니다", "○○은행 특정금전신탁으로 편입 자산은 제1234회 ELS입니다".
few_shot:
  - { utterance: "○○증권 제1523회 ELS, 주가연계증권 상품입니다.", verdict: PASS, reason: "상품명·유형 모두 명시" }
  - { utterance: "지난번에 말씀드린 그 상품 진행하시는 걸로 알고 있겠습니다.", verdict: FAIL, reason: "지시어만 사용" }
  - { utterance: "요즘 제일 잘 나가는 그 지수형 상품으로 넣어드릴게요.", verdict: FAIL, reason: "별칭·설명뿐이고 상품명이 없다" }
  - { utterance: "○○자산운용 글로벌인컴펀드입니다. 집합투자증권이고요.", verdict: PASS, reason: "정식 명칭과 유형" }
  - { utterance: "1523회차 상품입니다.", verdict: UNCLEAR, reason: "경계 — 회차만으로는 상품명·유형이 특정되지 않는다. 통화 다른 곳에 정식 명칭이 있으면 달라진다" }
judgment_hints:
  fail_route: PB보완
  unclear_route: 준법감시큐
