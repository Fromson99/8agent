id: C-19
name: 계약서류 제공 안내
type: 존재형
when: always
note: >
  대기 중인 앵커: 준칙 17-①의 제목이 "계약서류의 교부" 이고 '계약서류' 실측 준칙 15회 /
  KSB 8회 / 시행령 18회다. KOFIA-R 배차 후 `{ doc: KOFIA-R, term: 계약서류 }` 를 추가한다
  (지금 걸면 이미 해소된 이 항목이 미해소로 바뀐다).
basis:
  - { doc: KSB, section: "제23조", note: "계약서류의 제공" }
operational_definition: >
  계약서류(계약서·약관·설명서 등)를 제공한다는 **사실**과 **제공 방법**(교부·우편·이메일 등)을
  안내했는지 판정한다. 둘 다 필요하다 — 준다고만 하고 어떻게 받는지 말하지 않으면 경계다.
  근거는 **PB의 발화만** 인정한다.
  판정은 낱말이 아니라 뜻으로 한다.
  위반 예: 서류 제공 언급이 전혀 없는 경우, "서류는 굳이 안 보셔도 되니 신경 쓰지 마세요"
  (제공 안내가 아니라 열람 억제), "서류는 나중에 필요하시면 말씀하세요"(제공 의무를 요청
  대기로 바꿈), "요즘은 다 전산이라 종이는 안 나갑니다"(제공 자체를 부정).
  적법 예: "계약서와 상품설명서는 등록된 이메일로 오늘 중 보내드리겠습니다",
  "청약이 완료되면 계약서류 일체를 우편으로 발송해 드립니다",
  "설명서는 지금 앱으로 바로 전송해 드리고 계약서는 체결 후에 교부됩니다".
few_shot:
  - { utterance: "계약서와 상품설명서는 등록된 이메일로 오늘 중 보내드리겠습니다.", verdict: PASS, reason: "제공 사실과 방법 안내" }
  - { utterance: "서류는 굳이 안 보셔도 되니 신경 쓰지 마세요.", verdict: FAIL, reason: "제공 안내가 아니라 열람 억제" }
  - { utterance: "서류는 나중에 필요하시면 말씀하세요.", verdict: FAIL, reason: "제공을 요청 대기로 바꿈 — 안내가 아니다" }
  - { utterance: "청약 완료되면 계약서류 일체를 우편으로 발송해 드립니다.", verdict: PASS, reason: "제공 시점과 방법 제시" }
  - { utterance: "계약서류는 당연히 드립니다.", verdict: UNCLEAR, reason: "경계 — 제공 사실은 있으나 방법이 없다" }
judgment_hints:
  fail_route: PB보완
  unclear_route: 준법감시큐
