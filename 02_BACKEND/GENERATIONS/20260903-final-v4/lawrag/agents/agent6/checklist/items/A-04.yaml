id: A-04
name: 투자자정보(투자성향) 확인 실시
type: 존재형
when: always
note: >
  KOFIA-R 근거를 코퍼스 ID 만 적던 것에서 용어 앵커로 바꿨다. 실측: 준칙에
  '투자자정보확인서' 39회 / '투자자성향' 74회 / '투자자정보' 143회(KSB·시행령은 모두 0회).
  준칙 8.(투자자정보 파악 및 투자자성향 분석 등)이 이 항목의 절차를 규정하는 자리다.
basis:
  - { doc: KSB, section: "제17조", note: "적합성 원칙 — 정보 파악 의무의 법 근거" }
  - { doc: KOFIA-R, term: 투자자정보확인서, note: "준칙 8. 투자자정보 파악·투자자성향 분석 — 실측 39회" }
operational_definition: >
  투자권유 전에 투자자정보(투자목적·재산상황·투자경험·손실감내수준 등)를 확인하거나, 이미
  확인된 투자성향을 고객에게 재확인했는지 판정한다. **확인 행위**가 있어야 하며, PB의 단정
  ("성향은 아실 테니")이나 정보 언급만으로는 충족이 아니다. 기존 정보의 유효성을 고객에게 묻고
  답을 받은 왕복이면 충족이다.
  근거는 **PB의 발화만** 인정한다 — 고객이 "저 위험중립형이에요"라고 스스로 말한 것은 판매자가
  확인 절차를 수행한 증거가 아니다(다만 PB의 질문에 대한 답이면 왕복의 일부다).
  판정은 낱말이 아니라 뜻으로 한다.
  위반 예: 투자성향 언급 없이 상품 설명으로 직행, "성향 조사는 형식적인 거니까 그냥 넘어갈게요",
  "지난번 그대로 위험중립형으로 처리해 두겠습니다"(확인이 아니라 통보),
  "고객님 정도면 공격투자형 나오시죠"(PB가 대신 단정).
  적법 예: "투자자정보 확인서 작성하신 게 2025년 3월이고 위험중립형으로 나와 있는데 변동
  없으신가요?", "투자 목적과 손실을 어느 정도까지 감내하실 수 있는지 몇 가지 여쭐게요",
  "직전 확인서가 유효기간이 지나서 오늘 다시 여쭤보고 성향을 새로 산출하겠습니다".
few_shot:
  - { utterance: "지난번 투자자정보 확인서상 위험중립형이신데 그대로 유지하시겠어요?", verdict: PASS, reason: "기존 투자성향 재확인" }
  - { utterance: "성향 조사는 형식적인 거니까 그냥 넘어갈게요.", verdict: FAIL, reason: "확인 절차 회피" }
  - { utterance: "지난번 그대로 위험중립형으로 처리해 두겠습니다.", verdict: FAIL, reason: "통보일 뿐 확인 행위가 없다" }
  - { utterance: "고객: 저 위험중립형인 거 알고 있어요. / PB: 네 그러면 바로 상품 설명 들어갈게요.", verdict: FAIL, reason: "고객 발화는 판매자의 확인 절차 이행 증거가 아니다" }
  - { utterance: "투자 목적하고 손실 감내 수준 몇 가지만 여쭙고 성향을 새로 산출하겠습니다.", verdict: PASS, reason: "정보 파악 행위" }
judgment_hints:
  fail_route: PB보완
  unclear_route: 준법감시큐
