id: B-15
name: 만기·투자기간 설명
type: 존재형
when: always
note: >
  대기 중인 앵커: 준칙에 '만기' 22회 / '투자기간' 14회 / '계약기간' 7회다. 준칙 8.의
  '투자목적을 고려한 투자기간' 과 14.(설명의무)가 근거지만, KOFIA-R 이 배차되지 않아 지금
  걸면 이미 해소된 이 항목이 미해소로 바뀐다. 배차 후 `{ doc: KOFIA-R, term: 투자기간 }`.
basis:
  - { doc: KSB, section: "제19조", note: "설명의무 — 계약기간" }
operational_definition: >
  상품의 만기(또는 권장 투자기간)를 **기간이나 날짜**로 말했는지 판정한다. "장기", "묻어두시면"
  같은 정성적 표현은 기간이 아니다. 만기가 없는 상품이면 권장 투자기간이나 환매 가능 시점이
  기간으로 제시돼야 한다.
  근거는 **PB의 발화만** 인정한다.
  판정은 낱말이 아니라 뜻으로 한다.
  위반 예: "장기로 보고 가시면 됩니다"(기간 불명), "그냥 길게 보고 묻어두시면 됩니다",
  "기간은 크게 신경 안 쓰셔도 됩니다"(설명 대신 무력화), 만기 언급이 아예 없는 경우.
  적법 예: "만기는 3년으로 2029년 8월 5일입니다", "권장 투자기간은 2년 이상입니다",
  "최장 3년이고 조기상환되면 그 시점에 끝납니다".
few_shot:
  - { utterance: "만기는 3년으로 2029년 8월 5일입니다.", verdict: PASS, reason: "만기를 기간과 날짜로 명시" }
  - { utterance: "그냥 길게 보고 묻어두시면 됩니다.", verdict: FAIL, reason: "기간이 특정되지 않음" }
  - { utterance: "기간이야 뭐 크게 신경 안 쓰셔도 되는 상품입니다.", verdict: FAIL, reason: "설명 대신 기간의 의미를 무력화" }
  - { utterance: "최장 3년이고 조기상환되면 그 시점에 종료됩니다.", verdict: PASS, reason: "최장 기간과 종료 조건 제시" }
  - { utterance: "만기는 설명서 첫 장에 나와 있습니다.", verdict: UNCLEAR, reason: "경계 — 서류를 가리켰을 뿐 구두로 기간을 말하지 않았다" }
judgment_hints:
  fail_route: PB보완
  unclear_route: 준법감시큐
