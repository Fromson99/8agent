id: B-07
name: 원금손실 가능성 고지
type: 존재형
when: always
note: >
  대기 중인 앵커: 준칙에 '원금손실' 20회(KSB 0회·시행령 1회)로, 준칙 6.3)의 "원금손실
  가능성, 투자에 따른 손익은 모두 투자자에게 귀속된다는 사실 등…을 알려야 한다" 가 이 항목의
  행위 규범이다. KOFIA-R 이 배차되면 `{ doc: KOFIA-R, term: 원금손실 }` 을 추가한다.
  지금 걸면 이미 해소된 이 항목이 미해소로 바뀌어 confidence 만 떨어진다.
basis:
  - { doc: KSB, section: "제19조", note: "설명의무 — 투자성 상품의 손실 발생 가능성" }
operational_definition: >
  투자원금의 손실이 발생할 수 있다는 사실을 고객에게 고지했는지 판정한다. "위험이 있다"는
  일반적 언급으로는 부족하고 **투자한 원금이 줄어들 수 있음**이 드러나야 한다.
  근거는 **PB의 발화만** 인정한다 — 고객이 "원금 깨질 수 있는 거 알아요"라고 말한 것은
  판매자가 고지했다는 증거가 아니다.
  판정은 낱말이 아니라 뜻으로 한다. 문장 어딘가에 '원금손실'이 들어 있어도 그 문장이 손실
  가능성을 **부정**하면 고지가 아니라 반대 진술이다.
  위반 예: "변동성이 조금 있긴 한데 크게 신경 쓰실 정도는 아닙니다"(완곡 표현으로 대체),
  "원금 손실은 사실상 없다고 보시면 됩니다"(낱말은 있으나 뜻이 반대), "지수가 여기서 더
  내려갈 일은 없으니 안심하셔도 됩니다"(손실 가능성 자체를 부인), 원금 언급이 아예 없는 경우.
  적법 예: "이 상품은 원금이 보장되지 않고 손실이 발생할 수 있습니다",
  "기초자산이 기준선 아래로 떨어지면 투자하신 원금이 줄어든 채로 돌아옵니다",
  "최악의 경우 넣으신 돈의 상당 부분을 잃으실 수 있다는 점을 먼저 말씀드립니다".
few_shot:
  - { utterance: "이 상품은 원금이 보장되지 않고 손실이 발생할 수 있습니다.", verdict: PASS, reason: "원금손실 가능성 명시" }
  - { utterance: "변동성이 조금 있긴 한데 크게 신경 쓰실 정도는 아닙니다.", verdict: FAIL, reason: "완곡 표현일 뿐 원금손실 고지가 아니다" }
  - { utterance: "원금 손실은 사실상 없다고 보시면 됩니다.", verdict: FAIL, reason: "낱말은 들어 있으나 손실 가능성을 부정하는 진술이다" }
  - { utterance: "기초자산이 기준선 아래로 내려가면 넣으신 원금이 줄어든 채로 돌아옵니다.", verdict: PASS, reason: "원금이 줄어들 수 있음이 드러남" }
  - { utterance: "고객: 원금 깨질 수도 있는 거죠? / PB: 네 맞습니다.", verdict: UNCLEAR, reason: "경계 — 고객이 말하고 PB는 긍정만 했다. 판매자의 고지로 보기 어렵다" }
judgment_hints:
  fail_route: PB보완
  unclear_route: 준법감시큐
