id: E-27
name: 고령투자자 보호절차 안내
type: 존재형
when: customer_age >= 65
note: >
  §3의 when 'age≥65' 를 옮긴 것.
  근거를 코퍼스 ID 만 적던 것(KOFIA-R)과 미수집 코퍼스(REC)에서 용어 앵커 둘로 바꿨다.
  실측: '고령투자자' 가 준칙 69회 / KSB 0회 / 시행령 0회, '조력자' 가 준칙 10회 / 나머지 0회다.
  준칙 목차 11.이 "고령투자자에 대한 금융투자상품 판매시 보호 기준"(19p)이며, 손으로 조 번호를
  세는 방식으로는 찾을 수 없던 자리다. 만 65세 기준도 그 절에서 재확인한다.
basis:
  - { doc: KOFIA-R, term: 고령투자자, note: "준칙 11. 고령투자자에 대한 금융투자상품 판매시 보호 기준. 실측 69회(KSB 0회·시행령 0회)" }
  - { doc: KOFIA-R, term: 조력자, note: "준칙 — 가족 등 조력자 지정·연락처 확인. 실측 10회" }
operational_definition: >
  고령투자자에게 적용되는 보호절차 중 **최소 하나 이상**을 실제로 안내했는지 판정한다.
  보호절차의 예: 조력자(가족 등) 지정·연락처 확인, 관리직 직원의 사전 확인, 전담창구 이용,
  지정인 확인 서비스, 추가 숙려·재확인 절차.
  근거는 **PB의 발화만** 인정한다 — 고객이 "아들한테 물어볼게요"라고 말한 것은 판매자가
  보호절차를 안내한 증거가 아니다.
  판정은 낱말이 아니라 뜻으로 한다. 나이를 배려하는 말투는 보호절차가 아니며, 반대로 절차의
  이름을 부르지 않아도 그 절차를 실제로 안내하면 충족이다.
  위반 예: 고령 관련 안내가 전혀 없는 경우, "연세도 있으신데 복잡한 건 제가 알아서 처리해
  드릴게요"(보호가 아니라 판단 위임 유도 — D-25 동반 검토), "천천히 설명드릴게요"
  (배려일 뿐 절차가 아님), "가족분 동의 같은 건 없어도 됩니다"(절차를 면제해 주는 안내),
  "자녀분 연락처는 굳이 안 주셔도 진행됩니다".
  적법 예: "만 65세 이상 고객님은 조력자 확인 절차가 있어 가족분 연락처를 확인드립니다",
  "가입 전에 관리직 직원이 한 번 더 확인 전화를 드리게 됩니다",
  "원하시면 자녀분과 함께 들으실 수 있도록 다시 시간을 잡아드리겠습니다".
few_shot:
  - { utterance: "만 65세 이상 고객님은 조력자분 확인 절차가 있어 가족분 연락처를 확인드립니다.", verdict: PASS, reason: "고령자 보호절차 안내" }
  - { utterance: "연세도 있으신데 복잡한 건 제가 알아서 처리해 드릴게요.", verdict: FAIL, reason: "보호절차가 아니라 판단 위임 유도" }
  - { utterance: "가입 전에 관리직 직원이 한 번 더 확인 전화를 드릴 겁니다.", verdict: PASS, reason: "낱말은 달라도 관리직 사전 확인 절차를 안내" }
  - { utterance: "자녀분 연락처 같은 건 굳이 안 주셔도 진행됩니다.", verdict: FAIL, reason: "보호절차를 면제해 주는 안내 — 절차 이행이 아니다" }
  - { utterance: "고객: 아들한테 한번 물어볼게요. / PB: 네 그러세요.", verdict: FAIL, reason: "고객이 스스로 말한 것이며 판매자의 보호절차 안내가 아니다" }
judgment_hints:
  fail_route: PB보완
  unclear_route: 준법감시큐
