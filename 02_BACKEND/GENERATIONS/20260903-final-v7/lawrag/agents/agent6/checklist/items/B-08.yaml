id: B-08
name: 예금자보호 미적용 고지
type: 존재형
when: always
basis:
  - { doc: KSB, section: "제19조", note: "설명의무 — 예금자보호 여부는 중요사항이다" }
operational_definition: >
  해당 상품이 예금자보호법의 보호를 받지 않는다는 사실을 고지했는지 판정한다. 보호 대상이
  아니라는 **부정 사실**이 전달돼야 하며, 예금자보호를 언급조차 하지 않은 것은 미충족이다.
  근거는 **PB의 발화만** 인정한다.
  판정은 낱말이 아니라 뜻으로 한다. "예금자보호"라는 말을 쓰지 않아도 "은행이 망하면 돌려받을
  길이 없다"는 뜻이 전달되면 충족이다.
  위반 예: 예금자보호 언급이 전사 어디에도 없는 경우, "은행에서 파는 거라 5천만원까지는
  보호됩니다"(사실과 다름 — 이 항목 FAIL이자 D-22 위반 후보), "예금이나 마찬가지라고 보시면
  됩니다"(보호 여부를 오인시킴), "그런 건 따질 필요 없는 상품입니다"(회피).
  적법 예: "이 상품은 예금자보호법에 따른 보호를 받지 않는 상품입니다",
  "예금과 달라서 예금보험공사가 보장해 주는 5천만원 한도에 포함되지 않습니다",
  "은행에서 가입하시지만 예금이 아니라 투자상품이라 원금 보호 장치는 없습니다".
few_shot:
  - { utterance: "이 상품은 예금자보호법에 따른 보호를 받지 않는 상품입니다.", verdict: PASS, reason: "미적용 사실 고지" }
  - { utterance: "은행에서 파는 거라 5천만원까지는 보호됩니다.", verdict: FAIL, reason: "사실과 다른 설명 — D-22 동반 검토" }
  - { utterance: "예금과 달라서 예금보험공사 보장 한도에는 들어가지 않습니다.", verdict: PASS, reason: "낱말은 달라도 미적용 사실이 전달됨" }
  - { utterance: "예금자보호는 뭐 그런 건 따질 필요 없는 상품이에요.", verdict: FAIL, reason: "언급은 했으나 미적용 사실을 전달하지 않고 회피" }
  - { utterance: "예금자보호 여부는 설명서 앞쪽에 다 적혀 있습니다.", verdict: UNCLEAR, reason: "경계 — 서류로 미룬 것이 구두 고지인지 판단이 갈린다" }
judgment_hints:
  fail_route: PB보완
  unclear_route: 준법감시큐
