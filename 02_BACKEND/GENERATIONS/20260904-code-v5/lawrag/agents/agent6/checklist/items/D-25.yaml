id: D-25
name: 투자 재촉·강요 표현 없음
type: 부재형
when: always
note: >
  근거를 두 개로 고쳤다. 예전에는 `{doc: KOFIA-R}` 하나뿐이라 조문을 특정할 수 없었다.
  (a) 금소법 제21조 제6호 나목이 "계약의 체결권유를 받은 금융소비자가 이를 거부하는 취지의
  의사를 표시하였는데도 계약의 체결권유를 계속하는 행위" 를 금지한다 — 이미 해소된 좌표다.
  (b) 준칙 13.의 제목이 "투자권유시 유의사항" 이고 실측 2회(목차·제목)라 앵커로 정확하다.
  그 절이 "☞ 금소법제21조" 를 달고 같은 금지행위를 현장 화법으로 풀어 놓는다.
basis:
  - { doc: KSB, section: "제21조", note: "부당권유 금지 — 제6호 나목: 거부 의사 표시 후의 계속 권유" }
  - { doc: KOFIA-R, term: 투자권유시 유의사항, note: "준칙 13. — 금소법 제21조를 현장 행위로 푼 절. 실측 2회(제목 용어)" }
operational_definition: >
  고객이 충분히 판단할 시간을 갖지 못하도록 재촉하거나, 거절 의사를 무시하고 권유를 계속했는지
  판정한다. 판정 단위는 발화 하나가 아니라 **대화의 흐름**이다 — 고객이 유보·거절 의사를 밝힌
  뒤에도 같은 권유가 이어지면 개별 문장이 정중해도 위반이다.
  **낱말 목록으로 판정하지 않는다.** 마감·한정 수량을 근거로 즉시 결정을 요구하는 것,
  숙려·상의를 불이익으로 제시하는 것, 거절을 되묻는 것이 모두 여기 들어온다.
  위반 예: "오늘까지만 가능한 물량이라 지금 바로 결정하셔야 합니다",
  "이번 회차 놓치면 다음은 조건이 훨씬 나쁩니다", 고객이 "생각해 보겠다"고 한 뒤에도 같은
  권유를 세 번 이상 반복, "가족분과 상의하시면 다들 반대만 하십니다"(상의를 방해),
  "지금 전화 끊으시면 이 조건은 못 잡습니다", "그냥 제가 넣어드릴게요, 어차피 하실 거잖아요"
  (의사 확인 없이 진행).
  적법 예: "청약 마감은 금요일까지입니다. 충분히 검토하시고 연락 주세요",
  "오늘 결정 안 하셔도 됩니다. 자료 보내드릴 테니 가족분과 상의해 보세요",
  "생각해 보시겠다니 여기까지 하고 필요하시면 다시 연락 주세요".
few_shot:
  - { utterance: "오늘까지만 가능한 물량이라 지금 바로 결정하셔야 합니다.", verdict: FAIL, reason: "마감을 근거로 즉시 결정 강요" }
  - { utterance: "고객: 좀 생각해 볼게요. / PB: 생각하실 게 뭐 있습니까, 지금 바로 하시죠.", verdict: FAIL, reason: "유보 의사를 표시했는데도 권유를 계속" }
  - { utterance: "가족분들과 상의하시면 다들 반대만 하실 겁니다.", verdict: FAIL, reason: "상의를 방해해 판단 시간을 빼앗음" }
  - { utterance: "청약 마감은 금요일까지니 충분히 검토하시고 연락 주세요.", verdict: PASS, reason: "사실 고지 + 숙고 권유" }
  - { utterance: "이번 회차는 한도가 얼마 안 남았습니다.", verdict: UNCLEAR, reason: "경계 — 사실 고지일 수도, 압박일 수도 있다. 뒤에 결정을 요구하면 FAIL 쪽이다" }
judgment_hints:
  fail_route: 준법감시큐
  unclear_route: 준법감시큐
