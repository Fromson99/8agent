# 참조 서술어 — 마커를 인용으로 만드는 술어 (조사 가드가 쓴다)
#
# 마커 뒤에 조사가 붙고, 그 근처에 이 술어가 오면 그 마커는 확실히 참조다.
# `1.1의 원칙을 준용`, `제3장의 규정에 따른다`, `제19조에서 정한 바에 의하여`.
#
# 조사 없이 이 술어만 있는 것은 신호가 아니다 — 한 블록 안에 참조 문장이 있다는
# 사실만으로 그 블록을 **여는** 마커가 참조가 되지는 않기 때문이다(SPEC §5.1 에서
# 이 줄이 '조사 부착' 행에 딸려 있는 이유).
version: 1

predicates:
  - 준용
  - 따른다
  - 따라
  - 따라서
  - 정한
  - 정하는
  - 정하여
  - 규정
  - 의한다
  - 의하여
  - 의거
  - 갈음
  - 준하여
  - 적용한다
  - 명시된
  - 기재된
