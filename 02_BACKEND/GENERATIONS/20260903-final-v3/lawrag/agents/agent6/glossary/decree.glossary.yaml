# 금소법 시행령 용어집 — **문서 안의 앵커** (SPEC §1, AGENT6 §2)
#
# 구조는 법률과 같은 조→항→호→목이지만 **doc_type 이 다르므로 형식 파일도 별개**다
# (형식·용어집·등록부 세 곳의 doc_type 이 일치해야 라우터가 배차한다).
#
# ## 이 용어집이 지금 쓰이지 않는다는 사실을 먼저 적는다
#
# 코퍼스에 있는 시행령은 `KSB-D-2021.pdf`(2021-03-25 시행 제정안, `superseded: true`)
# 하나뿐이고, 현행이 아니므로 basis 로 쓰지 않는 것이 원칙이다 — 코퍼스 빌드에서
# SKIPPED 로 남는다. 게다가 그 사이드카는 `doc_type: 금소법` 을 선언하고 있어, 설령
# 빌드에 들어오더라도 **이 용어집이 아니라 statute 쪽으로 배차된다.** 아래 용어는 그래서
# 현행 시행령(`KSB-D.pdf`)이 들어왔을 때 바로 쓸 수 있도록 미리 확인해 둔 씨앗이다.
#
# ## 실측 (KSB-D-2021.pdf 129p, decree.format.json 으로 라우터 실행 2026-08-05)
#
# 조 제목은 법률과 같은 이유로 **fact 가 되지 않는다** — `조` regex 마커가 "제13조(설명의무)"
# 를 통째로 먹는다. 그래서 전부 `[section]` 이고 value_type 은 기본값 text 다
# (법령에서 뽑을 "값"은 없다. 필요한 것은 위치다). 아래 괄호가 제목 앵커가 가리키는 조다.
#
#   총칙 1(제1장)   벌칙 1(제6장)
#   적합성원칙 1(제11조)   적정성원칙 1(제12조)   설명의무 1(제13조)   설명서 등 1(제14조)
#   불공정영업행위의 금지 1(제15조)   부당권유행위 1(제16조)   계약서류의 제공의무 1(제20조)
#   자료의 기록 및 유지ᆞ관리 등 1(제24조)   청약의 철회 1(제37조)   위법계약의 해지 1(제38조)
#   과태료 1(제53조)
#
# 넣지 않은 것:
#   · "금융소비자 보호"(제4장 제목) — 제28조(금융소비자보호실태평가)·제29조(금융소비자보호기준)
#     제목에도 걸려 세 곳이 된다. 모호한 앵커를 미리 심어 둘 이유가 없다.
#   · "부칙" — 형식의 `부칙` regex 마커가 경계로 잡되 **제목을 갖지 않아** 제목 앵커가
#     되지 못한다. 부칙은 좌표로 인용하라(`{ doc: KSB-D, section: 부칙 }`).
#   · fact 용어 — 이 문서로 확인할 fact 앵커 수요가 아직 없다. 없는 것을 미리 선언하면
#     적합도 게이트의 fact_coverage 만 깎인다(금소법 용어집 주석의 실측 참조).
#
# ## 문자 함정 — 가운뎃점이 문서마다 다르다
#
# 시행령 원문의 "유지ᆞ관리" 는 U+119E(HANGUL JUNGSEONG ARAEA)를, 법률 원문의
# "유지ㆍ관리" 는 U+318D 를 쓴다. `normalize()` 는 둘 다 글자로 보아 지우지 않으므로
# **서로 매칭되지 않는다.** 표제어는 이 문서의 실제 문자(U+119E)로 두고, 법률 표기를
# 별칭으로 붙여 어느 쪽으로 물어도 같은 자리로 가게 했다.

version: 1
doc_type: 금소법시행령

terms:
  # --- 장 제목 ----------------------------------------------------------------
  총칙:
    kind: [section]
    note: 제1장
  벌칙:
    kind: [section]
    note: 제6장

  # --- 6대 판매규제의 위임 조문 -------------------------------------------------
  적합성원칙:
    kind: [section]
    note: 제11조. 법 제17조의 위임
  적정성원칙:
    kind: [section]
    note: 제12조. 법 제18조의 위임
  설명의무:
    kind: [section]
    note: 제13조. 법 제19조의 위임
  설명서 등:
    kind: [section]
    note: 제14조. 설명서의 형식·교부 방법
  불공정영업행위의 금지:
    kind: [section]
    aliases: [불공정영업행위]
    note: 제15조
  부당권유행위:
    kind: [section]
    aliases: [부당권유행위 금지, 부당권유]
    note: 제16조. 표제어는 법률 용어집과 같은 모양으로 맞췄다
  계약서류의 제공의무:
    kind: [section]
    aliases: [계약서류]
    note: 제20조
  자료의 기록 및 유지ᆞ관리 등:
    kind: [section]
    aliases: [자료의 기록 및 유지ㆍ관리 등]
    note: >
      제24조. 표제어의 가운뎃점은 이 문서가 쓰는 U+119E, 별칭은 법률(KSB)이 쓰는 U+318D 다.
      둘은 normalize 로 접히지 않는다.

  # --- 사후 구제 ---------------------------------------------------------------
  청약의 철회:
    kind: [section]
    aliases: [청약철회]
    note: 제37조
  위법계약의 해지:
    kind: [section]
    aliases: [위법계약해지]
    note: 제38조
  과태료:
    kind: [section]
    note: 제53조
