id: B-14
name: 조기상환 조건 설명
type: 존재형
when: "product_type in [ELS, ELB, DLS, DLB, ELT, ELF]"
note: >
  §3의 when "ELS류" 를 상품 유형 목록으로 명시화한 것. ELT·ELF 는 ELS 를 신탁·펀드로 감싼
  형태로 조기상환 구조가 동일하므로 함께 넣었다. 목록에 없는 유형이 들어오면 비활성되지만,
  product_type 자체가 없으면 UNKNOWN → 보수적 활성이다.
  용어 앵커 대기: 준칙에 '조기상환' 4회로, 14.(설명의무)의 "조기상환조건이 있는 경우 그에
  관한 사항" 이 근거다. 4회는 얇아 해소가 흔들릴 수 있으니 배차 후 section 과 함께 건다.
basis:
  - { doc: KSB, section: "제19조", note: "설명의무 — 금융상품의 구조" }
operational_definition: >
  조기상환 평가일·조건(기초자산 가격 기준선)과 조기상환되지 않았을 때의 진행을 설명했는지
  판정한다. 조건 없이 "6개월마다 상환 기회가 있다"만 말하면 미충족이다 — 이 항목이 보는 것은
  기회의 존재가 아니라 **조건**이다.
  근거는 **PB의 발화만** 인정한다.
  판정은 낱말이 아니라 뜻으로 한다.
  위반 예: "6개월이면 보통 상환됩니다"(조건 없음 + 단정 — D-20 동반 검토), "6개월마다 상환
  기회가 옵니다"(기회만, 기준선 없음), "조건은 복잡하니 넘어가고 결론만 말씀드리면 잘
  나옵니다"(설명 회피 + 단정), "웬만하면 첫 평가일에 끝납니다"(확률을 단정).
  적법 예: "6개월마다 평가해서 두 기초자산 모두 최초 기준가의 90% 이상이면 조기상환되고,
  아니면 다음 평가일로 넘어갑니다", "조기상환 기준선은 6·12개월 90%, 18·24개월 85%입니다",
  "평가일에 하나라도 기준선 아래면 상환되지 않고 만기까지 갑니다".
few_shot:
  - { utterance: "6개월마다 평가해서 두 지수 모두 최초 기준가의 90% 이상이면 조기상환됩니다.", verdict: PASS, reason: "평가주기와 조건 명시" }
  - { utterance: "6개월이면 거의 다 조기상환돼서 나옵니다.", verdict: FAIL, reason: "조건 미설명 + 단정적 판단(D-20 동반)" }
  - { utterance: "6개월마다 상환 기회가 한 번씩 옵니다.", verdict: FAIL, reason: "기회만 말하고 기준선을 말하지 않았다" }
  - { utterance: "평가일에 하나라도 기준선 아래면 상환 안 되고 다음 평가일로 넘어갑니다.", verdict: PASS, reason: "상환되지 않을 때의 진행까지 설명" }
  - { utterance: "조건은 복잡해서 설명서에 다 있고요, 결론만 보시면 됩니다.", verdict: FAIL, reason: "조건 설명을 서류로 미루고 결론만 제시" }
judgment_hints:
  fail_route: PB보완
  unclear_route: 준법감시큐
