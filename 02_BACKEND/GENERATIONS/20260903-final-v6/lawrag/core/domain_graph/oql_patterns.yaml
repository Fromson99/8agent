  - {name: predicate_concept_ids, type: concept_ids, required: false}
  - {name: object_concept_ids, type: concept_ids, required: false}
  - {name: target_concept_ids, type: concept_ids, required: false}
  - {name: method_concept_ids, type: concept_ids, required: false}
  - {name: modality_concept_ids, type: concept_ids, required: false}
  - {name: condition_concept_ids, type: concept_ids, required: false}
  - {name: effect_concept_ids, type: concept_ids, required: false}
