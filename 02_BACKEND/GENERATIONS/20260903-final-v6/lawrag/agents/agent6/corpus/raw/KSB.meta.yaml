# --- 실제 라우터로 돌려 본 결과 (2026-08-05) --------------------------------
# router.route(KSB.pdf, doc_type="금소법") → 요소 650, section 555, 잔여 0, 게이트 92% 통과
# 제1~69조 결번 0. 요구 좌표 9개 전부 해소:
#   KSB/제21조/제1호 = "불확실한 사항에 대하여 단정적 판단을 제공하거나 확실하다고
#                      오인하게 할 소지가 있는 내용을 알리는 행위"  ← D-20 의 근거 그대로
# --- 페이지 장식 (발췌에서 걷어낸다) ----------------------------------------
# docling 이 이 줄을 page_header 로 분류하지 않고 본문으로 본다. 그대로 두면 조문
# 발췌 한가운데에 끼어 판정자에게 그대로 나간다(실측: KSB/제19조 발췌 3번째 줄).
# 빌더의 noise_candidates 가 25회 적중으로 제안한 패턴을 그대로 확정한다.
strip_patterns:
  - '^법제처\s\d+\s국가법령정보센터$'

notes:
  - 페이지마다 "법제처 N 국가법령정보센터" 머리글이 붙어 section content 에 섞인다 —
    위 strip_patterns 로 확정했다(2026-08-06).
  - "항 좌표는 원문자로 잡힌다: '제19조/제②항'. 체크리스트가 '제3항' 이라고 쓰면
    해소기가 제3항↔제③항 정규화를 해야 한다."
  - "**제1항(①)은 별도 section 이 되지 못한다** — 법령 원문에서 ① 이 조 제목 줄에
    이어 붙어 오기 때문에 그 조의 content 로 남는다(예: 제19조 ①). 그래서
    'KSB/제19조/제1항' 좌표는 해소되지 않는다. 제1항을 근거로 인용해야 하는 항목은
    조 좌표('KSB/제19조')로 잡거나, 해소기가 조 content 앞부분에서 ① 구간을 잘라 주어야 한다."
