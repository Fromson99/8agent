id: F-30
name: 고객 질문에 대한 성실 응답
type: 충분성형
when: customer_question_count >= 1
note: >
  §3의 when "고객 질문 존재 시" 를 옮긴 것. 질문 수는 전처리가 전사에서 세어 메타에 넣는다
  (판정기가 세지 않는다 — 같은 전사면 같은 값이어야 한다). 메타가 없으면 UNKNOWN →
  보수적 활성이며 confidence 가 한 단계 낮아진다.
  근거를 코퍼스 ID 만 적던 것에서 둘로 바꿨다. 질문 회피는 설명의무의 이면이므로 금소법
  제19조가 1차 근거이고(이미 해소된 좌표), 준칙 Ⅳ-3(설명의무)이 현장 행위를 푼다
  (실측 '설명의무' 준칙 36회 / KSB 1회 / 시행령 2회).
basis:
  - { doc: KSB, section: "제19조", note: "설명의무 — 중요사항을 이해할 수 있도록 설명할 의무" }
  - { doc: KOFIA-R, term: 설명의무, note: "준칙 Ⅳ-3 설명의무 — 실측 36회. 쉬운 용어 사용·이해여부 확인 등 응답의 질을 규정" }
operational_definition: >
  고객이 상품과 관련해 던진 질문마다 PB가 회피하지 않고 응답했는지 판정한다. 판정 단위는
  **질문-응답 쌍**이며, 하나라도 회피·묵살·화제 전환으로 처리된 질문이 있으면 FAIL이다.
  즉답이 어려운 질문에 "확인해서 알려드리겠다"고 답한 것은 성실 응답으로 본다 — 모르는 것을
  아는 척하는 것보다 낫다.
  판정은 낱말이 아니라 뜻으로 한다. 문장이 길고 친절해도 물은 것에 답하지 않았으면 회피다.
  위반 예: 고객 "원금 손실 나면 얼마나 잃나요?" → PB "그런 일은 잘 없습니다, 그래서 만기가
  3년인데요"(회피 + 단정 — D-20 동반 검토), 고객 "수수료가 얼마죠?" → PB "그건 서류에
  다 나와 있습니다"(서류로 미룸), 고객 질문에 아무 응답 없이 다음 설명으로 넘어감,
  고객 "다른 상품은 없나요?" → PB "이게 제일 좋습니다"(질문을 권유로 되받음),
  고객 "위험한 거 아닌가요?" → PB "고객님 정도 자산이면 이 정도는 하셔야죠"(질문을 무시).
  적법 예: 고객 "중간에 해지하면요?" → PB "그 시점 평가금액으로 정산돼서 원금 손실이 날 수
  있습니다", 고객 "세금은요?" → PB "세무 부분은 확인해서 오늘 중 다시 안내드리겠습니다",
  고객 "손실 나면 얼마까지?" → PB "최악의 경우 원금 전액입니다".
  이 항목은 유일하게 남는 순수 충분성 판정이라 초기 confidence 가 낮다 — FAIL·UNCLEAR 는
  모두 준법감시 큐로 보낸다(§3 주).
few_shot:
  - { utterance: "고객: 중간에 해지하면 어떻게 되나요? / PB: 그 시점 평가금액으로 정산돼서 원금 손실이 날 수 있습니다.", verdict: PASS, reason: "질문에 직접 응답" }
  - { utterance: "고객: 손실 나면 얼마나 잃나요? / PB: 그런 일은 잘 없습니다. 그래서 만기가 3년인데요.", verdict: FAIL, reason: "질문 회피 + 화제 전환" }
  - { utterance: "고객: 세금은 어떻게 되나요? / PB: 세무 부분은 확인해서 오늘 중 다시 안내드리겠습니다.", verdict: PASS, reason: "즉답 불가를 밝히고 후속 조치를 약속" }
  - { utterance: "고객: 수수료가 얼마인가요? / PB: 그건 보내드릴 서류에 다 나와 있습니다.", verdict: FAIL, reason: "물은 것에 답하지 않고 서류로 미룸" }
  - { utterance: "고객: 이거 위험한 거 아닌가요? / PB: 고객님 정도 자산이면 이 정도는 하셔야죠.", verdict: FAIL, reason: "질문을 무시하고 권유로 되받음" }
judgment_hints:
  fail_route: 준법감시큐
  unclear_route: 준법감시큐
