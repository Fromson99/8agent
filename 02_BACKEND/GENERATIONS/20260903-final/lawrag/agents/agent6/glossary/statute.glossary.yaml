# 금소법 용어집 — **문서 안의 앵커** (SPEC §1, AGENT6 §2)
#
# ## 용어집이 여기서 하는 일
#
# 법령은 값을 뽑는 문서가 아니다. 계약서에서 "신탁금액 = 5천만원"을 뽑듯 뽑을 값이
# 없다 — 필요한 것은 **위치**다("제19조가 무엇을 요구하는가"). 그래서 이 파일의 모든
# 용어는 value_type 이 text(기본값)이고, 용어의 쓸모는 값이 아니라 좌표다.
#
# 체크리스트의 basis 는 이 용어들로 근거를 지시한다:
#
#     basis: [{ doc: KSB, term: 설명의무 }]                     → KSB/제19조 로 해소된다
#     basis: [{ doc: KSB, term: 단정적 판단, section: 제21조 }]  → KSB/제21조/제1호
#
# 조 번호가 개정으로 밀려도 용어는 남는다. 준법 시스템에서 이 차이가 크다.
#
# ## kind 를 [section] 으로 둔 이유 — 실측이 정했다
#
# 이 문서의 조 제목은 **fact 가 되지 않는다.** 형식 파일의 `조` 마커
# ("^제(\d+)조\(([^)]{1,60})\)")가 제목 줄의 "제19조(설명의무)" 를 통째로 먹고 그 뒤만
# content 로 남기기 때문이다. 실제로 조·장 제목 16개를 `[section, fact]` 로 선언해
# 라우터를 돌려 본 결과 fact 는 7개(청약의 철회 6, 금융상품직접판매업자의 손해배상책임 1)뿐이었고
# fact_coverage 가 1.00 → 0.125 로 떨어져 적합도가 0.923 → 0.660 이 됐다(임계 0.60 턱밑).
# 게이트가 우는 것은 파싱이 틀려서가 아니라 **없는 fact 를 있다고 선언해서**다.
#
# 그래서 조·장 제목은 `[section]` 으로 두고, 앵커는 doc.json 의 `marker.title` 로 잡는다
# (해소기 `basis.resolve_term()` 의 1차 경로 = 제목 앵커). 본문에만 나오는 개념어만
# `[fact]` 이며, 실제로 fact 로 잡히는 것만 넣었다(아래 실측표).
#
# 형식 파일의 `term_markers` 는 비어 있다 — 여기 `[section]` 을 선언해도 구조화가 구역을
# 새로 열지는 않는다. 이 선언은 "이 문자열이 이 문서의 구역 제목이다"라는 어휘 등록이며,
# 앵커 해소와 컴파일 국면의 후보 승격이 그것을 읽는다.
#
# ## 실측 (KSB.pdf, 법률 제21065호 / 2026-01-02 시행. 라우터 실행 2026-08-05)
#
#   제목 앵커 — marker.title 이 걸리는 구역 수
#     적합성원칙 1(제17조)   적정성원칙 1(제18조)   설명의무 1(제19조)
#     불공정영업행위의 금지 1(제20조)   부당권유행위 1(제21조)
#     방문판매 및 전화권유판매 관련 준수사항 1(제21조의2)
#     금융상품등에 관한 광고 관련 준수사항 1(제22조)   계약서류의 제공의무 1(제23조)
#     자료의 기록 및 유지ㆍ관리 등 1(제28조)
#     금융상품판매업자등의 손해배상책임 1(제44조)   금융상품직접판매업자의 손해배상책임 1(제45조)
#     청약의 철회 1(제46조)   위법계약의 해지 1(제47조)
#     총칙 1(제1장)   보칙 1(제7장)   벌칙 3(제8장·제67조·제67조의2) ← 유일한 모호 용어
#
#   본문 앵커 — fact 가 잡히는 구역
#     단정적 판단 2(제19조/제③항, 제21조/제1호)   손실보전 1(제22조/제④항/제2호/가목)
#     이익보장 1(제22조/제④항/제2호/가목)         위험등급 1(제19조/제1호/나목)
#
#   넣지 않은 것 — 이 문서에 **없다**(원문 문자열 등장 0회):
#     고령투자자 0, 숙려기간 0, 투자자성향 0, 고난도금융투자상품 0.
#     이 넷의 근거는 표준투자권유준칙(KOFIA-R)에 있다. 없는 것을 있다고 쓰지 않는다.
#
# ## 별칭을 붙인 자리
#
# `normalize()` 가 공백·괄호를 지우므로 "적합성 원칙"↔"적합성원칙" 같은 띄어쓰기 변이에는
# 별칭이 필요 없다(같은 키로 접힌다). 글자가 실제로 다른 것만 별칭으로 둔다 —
# "청약철회"(원문 3회)↔"청약의 철회"(조 제목), "위법계약해지"(준칙 표기)↔"위법계약의 해지".

version: 1
doc_type: 금소법

terms:
  # --- 장 제목 (구역 경계) ----------------------------------------------------
  총칙:
    kind: [section]
    note: 제1장. 목적·정의·적용범위
  보칙:
    kind: [section]
    note: 제7장. 업무의 위탁·전속관할
  벌칙:
    kind: [section]
    note: >
      제8장. **제목이 세 곳에 걸린다**(제8장·제67조·제67조의2) — 앵커로 쓰면
      AMBIGUOUS 가 난다. section 을 함께 지정해 좁힐 것.

  # --- 6대 판매규제 (제17~21조) — 체크리스트 B·D·E 계열의 근거 ------------------
  적합성원칙:
    kind: [section]
    note: 제17조. 일반금융소비자 정보를 파악하고 부적합 상품을 권유하지 않을 의무
  적정성원칙:
    kind: [section]
    note: 제18조. 권유 없이 판매할 때도 적정성을 확인할 의무
  설명의무:
    kind: [section]
    note: 제19조. 상품 내용·위험·불이익 설명과 이해 확인
  불공정영업행위의 금지:
    kind: [section]
    aliases: [불공정영업행위]
    note: 제20조
  부당권유행위:
    kind: [section]
    aliases: [부당권유행위 금지, 부당권유]
    note: >
      제21조. 조 제목은 "부당권유행위 금지"이나 표제어는 행위 이름으로 둔다 —
      체크리스트가 "부당권유"로 물어도 같은 자리로 가게 별칭을 붙였다.

  # --- 전화판매·광고·서류 ------------------------------------------------------
  방문판매 및 전화권유판매 관련 준수사항:
    kind: [section]
    note: >
      제21조의2. 검증 대상이 전화 권유 판매 통화이므로 이 조가 A 계열(고지)의 근거다.
      "전화권유판매"로만 물으면 제16조의2(명부 작성)와 함께 걸려 모호해진다.
  금융상품등에 관한 광고 관련 준수사항:
    kind: [section]
    note: 제22조
  계약서류의 제공의무:
    kind: [section]
    aliases: [계약서류]
    note: 제23조
  자료의 기록 및 유지ㆍ관리 등:
    kind: [section]
    note: 제28조. 녹취 자료 보존의 근거

  # --- 사후 구제 (제44~47조) ---------------------------------------------------
  금융상품판매업자등의 손해배상책임:
    kind: [section]
    note: >
      제44조. "손해배상책임"만으로 물으면 제45조와 함께 걸린다 — 표제어를 조 제목
      전체로 둔 이유다.
  금융상품직접판매업자의 손해배상책임:
    kind: [section]
    note: 제45조
  청약의 철회:
    kind: [section]
    aliases: [청약철회]
    note: 제46조
  위법계약의 해지:
    kind: [section]
    aliases: [위법계약해지]
    note: 제47조

  # --- 본문 개념어 (조 제목이 아니다 — fact 로 잡힌다) --------------------------
  단정적 판단:
    kind: [fact]
    note: >
      제21조 제1호("불확실한 사항에 대하여 단정적 판단을 제공하거나")와 제19조 제3항에
      각각 나온다 — 두 곳이라 term 만으로는 AMBIGUOUS 다.
      D-20 은 `{ doc: KSB, term: 단정적 판단, section: 제21조 }` 로 좁히면 제21조/제1호로 간다.
  손실보전:
    kind: [fact]
    note: 제22조 제4항 제2호 가목("손실보전(損失補塡) 또는 이익보장이 되는 것으로 오인")
  이익보장:
    kind: [fact]
    note: 제22조 제4항 제2호 가목. 손실보전과 같은 문장이다
  위험등급:
    kind: [fact]
    note: 제19조 제1항 제1호 나목 3) — 투자성 상품의 위험등급 설명
