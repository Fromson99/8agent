id: D-23
name: 확실 오인 소지 표현 없음
type: 부재형
when: always
basis:
  - { doc: KSB, section: "제21조/제1호", note: "부당권유 금지 — 확실하다고 오인하게 할 소지가 있는 내용" }
operational_definition: >
  단정(D-20)까지는 아니지만 **확실한 것으로 오인하게 할 소지**가 있는 완곡·비유·확률 표현을
  썼는지 판정한다. D-20이 "무조건/100%"라면 이 항목은 "사실상/거의/~나 다름없다/웬만하면"이다.
  기준은 말의 형식이 아니라 **고객이 안전하다고 믿게 되는가**이다.
  **낱말 목록으로 판정하지 않는다.** 조건절("~하지 않는 한")·비유("예금 같은")·경험담·통계
  인용 어느 형태로 와도 결론이 "사실상 안전"이면 위반이다.
  D-20과 겹칠 수 있고, 같은 발화가 두 항목에서 FAIL 이 되는 것은 정상이다.
  위반 예: "나라가 망하지 않는 한 손실 볼 일은 없다고 보시면 됩니다",
  "사실상 예금이나 다름없는 상품이에요", "거의 확실하다고 보시면 됩니다",
  "이 정도 조건이면 웬만해선 안 깨집니다", "지수가 반토막 나야 손실인데 그런 일이 있겠습니까"
  (반문으로 가능성을 부인), "10년 통계상 손실 사례가 거의 없습니다"(통계로 안전 인상 형성).
  적법 예: "손실 확률은 낮게 설계돼 있지만 손실 가능성 자체는 남아 있습니다",
  "과거에 드물었다는 것이 앞으로 없다는 뜻은 아닙니다",
  "예금과 구조가 다르고 원금이 깨질 수 있는 상품입니다".
few_shot:
  - { utterance: "나라가 망하지 않는 한 손실 볼 일은 없다고 보시면 됩니다.", verdict: FAIL, reason: "조건절을 달았지만 결론은 안전의 확신이다" }
  - { utterance: "사실상 예금이나 다름없는 상품이에요.", verdict: FAIL, reason: "상품 성격을 오인하게 하는 비유" }
  - { utterance: "지수가 반토막이 나야 손실인데 그런 일이 있겠습니까.", verdict: FAIL, reason: "반문으로 손실 가능성을 부인 — 형식만 의문문이다" }
  - { utterance: "10년 통계로 보면 손실 난 사례가 거의 없습니다.", verdict: FAIL, reason: "통계 인용으로 확실하다는 인상을 만든다 — 미래는 통계가 보장하지 않는다" }
  - { utterance: "손실 확률은 낮게 설계돼 있지만 손실 가능성 자체는 남아 있습니다.", verdict: PASS, reason: "가능성을 명시해 오인 소지를 제거" }
  - { utterance: "구조상 안전장치가 두 겹으로 들어가 있는 상품입니다.", verdict: UNCLEAR, reason: "경계 — 구조 설명인지 안전 인상 형성인지 뒤 문맥에 달렸다" }
judgment_hints:
  fail_route: 준법감시큐
  unclear_route: 준법감시큐
