id: A-02
name: 고객 본인확인 실시
type: 존재형
when: always
note: >
  basis 를 비웠다. 걸 자리를 실측으로 찾아봤으나 없었다 — '본인확인' 은 KSB 0회 / 시행령 0회 /
  준칙 0회이고, '실명확인' 은 준칙에 1회뿐인데 그것도 대리인의 실명확인증표를 말하는 자리다.
  본인확인은 금소법이 아니라 금융실명법과 사내 기준의 영역이라 지금 코퍼스에는 근거가 없다.
  없는 조문을 지어 걸지 않고 비워 둔다(예전에는 `{doc: INT}` 라고만 적혀 있었는데, 그것은
  근거가 아니라 수집 대기 메모였고 어느 조문을 말하는지 아무도 몰랐다).
  INT(사내 녹취 체크리스트) 확보 시 용어를 세어 보고 앵커를 건다.
basis: []
operational_definition: >
  계약 상대방이 본인임을 확인하는 절차가 통화 안에서 실제로 수행됐는지 판정한다. 충족 조건은
  **PB가 식별정보를 묻고 고객이 그 정보를 답한 왕복**이다. 생년월일·주소·계좌번호 일부 등
  본인만 알 수 있는 정보여야 하며, 예/아니오로 답할 수 있는 확인은 식별이 아니다.
  판정은 낱말이 아니라 뜻으로 한다 — '본인확인'이라는 말을 쓰지 않아도 식별정보 왕복이 있으면
  충족이고, 그 말을 써도 왕복이 없으면 미충족이다.
  위반 예: PB가 "본인 맞으시죠?"라고만 묻고 고객이 "네"만 한 경우, "목소리 들으니 고객님
  맞으시네요"(식별이 아니라 인상), 본인확인 없이 바로 상품 설명으로 넘어간 경우,
  "본인확인은 나중에 서류에서 하시죠"(통화 안에서 수행되지 않음).
  적법 예: PB "생년월일 앞 여섯 자리 말씀해 주시겠어요?" → 고객 "630512입니다",
  PB "등록된 주소 앞부분만 확인 부탁드립니다" → 고객 "성남시 분당구요",
  PB "연결된 계좌 뒷번호 네 자리 불러 주시겠습니까?" → 고객 "8871입니다".
few_shot:
  - { utterance: "본인확인 먼저 하겠습니다. 생년월일 여섯 자리 말씀해 주시겠어요?", verdict: PASS, reason: "식별정보 확인 요청" }
  - { utterance: "본인 맞으시죠? 네 그럼 바로 설명드릴게요.", verdict: FAIL, reason: "식별정보 확인 없는 형식적 질문" }
  - { utterance: "목소리 들어보니 고객님 맞으시네요. 바로 진행할게요.", verdict: FAIL, reason: "식별정보 왕복 없음 — 인상은 확인 절차가 아니다" }
  - { utterance: "PB: 등록된 주소 앞부분만 확인 부탁드릴게요. / 고객: 성남시 분당구입니다.", verdict: PASS, reason: "식별정보를 고객이 답한 왕복" }
  - { utterance: "본인확인은 서류 보내드릴 때 같이 하겠습니다.", verdict: FAIL, reason: "통화 안에서 수행되지 않음 — 뒤로 미룬 것은 실시가 아니다" }
judgment_hints:
  fail_route: PB보완
  unclear_route: 준법감시큐
