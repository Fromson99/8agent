<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src data:; base-uri 'none'">
<title>골든 원문 매핑 검토</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#192333;font:15px/1.6 system-ui}header{padding:24px 32px;background:#142c44;color:white}h1{font-size:24px;margin:0}header p{margin:6px 0;color:#d0deec}.toolbar{display:flex;gap:12px;flex-wrap:wrap;padding:18px 32px;background:white;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:1}.toolbar input{width:180px}button{border:0;background:#14674f;color:white;padding:10px 18px;border-radius:6px;cursor:pointer}button.secondary{background:#e8edf2;color:#23394f}main{display:grid;grid-template-columns:290px 1fr;gap:22px;padding:24px 32px}nav{max-height:75vh;overflow:auto}nav button{display:block;text-align:left;width:100%;background:white;color:#23394f;margin:0 0 8px;border:1px solid #d9e0e7}nav button.active{border:2px solid #14674f}.card{background:white;border:1px solid #d9e0e7;padding:24px;border-radius:8px;margin-bottom:16px}label{display:block;font-weight:600;margin-top:14px}textarea,input,select{font:inherit;width:100%;padding:9px;border:1px solid #becbd7;border-radius:4px}textarea{min-height:92px}pre{font:inherit;white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6f8;padding:14px;max-height:360px;overflow:auto}.badge{display:inline-block;border-radius:4px;background:#fff1d5;padding:2px 8px;font-size:13px}.muted{color:#5c6b7c;font-size:13px}.alert{color:#a33320}input[type=checkbox]{width:auto}h2{font-size:20px;margin:0 0 14px}#message{padding:0 32px;color:#943719}details summary{cursor:pointer}@media(max-width:850px){main{grid-template-columns:1fr;padding:16px}nav{max-height:220px}.toolbar{position:static;padding:16px}}
</style>
<header><h1>질문과 정답 근거 연결하기</h1><p>① 질문·기준답변 확인 → ② 원문 후보와 근거 구절 확인 → ③ 문항 승인 → ④ JSON 내려받기</p><p id="summary"></p></header>
<div class="toolbar"><input id="reviewer" placeholder="검토자 이름"><button id="download">검토본 JSON 내려받기</button><button id="save" class="secondary">작업 저장</button><label style="margin:0;font-weight:400">작업 불러오기 <input type="file" id="restore" accept="application/json" style="width:230px"></label></div><p id="message" role="status"></p>
<main><nav id="cases"></nav><section id="editor"></section></main>
<script type="application/json" id="data">__GOLDEN_DATA__</script>
<script>
'use strict';
const bundle=JSON.parse(document.getElementById('data').textContent),draft=bundle.draft,rows=bundle.mappings,sources=bundle.sources;
let current=0; const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={UNIQUE_CANDIDATE:'원문 후보 1개 · 검토 필요',AMBIGUOUS:'동일 좌표 여러 개 · 버전 선택 필요',NOT_FOUND:'원문 없음 · 데이터 또는 입력 확인',TEXT_MISMATCH:'조문은 있으나 기존 근거 구절이 다름 · 확인 필요'};
function relevant(c){return rows.filter(r=>r.case_id===c.id)}
function invalidate(c){c.review={status:'draft',by:'',at:''};renderNav()}
function rebuild(c){const groups=new Map();for(const r of relevant(c)){if(!groups.has(r.group_id))groups.set(r.group_id,{id:r.group_id,role:r.target.role,any_of:[]});const s=sources[r.selected_source_id];if(s&&r.ref)groups.get(r.group_id).any_of.push(r.ref)}c.evidence_groups=[...groups.values()]}
function setSource(r,id){r.selected_source_id=id||null;const s=sources[id];if(!s){r.ref=null;return}const q=r.target.quote||'',b=s.blocks.find(b=>q&&b.text.includes(q))||s.blocks.find(b=>b.text.length>40)||s.blocks[0];r.ref={source_id:s.id,document_id:s.document_id,source_artifact_sha256:s.source_artifact_sha256,block_id:b.block_id,quote:q||b.text,locator:(r.target.coordinate_scope||'body')+' '+r.target.article+(r.target.hang_ho||'')}}
for(const r of rows)setSource(r,r.selected_source_id);
draft.cases.forEach(rebuild);
function renderNav(){const approved=draft.cases.filter(c=>c.review.status==='approved').length;$('summary').textContent=`${draft.cases.length}문항 · ${rows.length}개 근거 요청 · 승인 ${approved}문항 · 원문 연결은 답변 성능 평가가 아닙니다`;$('cases').innerHTML=draft.cases.map((c,i)=>`<button class="${i===current?'active':''}" data-case="${i}">${esc(c.id)} · ${c.review.status==='approved'?'승인':'검토 대기'}<br><small>${esc(c.question.slice(0,70))}</small></button>`).join('');document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{current=Number(b.dataset.case);render()})}
function render(){renderNav();const c=draft.cases[current],rs=relevant(c);$('editor').innerHTML=`<div class="card"><h2>${esc(c.id)}</h2><label>질문<textarea id="question">${esc(c.question)}</textarea></label><label>기준답변<textarea id="answer">${esc(c.reference_answer)}</textarea></label><label>필수 답변 내용 — 한 줄에 한 항목<textarea id="points">${esc(c.required_points.join('\n'))}</textarea></label><label>적용 기준일<input type="date" id="date" value="${esc(c.as_of)}"></label><p class="muted">기준일에 맞는 개정본인지 직접 확인하세요. 이름과 조문이 같다는 이유로 개정 전후가 같다고 보지 않습니다. 검색 범위는 정답 문서로 제한하지 않습니다.</p><details><summary>기존 골든의 주의사항</summary><pre>${esc(JSON.stringify(c.import_notes,null,2))}</pre></details></div>`;
for(const r of rs){const div=document.createElement('div');div.className='card';const s=sources[r.selected_source_id];div.innerHTML=`<h2>${esc(r.target.law)} ${esc(r.target.article)} ${esc(r.target.hang_ho||'')}</h2><span class="badge">${esc(labels[r.status])}</span><p class="muted">${esc(r.group_id)} · ${r.target.role==='required'?'필수 근거':'참고 근거'} · ${esc(r.target.coordinate_scope||'body')}</p><p>${esc(r.target.why||'')}</p><details><summary>기존 골든의 근거 구절</summary><pre>${esc(r.target.quote||'조문 수준 태그만 있음 — 근거 구절을 직접 지정하세요.')}</pre></details><label>원문 후보<select class="source"><option value="">직접 선택하세요</option>${r.candidate_ids.map(id=>`<option value="${esc(id)}" ${id===r.selected_source_id?'selected':''}>${esc(sources[id].document_name+' / '+sources[id].heading+' / '+sources[id].document_id)}</option>`).join('')}</select></label>${s?`<details><summary>조문 전체와 상위 구조 확인</summary><p>${esc((s.ancestors||[]).map(a=>a.title).join(' → '))}</p><pre>${esc(s.text)}</pre><p class="muted">원본 해시 ${esc(s.source_artifact_sha256)}</p></details><label>근거가 있는 원문 블록<select class="block">${s.blocks.map(b=>`<option value="${esc(b.block_id)}" ${b.block_id===r.ref?.block_id?'selected':''}>${esc(b.text.slice(0,140))}</option>`).join('')}</select></label><label>정답을 뒷받침하는 구절<textarea class="quote">${esc(r.ref?.quote||'')}</textarea></label><p class="muted">처음 제안된 블록이 정답 근거라는 뜻은 아닙니다. 정확한 항·호/단서를 선택하고 해당 블록에 있는 구절을 남기세요.</p>`:'<p class="alert">연결되지 않은 근거입니다. questions.csv의 문서명·조문·본칙/부칙을 확인하거나 해당 원문을 반입한 뒤 다시 import 하세요. 이 문항을 자동 제외하지 않습니다.</p>'}`;
div.querySelector('.source').onchange=e=>{setSource(r,e.target.value);rebuild(c);invalidate(c);render()};if(s){div.querySelector('.block').onchange=e=>{const b=s.blocks.find(b=>b.block_id===e.target.value);r.ref.block_id=b.block_id;r.ref.quote=b.text;rebuild(c);invalidate(c);render()};div.querySelector('.quote').oninput=e=>{r.ref.quote=e.target.value;rebuild(c);invalidate(c)}}$('editor').appendChild(div)}
const end=document.createElement('div');end.className='card';end.innerHTML='<label><input type="checkbox" id="checked"> 모든 근거의 버전·본문·필수 역할 및 기준답변을 확인했습니다.</label><button id="approve">이 문항 승인</button><p class="muted">승인 정보는 검토자 선언입니다. 다운로드 후 서버의 freeze 검증으로 좌표·해시·원문 일치를 다시 확인합니다.</p>';$('editor').appendChild(end);
for(const [id,key] of [['question','question'],['answer','reference_answer'],['date','as_of']])$(id).oninput=e=>{c[key]=e.target.value;invalidate(c)};$('points').oninput=e=>{c.required_points=e.target.value.split('\n').filter(x=>x.trim());invalidate(c)};
$('approve').onclick=()=>{try{if(!$('reviewer').value.trim()||!$('checked').checked)throw Error('검토자와 확인 체크가 필요합니다.');if(!c.question.trim()||!c.reference_answer.trim()||!c.required_points.length||!c.as_of)throw Error('질문·기준답변·필수 내용·기준일을 채워주세요.');if(!rs.length||rs.some(r=>!r.ref||!sources[r.selected_source_id]?.blocks.some(b=>b.block_id===r.ref.block_id&&r.ref.quote&&b.text.includes(r.ref.quote))))throw Error('미연결 근거 또는 원문에 없는 구절이 있습니다.');c.review={status:'approved',by:$('reviewer').value.trim(),at:new Date().toISOString()};renderNav();$('message').textContent=c.id+' 승인 완료. 검토본을 내려받아 저장하세요.'}catch(e){$('message').textContent=e.message}}}
function download(value,name){const blob=new Blob([JSON.stringify(value,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('download').onclick=()=>{draft.cases.forEach(rebuild);download(draft,draft.suite_id+'-reviewed.json');$('message').textContent='전체 문항을 내보냈습니다. 미승인/미연결 문항은 freeze에서 차단됩니다.'};
$('save').onclick=()=>download({schema_version:'golden-review-work-v1',binding:draft.mapping_binding,input:draft.import_provenance,cases:draft.cases,mappings:rows},draft.suite_id+'-work.json');
$('restore').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(x.schema_version!=='golden-review-work-v1'||JSON.stringify(x.binding)!==JSON.stringify(draft.mapping_binding)||JSON.stringify(x.input)!==JSON.stringify(draft.import_provenance)||x.cases.length!==draft.cases.length||x.mappings.length!==rows.length)throw Error('다른 원문 세대/입력의 작업 파일입니다.');if(x.cases.some((c,i)=>c.id!==draft.cases[i].id)||x.mappings.some((r,i)=>r.case_id!==rows[i].case_id||r.target_index!==rows[i].target_index||r.selected_source_id&&!rows[i].candidate_ids.includes(r.selected_source_id)))throw Error('문항 또는 후보가 일치하지 않습니다.');draft.cases=x.cases;rows.splice(0,rows.length,...x.mappings);draft.cases.forEach(rebuild);render();$('message').textContent='작업을 불러왔습니다.'}catch(err){$('message').textContent=err.message}};
render();
</script></html>
