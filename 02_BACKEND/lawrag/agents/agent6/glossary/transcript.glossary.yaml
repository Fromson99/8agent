# STT 전사 용어집 (SPEC §1)
#
# **비어 있는 것이 맞다.**
#
# 용어집은 "문서에서 값을 뽑을 용어"와 "구역 경계가 될 용어"를 적는 파일이다. 전사는
# 둘 다 해당하지 않는다:
#   - 구역 경계는 발화 마커(형식 파일의 `발화` regex)가 전부 잡는다. 제목이 없는 문서다.
#   - 전사에서 뽑을 "값"은 없다. 여기서 검증하는 것은 값이 아니라 **행위**이고
#     (설명했는가·권유했는가), 그 신호는 체크리스트 항목의 lexicon 이 담당한다
#     (AGENT6 §3). 그것을 용어집에 옮겨 적으면 판정 지식이 두 곳으로 갈라진다.
#
# fact 용어를 억지로 채우면 적합도 게이트의 fact_coverage 가 항상 미달로 울어
# 진짜 경고가 묻힌다. 필요해지면 그때 근거와 함께 추가한다(용어집은 살아있는 파일이다).

