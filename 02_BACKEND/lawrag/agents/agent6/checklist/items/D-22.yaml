id: D-22
name: 사실과 다른 설명 없음
type: 부재형
when: always
basis:
  - { doc: KSB, section: "제21조", note: "부당권유 금지 — 제2호: 금융상품의 내용을 사실과 다르게 알리는 행위" }
operational_definition: >
  상품의 객관적 사실(보호 여부·상품 성격·구조·과거 실적·비용·기관 승인 여부 등)을 사실과 다르게
  말했는지 판정한다. 다른 항목의 미고지(존재형 FAIL)와 달리 여기서는 **틀린 진술**이 있어야
  위반이다. 검증할 수 없는 것을 사실처럼 단언한 것도 위반으로 본다 — 고객은 그것을 확인할
  방법이 없기 때문이다.
  **낱말 목록으로 판정하지 않는다.** 상품 유형과 진술을 대조해 판단한다.
  위반 예: "은행 상품이라 예금자보호도 되고 정기예금이나 마찬가지입니다"(투자성 상품인데),
  "이 시리즈는 지금까지 손실 난 적이 한 번도 없습니다"(검증 불가한 실적 단언),
  "금융감독원이 승인한 상품입니다"(감독기관은 상품을 승인하지 않는다),
  "국채랑 같은 등급이라 부도날 일이 없습니다"(신용도를 사실과 다르게 대비),
  "수수료는 하나도 없습니다"(총보수가 있는데), "이건 원금보장형입니다"(원금비보장 구조인데).
  적법 예: "이 상품은 예금과 달라서 예금자보호 대상이 아닙니다",
  "과거 이 유형의 상환 실적은 공시된 자료 기준으로 이러합니다",
  "감독기관 승인 상품이 아니라 신고 절차를 거쳐 판매되는 상품입니다".
few_shot:
  - { utterance: "은행 상품이라 예금자보호도 되고 정기예금이나 마찬가지입니다.", verdict: FAIL, reason: "보호 여부와 상품 성격을 사실과 다르게 설명" }
  - { utterance: "이 시리즈는 지금까지 손실 난 적이 한 번도 없습니다.", verdict: FAIL, reason: "검증 불가한 실적 단언으로 오인 유발" }
  - { utterance: "금융감독원에서 승인받고 나온 상품이라 안심하셔도 됩니다.", verdict: FAIL, reason: "감독기관은 개별 상품을 승인하지 않는다 — 사실과 다른 권위 부여" }
  - { utterance: "이 상품은 예금과 달라서 예금자보호 대상이 아닙니다.", verdict: PASS, reason: "사실에 부합" }
  - { utterance: "수수료는 따로 없습니다.", verdict: UNCLEAR, reason: "경계 — 선취 수수료가 없다는 뜻인지 총보수까지 없다는 뜻인지 갈린다. 상품 정보와 대조가 필요하다" }
judgment_hints:
  fail_route: 준법감시큐
  unclear_route: 준법감시큐
