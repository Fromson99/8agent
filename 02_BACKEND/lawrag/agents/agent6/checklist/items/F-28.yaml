id: F-28
name: 고객 이해 확인(질문·응답 존재)
type: 존재형
when: always
note: >
  대기 중인 앵커: 준칙에 '이해여부' 6회('이해하였음' 6회)로, 14.(설명의무)와 11.(고령투자자
  보호)이 "고객의 이해여부를 확인하여야 한다" 를 적는다. 6회는 얇아 해소가 흔들릴 수 있으니
  KOFIA-R 배차 후 section 과 함께 건다. 지금 걸면 이미 해소된 이 항목이 미해소로 바뀐다.
basis:
  - { doc: KSB, section: "제19조/제3항", note: "설명 시 중요사항 누락·왜곡 금지 — 이해 확인의 근거" }
operational_definition: >
  설명 후 고객이 이해했는지 **확인하는 질문**과 그에 대한 **고객의 응답**이 한 쌍 이상 있는지
  판정한다. 확인 질문은 PB의 발화여야 하고, 응답은 고객의 발화여야 쌍이 성립한다.
  질문은 **상품의 내용·위험에 관한 것**이어야 한다. 통화 상태 확인("들리세요?")이나 인사치레는
  이해 확인이 아니다. 고객의 응답은 "네" 한 마디여도 응답으로 보되, 그 앞의 질문이 위험과
  무관하면 쌍 자체가 성립하지 않는다.
  판정은 낱말이 아니라 뜻으로 한다.
  위반 예: 20분 내내 PB만 발화하고 확인 질문이 없는 경우, "제 말 잘 들리시죠? 그럼
  계속하겠습니다"(통화 상태 확인), "다 아시는 내용이죠?"(이해를 전제하고 확인을 생략),
  "이해되셨죠? 자 그럼 다음으로 넘어가서…"(응답할 틈 없이 진행), "설명은 다 드렸습니다"
  (일방적 종료 선언).
  적법 예: PB "지금 설명드린 원금손실 가능성 부분은 이해되셨을까요?" → 고객 "네, 원금이
  깨질 수 있다는 거죠", PB "조기상환 조건 다시 설명드릴까요?" → 고객 "아니요 알겠습니다",
  PB "지금까지 중에 헷갈리시는 부분 있으실까요?" → 고객 "기준가 얘기가 좀…".
few_shot:
  - { utterance: "지금 설명드린 원금손실 부분은 이해되셨을까요?", verdict: PASS, reason: "위험 관련 이해 확인 질문" }
  - { utterance: "제 말 잘 들리시죠? 그럼 계속하겠습니다.", verdict: FAIL, reason: "통화 상태 확인일 뿐 이해 확인이 아니다" }
  - { utterance: "다 아시는 내용이죠? 그럼 넘어가겠습니다.", verdict: FAIL, reason: "이해를 전제하고 확인을 생략" }
  - { utterance: "PB: 지금까지 중에 헷갈리시는 부분 있으실까요? / 고객: 기준가 얘기가 좀 어렵네요.", verdict: PASS, reason: "확인 질문과 고객 응답이 쌍으로 존재" }
  - { utterance: "이해되셨죠? 자 그럼 다음 항목으로 가겠습니다.", verdict: UNCLEAR, reason: "경계 — 질문 형식이지만 응답을 기다리지 않았다. 고객 응답이 뒤따르면 달라진다" }
judgment_hints:
  fail_route: PB보완
  unclear_route: 준법감시큐
