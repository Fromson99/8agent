id: D-20
name: 단정적 판단 제공 없음
type: 부재형
when: always
note: >
  CASE(제재·분쟁조정 사례) 근거를 뺐다. 사례는 **근거 조문이 아니라 판정 예시**이며, 지금은
  few_shot 이 그 자리를 맡는다. 있지도 않은 코퍼스를 basis 에 걸어 두면 이 항목이 영영
  미해소로 남아 confidence 만 깎인다 — 실제로 그랬다.
  대기 중인 앵커: 준칙 13.(투자권유시 유의사항)이 "☞ 금소법제21조" 를 달고 같은 금지행위를
  나열한다('단정적 판단' 준칙 1회 / KSB 2회). 준칙 배차 후 검토한다.
basis:
  - { doc: KSB, section: "제21조/제1호", note: "부당권유 금지 — 불확실한 사항에 대한 단정적 판단 제공" }
operational_definition: >
  수익률·가격·조기상환·손실 등 **불확실한 미래 사항**을 확정된 것처럼 말했는지 판정한다.
  판정 단위는 발화가 고객에게 남기는 인상이다.
  **낱말 목록으로 판정하지 않는다.** "무조건", "100%" 같은 말이 없어도 뜻이 단정이면 위반이다.
  부정 표현이 문장 어딘가에 있다고 위반이 지워지지도 않는다 — "원금 보장은 안 됩니다만,
  떨어질 일은 없어요" 는 뒤 절이 위반이다.
  D-23(확실 오인 소지)과 겹칠 수 있다. 같은 발화가 두 항목에서 FAIL 이 되는 것은 정상이다.
  위반 예: "무조건 오릅니다", "6개월 뒤에는 무조건 조기상환됩니다",
  "지수가 여기서 더 내려갈 일은 없으니 안심하셔도 됩니다"(하락 가능성을 부인),
  "이 정도 레벨이면 손해 볼 일은 없다고 보시면 됩니다"(완곡하지만 결론은 단정),
  "이건 나라가 망하지 않는 한 안전해요"(조건을 달았지만 사실상 확정),
  "제가 20년 해봤는데 이런 건 다 상환 나옵니다"(경험을 근거로 미래를 확정).
  적법 예: "과거 이 유형의 상환 실적은 이러했습니다, 다만 미래를 보장하지는 않습니다",
  "원금 보장은 되지 않습니다", "상환 가능성은 기초자산 흐름에 따라 달라져 지금은 알 수 없습니다",
  "지수가 더 내려갈 수도 있고 그러면 손실이 납니다".
few_shot:
  - { utterance: "이건 나라가 망하지 않는 한 안전해요", verdict: FAIL, reason: "조건을 달았을 뿐 결론은 손실 없음의 단정이다" }
  - { utterance: "지수가 여기서 더 내려갈 일은 없으니 안심하셔도 됩니다", verdict: FAIL, reason: "금지어가 하나도 없지만 불확실한 미래(지수 하락)를 부인한 단정이다" }
  - { utterance: "6개월 뒤에는 무조건 조기상환되니까 걱정 안 하셔도 됩니다", verdict: FAIL, reason: "불확실한 상환을 확정적으로 단정" }
  - { utterance: "원금 보장은 안 됩니다만, 이 지수가 더 빠질 일은 없다고 보시면 됩니다", verdict: FAIL, reason: "앞 절의 부정이 뒤 절의 단정을 지우지 않는다" }
  - { utterance: "원금 보장은 안 되지만 변동성은 낮은 편입니다", verdict: PASS, reason: "위험을 인정한 위에서 상대적 성질을 말했을 뿐 미래를 확정하지 않았다" }
  - { utterance: "지금까지 흐름을 보면 조기상환 가능성이 높은 편입니다만 확정은 아닙니다", verdict: UNCLEAR, reason: "경계 — 가능성 언급과 유보가 함께 있다. 어조에 따라 단정으로 읽힐 수 있다" }
judgment_hints:
  fail_route: 준법감시큐
  unclear_route: 준법감시큐
