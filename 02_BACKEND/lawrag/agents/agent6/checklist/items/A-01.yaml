id: A-01
name: 판매자 소속·성명 고지
type: 존재형
when: always
basis:
  # 용어 앵커. 준칙 14.(설명의무)의 "…자신의 성명, 직책, 연락처 및 콜센터 또는 상담센터 등의
  # 이용방법을 알려야 한다" 가 이 항목의 근거다. 실측: '성명' 이 준칙 13회(KSB 3회·시행령 5회).
  # 판매 현장의 행위를 규정하는 것은 준칙 쪽이다.
  - { doc: KOFIA-R, term: 성명, note: "준칙 14. 설명의무 — 임직원등의 성명·직책·연락처 고지. 확인서 서식에도 '고객의 성명' 이 나오므로 해소가 AMBIGUOUS 로 갈 수 있다. 그때는 section 을 함께 적어 좁힌다" }
operational_definition: >
  PB가 자신의 소속(회사와 지점/센터)과 성명을 고객에게 밝혔는지 판정한다. 소속과 성명이
  **둘 다** 나와야 충족이며 한쪽만 있으면 미충족이다. 시점은 통화 초반이 정상이지만 후반에라도
  둘 다 나왔으면 충족으로 본다(고지는 이루어졌다).
  근거는 **PB의 발화만** 인정한다 — 고객이 "김 팀장님이시죠?"라고 먼저 부른 것은 PB가 밝힌
  것이 아니다.
  판정은 낱말이 아니라 뜻으로 한다. 아래 예시는 견본일 뿐이고, 같은 뜻을 다르게 말한 것도
  똑같이 처리한다.
  위반 예: "안녕하세요 고객님, 지난번에 말씀드린 상품 건으로 연락드렸습니다"(소속·성명 없음),
  "담당자입니다"(성명 없음), "저 기억하시죠? 늘 하시던 대로 진행할게요"(아는 사이라며 고지를
  건너뜀), "○○은행에서 전화드렸습니다"(회사만 있고 사람이 없음).
  적법 예: "○○은행 강남PB센터 김민수 팀장입니다", "저는 ○○증권 WM센터에서 고객님 계좌를
  담당하는 이영희 차장입니다", "지난번에 인사드렸던 ○○은행 분당지점 박철수입니다".
few_shot:
  - { utterance: "네 고객님, ○○은행 강남PB센터 김민수 팀장입니다.", verdict: PASS, reason: "소속·성명 모두 고지" }
  - { utterance: "안녕하세요, 지난번 상품 건으로 연락드렸습니다.", verdict: FAIL, reason: "소속·성명 모두 없음" }
  - { utterance: "○○은행입니다. 상품 안내 도와드리겠습니다.", verdict: FAIL, reason: "회사만 있고 성명 없음" }
  - { utterance: "고객: 김 팀장님 맞으시죠? / PB: 네 맞습니다, 바로 설명드릴게요.", verdict: FAIL, reason: "고객이 부른 이름은 PB의 고지가 아니다 — 존재형 근거는 PB 발화만 인정한다" }
  - { utterance: "저 김 팀장입니다. 그동안 잘 지내셨어요?", verdict: UNCLEAR, reason: "경계 — 성만 밝히고 소속이 없다. 통화 다른 곳에 소속 고지가 있으면 달라진다" }
judgment_hints:
  fail_route: PB보완
  unclear_route: 준법감시큐
