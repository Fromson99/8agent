id: C-18
name: 숙려기간 고지
type: 존재형
when: is_high_difficulty == true or customer_age >= 65
note: >
  §3의 when "is_high_difficulty or age≥65" 를 그대로 옮긴 것. 한쪽만 확정돼도 결과가
  정해지면 감점이 없다(예: 나이 67이면 고난도 여부를 몰라도 ACTIVE).
  근거를 REC(원문 미수집)에서 KOFIA-R 용어 앵커로 옮겼다. 실측: '숙려기간' 이 준칙 7회이고
  KSB·시행령은 0회다 — 손으로 조 번호를 세는 방식으로는 찾을 수 없던 자리다. 준칙 10.
  (투자권유 절차)의 "판매과정에서 2영업일 이상의 숙려기간을 부여하여야 한다"(☞ 법시행령
  제68조제5항제2-2호)가 이 항목의 실제 근거다.
basis:
  - { doc: KOFIA-R, term: 숙려기간, note: "준칙 — 고난도상품 판매과정의 2영업일 이상 숙려기간 부여. 실측 7회(KSB 0회·시행령 0회)" }
operational_definition: >
  청약 후 일정 영업일(2영업일 이상)의 숙려기간이 부여되며 그 기간이 지난 뒤 청약 의사를
  확정한다는 절차를 고지했는지 판정한다. 기간의 존재와 "그 뒤에 다시 확인한다"는 절차가 함께
  전달돼야 한다.
  근거는 **PB의 발화만** 인정한다.
  판정은 낱말이 아니라 뜻으로 한다 — '숙려기간'이라는 말이 없어도 "이틀 뒤에 다시 연락드려
  최종 의사를 확인한다"는 뜻이면 충족이다. 반대로 낱말을 써도 절차를 무력화하면 위반이다.
  위반 예: 숙려 언급 없이 당일 확정 진행, "숙려기간은 형식적인 거라 오늘 바로 처리해
  드릴게요"(절차 무력화), "이틀 기다리면 이 조건 못 받으실 수도 있어요"(숙려를 불이익으로
  제시 — D-25 동반 검토), "숙려기간 서류는 제가 미리 받아 두겠습니다"(사전 징구).
  적법 예: "청약 후 2영업일간 숙려기간이 있고 그 뒤에 확정 의사를 다시 확인드립니다",
  "오늘은 청약만 접수하고 모레 다시 연락드려 진행 여부를 여쭙겠습니다",
  "고난도 상품이라 이틀 동안 충분히 생각하실 시간을 드린 뒤에 최종 확정합니다".
few_shot:
  - { utterance: "청약 후 2영업일간 숙려기간이 있고 그 뒤에 확정 의사를 다시 확인드립니다.", verdict: PASS, reason: "기간과 확정 절차를 모두 고지" }
  - { utterance: "숙려기간은 형식적인 거라 오늘 바로 처리해 드릴게요.", verdict: FAIL, reason: "낱말은 있으나 절차를 무력화" }
  - { utterance: "오늘은 접수만 하고 모레 다시 연락드려서 진행하실지 여쭤보겠습니다.", verdict: PASS, reason: "낱말 없이도 숙려 절차가 전달됨" }
  - { utterance: "이틀 기다리시면 이 조건 못 받으실 수도 있어요.", verdict: FAIL, reason: "숙려기간을 불이익으로 제시해 포기를 유도 — D-25 동반 검토" }
  - { utterance: "숙려 확인서는 제가 미리 받아 두고 나중에 날짜만 맞추겠습니다.", verdict: FAIL, reason: "숙려기간을 서류 처리로 대체 — 절차 이행이 아니다" }
judgment_hints:
  fail_route: PB보완
  unclear_route: 준법감시큐
