id: A-05
name: 투자성향 결과 및 상품 위험등급 대비 고지
type: 존재형
when: always
note: >
  대기 중인 앵커: 준칙에 '투자자성향' 74회 / '위험등급' 126회가 있어
  `{ doc: KOFIA-R, term: 투자자성향 }` 이 적절한 근거다. 다만 KOFIA-R 이 아직 배차되지
  않아(manifest: UNROUTABLE) 지금 걸면 이미 해소된 이 항목까지 미해소로 바뀌어 판정
  confidence 만 떨어진다. 배차되면 추가한다.
basis:
  - { doc: KSB, section: "제17조", note: "적합성 원칙 — 성향과 상품의 대조가 이 조의 요구다" }
operational_definition: >
  확인된 고객의 투자성향 **결과**와 권유 상품의 **위험등급**을 함께 제시해 둘의 관계를 고객이
  알 수 있게 했는지 판정한다. 한쪽만 말한 경우는 미충족이다(등급만 말하면 B-09의 충족일 뿐이다).
  둘을 같은 발화에서 말할 필요는 없고, 통화 안에서 대비가 성립하면 충족이다.
  근거는 **PB의 발화만** 인정한다.
  판정은 낱말이 아니라 뜻으로 한다.
  위반 예: "이 상품 2등급입니다"만 말하고 성향과의 대비가 없는 경우, "고객님 성향에 딱 맞는
  상품입니다"(성향명도 등급도 없는 단정), "등급은 형식이니 신경 안 쓰셔도 됩니다"(대비를 무력화),
  "성향보다 조금 위인데 큰 차이는 아닙니다"(대비를 제시하지 않고 축소).
  적법 예: "고객님은 위험중립형이시고 이 상품은 2등급, 높은 위험입니다",
  "성향은 안정추구형으로 나와 있고 이 상품 위험등급은 3등급이라 성향보다 한 단계 높습니다",
  "공격투자형이시니 1등급 상품인 이 ELS는 성향 범위 안에 들어옵니다".
few_shot:
  - { utterance: "고객님 성향은 위험중립형이고 이 상품은 2등급 높은위험 상품입니다.", verdict: PASS, reason: "성향·등급 대비 제시" }
  - { utterance: "이 상품은 2등급입니다.", verdict: FAIL, reason: "고객 성향과의 대비 없음" }
  - { utterance: "고객님 성향에 딱 맞는 상품으로 골라 왔습니다.", verdict: FAIL, reason: "성향명도 등급도 없이 적합하다고만 단정" }
  - { utterance: "성향은 안정추구형이신데 이 상품은 3등급이라 한 단계 높습니다.", verdict: PASS, reason: "성향·등급과 그 관계까지 제시" }
  - { utterance: "등급이야 뭐 형식적인 거고 고객님 성향이면 충분히 하실 만합니다.", verdict: FAIL, reason: "대비를 제시하는 대신 등급의 의미를 무력화" }
judgment_hints:
  fail_route: PB보완
  unclear_route: 준법감시큐
