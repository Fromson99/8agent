id: B-11
name: 판매수수료·보수 설명
type: 존재형
when: always
note: >
  용어 앵커를 걸지 않았다. 실측상 준칙의 '판매수수료' 는 2회뿐이고 '수수료' 는 20회지만
  대부분 서식·목록 안이라 앵커로 삼으면 해소가 AMBIGUOUS 로 간다. 준칙 14.(설명의무)가
  "투자자가 부담하는 수수료에 관한 사항" 을 설명 대상으로 적고 있으므로, KOFIA-R 배차 후
  section 을 함께 적어 좁힐 수 있을 때 건다.
basis:
  - { doc: KSB, section: "제19조", note: "설명의무 — 수수료·보수는 중요사항이다" }
operational_definition: >
  고객이 부담하는 비용(선취/후취 판매수수료, 총보수, 신탁보수, 환매수수료 등)을 **수치와 함께**
  설명했는지 판정한다. "수수료가 있습니다"만으로는 부족하다. 비용이 없는 상품이면 "별도
  판매수수료는 없습니다"라는 명시적 진술이 있어야 충족이다.
  근거는 **PB의 발화만** 인정한다.
  판정은 낱말이 아니라 뜻으로 한다.
  위반 예: 비용 언급이 전혀 없는 경우, "수수료는 나중에 서류에서 보시면 됩니다"(설명 회피),
  "수수료야 얼마 안 되니 신경 쓰실 것 없습니다"(수치 없이 축소), "요즘 다 비슷비슷합니다"
  (비교로 대체하고 자기 상품 비용을 말하지 않음).
  적법 예: "선취 판매수수료 1.0%이고 연 총보수는 0.35%입니다",
  "가입 시 떼는 비용은 없고 매년 신탁보수 0.7%가 평가금액에서 차감됩니다",
  "이 상품은 별도 판매수수료가 없고 운용보수만 연 0.45% 부과됩니다".
few_shot:
  - { utterance: "선취 판매수수료 1%이고 연 총보수는 0.35%입니다.", verdict: PASS, reason: "비용 항목과 수치 제시" }
  - { utterance: "수수료 부분은 나중에 서류 보시면 다 나와 있습니다.", verdict: FAIL, reason: "설명 회피" }
  - { utterance: "수수료야 얼마 안 되니까 신경 안 쓰셔도 됩니다.", verdict: FAIL, reason: "수치 없이 축소 — 설명이 아니다" }
  - { utterance: "가입 비용은 없고 매년 신탁보수 0.7%가 평가금액에서 빠집니다.", verdict: PASS, reason: "부담 구조와 수치 제시" }
  - { utterance: "수수료는 다른 데랑 비교해도 저렴한 편입니다.", verdict: UNCLEAR, reason: "경계 — 비교만 있고 자기 상품 비용 수치가 없다" }
judgment_hints:
  fail_route: PB보완
  unclear_route: 준법감시큐
