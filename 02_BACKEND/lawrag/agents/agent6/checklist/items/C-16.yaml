id: C-16
name: 청약철회권 고지
type: 존재형
when: has_withdrawal_right == true
note: >
  §3의 when "해당 상품" 을 상품 메타 필드로 명시화한 것. 청약철회권 대상 상품인지는 상품
  속성이므로 전사에서 추론하지 않는다. 메타가 없으면 UNKNOWN → 보수적 활성.
  대기 중인 앵커: 준칙에 '청약철회' 28회 / '청약의 철회' 11회이고 17-②가 그 제목이다.
  KOFIA-R 배차 후 `{ doc: KOFIA-R, term: 청약철회 }` 를 추가한다(지금 걸면 이미 해소된
  이 항목이 미해소로 바뀐다).
basis:
  - { doc: KSB, section: "제46조", note: "청약의 철회" }
operational_definition: >
  일정 기간 안에 청약을 철회할 수 있다는 **권리**와 그 **기간·행사 방법**을 고지했는지
  판정한다. 권리 이름만 나열하고 기간이 없으면 UNCLEAR로 둔다(고지는 있었으나 행사할 수 없다).
  근거는 **PB의 발화만** 인정한다.
  판정은 낱말이 아니라 뜻으로 한다.
  위반 예: 청약철회 언급이 전혀 없는 경우, "한 번 가입하시면 되돌릴 수 없으니 신중히
  결정하세요"(권리 부정 — D-22 동반 검토), "철회야 되긴 하는데 실무적으로는 안 하시는 게
  좋습니다"(권리 행사 억제), "취소는 저한테 말씀하시면 알아서 해 드릴게요"(방법을 흐림).
  적법 예: "계약서류를 받으신 날부터 정해진 기간 안에 서면으로 청약을 철회하실 수 있고
  납입금 전액을 돌려받으십니다", "청약철회는 7일 이내에 가능하고 콜센터나 영업점 어디서든
  접수됩니다", "고난도 상품이라 숙려기간이 끝난 뒤부터 철회기간이 따로 계산됩니다".
few_shot:
  - { utterance: "계약서류 받으신 날부터 정해진 기간 내에 서면으로 청약철회가 가능합니다.", verdict: PASS, reason: "권리와 행사 방법 고지" }
  - { utterance: "한 번 가입하시면 되돌릴 수 없으니 신중히 결정하세요.", verdict: FAIL, reason: "권리를 부정 — D-22 동반 검토" }
  - { utterance: "철회요? 되긴 하는데 실무적으로는 안 하시는 게 좋습니다.", verdict: FAIL, reason: "권리를 알리는 대신 행사를 억제" }
  - { utterance: "청약철회권이라는 게 있습니다.", verdict: UNCLEAR, reason: "경계 — 권리 이름만 있고 기간·방법이 없다" }
  - { utterance: "가입일부터 7일 안에는 콜센터나 영업점에서 철회하실 수 있습니다.", verdict: PASS, reason: "기간과 경로를 함께 고지" }
judgment_hints:
  fail_route: PB보완
  unclear_route: 준법감시큐
