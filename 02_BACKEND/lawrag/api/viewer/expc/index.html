<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>법령해석례</title>
<link rel="stylesheet" href="/ui/ui.css">
<link rel="stylesheet" href="styles.css">
<script src="/ui/nav.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<header class="ui-bar">
  <nav class="ui-nav" data-nav="expc"></nav>
  <span class="ui-meta" id="summary">불러오는 중…</span>
  <span class="grow"></span>
  <span class="ui-acts">
    <span class="uitabs" id="viewTabs">
      <button data-v="wiki">위키</button>
      <button data-v="cases">사례</button>
    </span>
  </span>
</header>
<h1 class="sr">법령해석례 — 법제처 유권해석의 위키와 사례 원문</h1>

<div id="banner" class="banner err hidden"></div>

<!-- 위키 — LLM 이 사례를 읽고 컴파일한 맥락 층. 정본은 data/expc/wiki/*.md -->
<main class="wrap hidden" id="wikiView">
  <aside class="side">
    <p class="hint">사례를 개념 단위로 눌러 쓴 위키입니다. 수치·인용은 전부
      사례 원문으로 되짚어집니다 — 본문의 <b>안건번호</b>를 누르면 원문이 열립니다.</p>
    <div id="articleList"></div>
  </aside>
  <section class="main md" id="articleBody">
    <p class="hint">아티클을 고르세요.</p>
  </section>
</main>

<!-- 사례 — raw 층의 열람. 필터는 부분일치뿐, 해석하지 않는다 -->
<main class="wrap hidden" id="casesView">
  <aside class="side">
    <div class="filters">
      <input id="fQ" type="search" placeholder="안건명·질의요지·회답 부분일치">
      <select id="fLaw"><option value="">관련 법령 전체</option></select>
      <div class="row">
        <select id="fOrg"><option value="">질의기관 전체</option></select>
        <select id="fYear"><option value="">연도 전체</option></select>
      </div>
      <span class="hint" id="caseCount"></span>
    </div>
    <div id="caseList"></div>
  </aside>
  <section class="main" id="caseBody">
    <p class="hint">사례를 고르세요.</p>
  </section>
</main>
</body>
</html>
