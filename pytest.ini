# 저장소 루트를 rootdir 로 못 박는다.
#
# 설정 파일이 없으면 pytest 가 인자 경로에서 rootdir 를 추측한다. `pytest tests/agent6`
# 로 돌리면 rootdir 가 그 폴더가 되어 소스 트리 한복판에 `.pytest_cache/` 가 생겼다.
# 여기 한 줄로 캐시 자리와 import 기준점이 고정된다.
[pytest]
testpaths = tests
cache_dir = .pytest_cache
norecursedirs = archive first-agent .venv out .git *.egg-info

# tests/ 가 패키지(`__init__.py`)라 rootdir 만 sys.path 에 들어가면 된다.
# `core`·`agents`·`api` 를 절대 임포트하는 테스트들이 이걸 전제한다.
pythonpath = .
