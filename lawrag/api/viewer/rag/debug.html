<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG 디버깅</title>
<link rel="stylesheet" href="/ui/ui.css">
<link rel="stylesheet" href="styles.css">
<script src="/ui/nav.js" defer></script>
<style>
/* 디버깅 화면 전용 — 질의응답 화면의 결을 그대로 쓰되 폭을 넓게 편다. */
.wrap { max-width:1480px; }
.stats { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.stat { background:var(--pane); border:1px solid var(--line); border-radius:8px;
        padding:5px 12px; font-size:12px; display:flex; gap:7px;
        align-items:baseline; }
.stat b { font-size:15px; font-variant-numeric:tabular-nums; }
.stat.ok b { color:var(--ok); } .stat.bad b { color:var(--bad); }
.stat.warn b { color:var(--warn); }
.cols2 { display:grid; grid-template-columns:minmax(0,5fr) minmax(0,6fr);
         gap:14px; align-items:start; }
@media (max-width:1000px){ .cols2 { grid-template-columns:1fr; } }
.qlist { max-height:520px; overflow:auto; scrollbar-width:thin; }
.qrow { display:flex; gap:8px; align-items:baseline; font-size:12px;
        border-bottom:1px solid var(--line); padding:5px 4px; cursor:pointer;
        border-radius:6px; }
.qrow:hover { background:color-mix(in srgb,var(--accent) 8%,transparent); }
.qrow.on { background:color-mix(in srgb,var(--accent) 14%,transparent); }
.qrow .q { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.qrow .ts { color:var(--dim); font-size:11px; white-space:nowrap; }
.detail { max-height:520px; overflow:auto; scrollbar-width:thin; }
.detail h3 { font-size:12.5px; margin:12px 0 5px; color:var(--dim);
             font-weight:650; }
.detail h3:first-child { margin-top:0; }
.kv { display:flex; gap:8px; flex-wrap:wrap; margin:4px 0; }
.ans { white-space:pre-wrap; line-height:1.6; font-size:12.5px;
       border-left:2px solid var(--line); padding-left:10px; }
.mark { border:1px solid var(--line); border-radius:8px; padding:6px 10px;
        margin-top:5px; font-size:12px; }
.mark.fix { border-left:3px solid var(--accent); }
.mark.bad { border-left:3px solid var(--bad); }
.mark .why { color:var(--dim); margin-top:2px; }
.arrow { color:var(--dim); }
.bl { border:1px solid var(--line); border-radius:8px; padding:8px 11px;
      margin-bottom:7px; font-size:12px; }
.bl.fix { border-left:3px solid var(--accent); }
.bl.sup { border-left:3px solid var(--bad); }
.bl .line2 { color:var(--dim); margin:3px 0 6px; }
.bl .acts { display:flex; gap:8px; }
.bl button { padding:2px 10px; font-size:11px; background:transparent;
             border:1px solid var(--line); color:var(--ink); }
.bl button.yes { color:var(--accent); border-color:var(--accent); }
.bl button.yes.sup { color:var(--bad); border-color:var(--bad); }
.bl button.no { color:var(--dim); }
.mkedit { margin-left:6px; padding:0 8px; font-size:10.5px; background:transparent;
          border:1px solid var(--line); color:var(--dim); }
.mkedit:hover { color:var(--accent); border-color:var(--accent); }
.mkjson { width:100%; font-family:ui-monospace,monospace; font-size:11.5px;
          background:var(--bg); color:var(--ink); border:1px solid var(--line);
          border-radius:6px; padding:6px 8px; }
.mknote { width:100%; margin-top:5px; background:var(--bg); color:var(--ink);
          border:1px solid var(--line); border-radius:6px; padding:5px 8px;
          font:inherit; font-size:11.5px; }
.mark .acts button { padding:2px 10px; font-size:11px; background:transparent;
                     border:1px solid var(--line); color:var(--ink); }
.mark .acts button.yes { color:var(--accent); border-color:var(--accent); }
.mark .acts button.no { color:var(--dim); }
.hist { margin-top:5px; font-size:11px; color:var(--dim); }
.hist summary { cursor:pointer; }
.histrow { padding:2px 0 2px 12px; overflow-wrap:anywhere; }
.qlink { color:var(--accent); cursor:pointer; text-decoration:none;
         border-bottom:1px dashed color-mix(in srgb,var(--accent) 45%,transparent); }
.qlink:hover { background:color-mix(in srgb,var(--accent) 13%,transparent); }
.ldr { margin:0; padding-left:18px; }
.ldr li { font-size:11.5px; color:var(--dim); }
.ldr b { color:var(--ink); font-weight:600; }
#reload { padding:4px 12px; font-size:12px; }
</style>
</head>
<body>

<header class="ui-bar">
  <nav class="ui-nav" data-nav="rag"></nav>
  <span class="ui-meta">디버깅 — 질의 로그 · LLM 판정/교정 · 답변 품질</span>
  <span class="grow"></span>
  <div class="ui-acts">
    <a class="btn" href="/rag/">← 질의응답</a>
    <button id="reload">↻ 새로고침</button>
  </div>
</header>
<h1 class="sr">RAG 디버깅</h1>

<main class="wrap">

  <div class="stats" id="stats"></div>

  <div class="cols2">
    <!-- 질의 로그 — 한 줄 요약, 클릭하면 오른쪽에 전모 -->
    <section class="pane">
      <div class="panehead"><b>질의 로그</b><span id="qStats" class="sub"></span></div>
      <div id="qlist" class="qlist"></div>
    </section>

    <!-- 상세 — 무엇을 물었고, 시스템이 무엇을 봤고, LLM 이 무엇을 고쳤나 -->
    <section class="pane">
      <div class="panehead"><b>상세</b><span id="dHint" class="sub">왼쪽에서 질의를 고르세요</span></div>
      <div id="detail" class="detail"></div>
    </section>
  </div>

  <!-- 교정 백로그 — LLM 이 "착지가 얕다"고 고쳐 앉힌 제안. 승인해야 간선이 옮겨 앉는다 -->
  <section class="pane">
    <div class="panehead"><b>착지 교정 백로그</b>
      <span class="sub">승인 = 간선의 도착이 새 좌표로 고정(재지정 규칙) · 기각 = 제안만 닫음</span>
      <span id="fxStats" class="sub"></span></div>
    <div id="fixes"></div>
  </section>

  <!-- 억제 백로그 — LLM 이 "잘못 끌려왔다"고 찍은 간선. 승인해야 참조 닫힘에서 빠진다 -->
  <section class="pane">
    <div class="panehead"><b>오참조·무관 백로그</b>
      <span class="sub">승인 = 이 간선을 참조 닫힘에서 제외(억제 규칙)</span>
      <span id="vdStats" class="sub"></span></div>
    <div id="verdicts"></div>
  </section>

</main>

<!-- 오른쪽 PDF 패널 — 백로그의 경로·회수 구역을 누르면 그 자리(앵커)가 뜬다 -->
<aside id="pdfpane" class="pdfpane hidden">
  <div class="pphead">
    <b id="ppDoc"></b>
    <span class="grow"></span>
    <a id="ppStruct" class="navlink" target="_blank" title="구조 뷰어에서 열기">구조 뷰어 ↗</a>
    <button id="ppClose" title="닫기">✕</button>
  </div>
  <div id="ppTrail" class="pptrail hidden"></div>
  <div id="ppBody" class="ppbody"></div>
</aside>

<script src="debug.js"></script>
<script src="pdfpane.js"></script>
<script src="backlog.js"></script>
</body>
</html>
