<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>질의응답 — RAG</title>
<link rel="stylesheet" href="/ui/ui.css">
<link rel="stylesheet" href="styles.css">
<script src="/ui/nav.js" defer></script>
</head>
<body>

<header class="ui-bar">
  <nav class="ui-nav" data-nav="rag"></nav>
  <span class="ui-meta" id="summary">불러오는 중…</span>
  <span class="grow"></span>
  <div class="ui-acts">
    <a class="btn" href="/rag/debug.html" title="질의 하나의 전모 — 사다리·프롬프트·토큰">디버깅</a>
  </div>
</header>
<h1 class="sr">질의응답</h1>

<main class="wrap">

  <!-- 질의 — 결과의 근거 좌표는 전부 구조 뷰어 딥링크다.
       묻는 줄이 먼저, 그 줄을 바꾸는 스위치는 아래 작은 알약으로 물러난다. -->
  <section class="pane askpane">
    <form id="askForm" class="askrow">
      <input id="q" type="search" placeholder="문서에 물어보세요 — 예: 설명의무가 뭐야"
             autocomplete="off" autofocus>
      <button id="askBtn" type="submit">묻기</button>
    </form>
    <div class="askopts">
      <label class="chk" title="LLM 관련성 필터 — 끄면 거르지 않은 회수 원본이 보인다">
        <input type="checkbox" id="optFilter" checked> 필터</label>
      <label class="chk" title="검색이 빈손일 때 회복 사다리(의미해석→깔때기→원문→수색대→둘러보기)를 돈다">
        <input type="checkbox" id="optRecover" checked> 탐험</label>
      <label class="chk" title="기본: 벡터로 진입 → 참조 간선을 따라 연결 구역을 전부 싣는다. 출처는 회수 집합 그대로(정적). 끄면 용어 사다리">
        <input type="checkbox" id="optVector" checked> 벡터 우선</label>
      <!-- 질의 스코프 — "이 문서들만 대상으로". 목록은 data/rag/scopes.yml (+ 내장 외규·내규·서식).
           진입은 스코프 안에서만, 동반(배제·위임·준용…)은 밖으로 나가되 표식이 붙는다. -->
      <label class="chk scope" title="질의 스코프 — 이 문서 묶음만 검색한다 (정의: data/rag/scopes.yml · 목록 /v1/rag/scopes)">
        범위 <select id="optScope"><option value="">전체</option></select></label>
    </div>
  </section>

  <section id="result" class="pane hidden">
    <div id="answer" class="answer"></div>
    <div id="refs" class="refs"></div>
    <!-- 빈약한 답의 다음 걸음 — 답이 못 서거나 탐험이 돌았을 때만 뜬다.
         품질을 볼 사람을 그 순간에 디버깅 통로로 끌어들인다. -->
    <div id="nudge" class="nudge hidden"></div>

    <!-- 피드백 — 이 신호가 진단 튜플을 완성한다. 루프 2 전체의 입구다. -->
    <div id="fb" class="fb hidden">
      <span class="sub">이 답이 맞았나요?</span>
      <button id="fbOk" class="good">맞아요</button>
      <button id="fbNo" class="bad">이게 아니에요</button>
      <span id="fbDone" class="sub hidden"></span>
    </div>
    <div id="fbPick" class="fbpick hidden">
      <div class="sub">기대한 자리를 알려 주세요 (몰라도 보낼 수 있습니다)</div>
      <div class="pickrow">
        <select id="fbDoc"><option value="">문서 선택…</option></select>
        <select id="fbNode" disabled><option value="">구역 선택…</option></select>
      </div>
      <input id="fbNote" placeholder="메모 (선택) — 무엇이 나왔어야 하나">
      <div class="pickrow">
        <button id="fbSend" class="bad">오답으로 기록</button>
        <button id="fbCancel">취소</button>
        <a id="fbPeek" class="navlink hidden" target="_blank">구조 뷰어에서 확인</a>
      </div>
    </div>
  </section>

  <!-- 경로 — 어느 단에서 잡혔고, 탐험이 어디를 걸었나. 조용히 정확 매칭인
       척하지 않는다는 규율을 화면에도 그대로 둔다. -->
  <section id="trailPane" class="pane hidden">
    <div class="panehead"><b>어떻게 찾았나</b><span id="trailMode" class="sub"></span></div>
    <ol id="trail" class="trail"></ol>
  </section>

  <!-- 판정 백로그 ↔ 최근 질의 — 탭으로 스위칭한다. 백로그(검수할 것)가 먼저다.
       id 는 딥링크 자리 — 홈 할 일·상단바 배지·피드백 안내가 #backlog 로 온다 -->
  <section id="backlog" class="pane">
    <div class="panehead tabs2">
      <button id="tabBk" class="on">판정 백로그</button>
      <button id="tabTup">최근 질의</button>
      <span id="vdStats" class="sub"></span>
      <span id="tupStats" class="sub hidden"></span>
    </div>
    <div id="verdicts" class="tuples"></div>
    <div id="tuples" class="tuples hidden"></div>
  </section>

</main>

<!-- 오른쪽 PDF 패널 — 근거를 누르면 그 자리(앵커 상자)가 원문 쪽 위에 뜬다.
     본문 속 제N조 링크로 계속 타고 넘어가고, 궤적 칩으로 되돌아온다. -->
<aside id="pdfpane" class="pdfpane hidden">
  <div class="pphead">
    <b id="ppDoc"></b>
    <span class="grow"></span>
    <a id="ppStruct" class="navlink" target="_blank" title="구조 뷰어에서 열기">구조 뷰어 ↗</a>
    <button id="ppClose" title="닫기">✕</button>
  </div>
  <div id="ppTrail" class="pptrail hidden"></div>
  <div id="ppBody" class="ppbody"></div>
</aside>

<script src="/ui/hl.js"></script>
<script src="app.js"></script>
<script src="pdfpane.js"></script>
<script src="backlog.js"></script>
</body>
</html>
