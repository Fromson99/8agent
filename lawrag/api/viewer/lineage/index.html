<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>계보 원장 — 수집→변환→구조화→연결</title>
<link rel="stylesheet" href="/ui/ui.css">
<link rel="stylesheet" href="styles.css">
<script src="/ui/nav.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>

<header class="ui-bar">
  <nav class="ui-nav" data-nav="lineage"></nav>
  <span class="ui-meta" id="meta">불러오는 중…</span>
  <span class="grow"></span>
  <span class="ui-acts">
    <button id="reload" title="원장은 각 단계의 자기 기록에서 매번 파생됩니다">새로 고침</button>
  </span>
</header>
<h1 class="sr">계보 원장</h1>

<div id="banner" class="banner hidden"></div>

<main class="wrap">

  <!-- 깔때기 — 출처별로 수집→변환→구조화가 어디서 새는지. 낙차가 이 화면의
       존재 이유라, 숫자가 아니라 단계 사이의 줄어듦이 먼저 보여야 한다. -->
  <section id="funnel" class="funnel"></section>

  <!-- 문서별 계보 — 필터는 "다음 할 일" 이 기본이다. 감독은 완료 목록이
       아니라 멈춘 자리를 보는 일이라서다. -->
  <section class="filters">
    <div class="uitabs" id="srcTabs"></div>
    <div class="uitabs" id="nextTabs"></div>
    <input id="q" placeholder="문서명 검색" autocomplete="off">
  </section>

  <div class="gridwrap">
    <table class="grid">
      <thead><tr>
        <th>출처</th><th>문서</th><th>경로</th>
        <th>수집</th><th>변환</th><th>구조화</th><th>참조</th><th>다음</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <!-- 원장 밖 — 스토어에 있는데 수집분과 조인되지 않는 문서. 숨기지 않는다. -->
  <section id="extras" class="extras hidden"></section>

</main>
</body>
</html>
