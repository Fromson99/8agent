<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그 — 관측</title>
<link rel="stylesheet" href="/ui/ui.css">
<link rel="stylesheet" href="styles.css">
<script src="/ui/nav.js" defer></script>
</head>
<body>

<header class="ui-bar">
  <nav class="ui-nav" data-nav="logs"></nav>
  <span class="ui-meta" id="summary">불러오는 중…</span>
  <span class="grow"></span>
  <div class="ui-acts">
    <label class="chk" title="5초마다 다시 읽는다">
      <input type="checkbox" id="optAuto" checked> 자동</label>
    <button id="refreshBtn" class="ghost">↻ 새로고침</button>
  </div>
</header>
<h1 class="sr">로그</h1>

<main class="wrap">

  <!-- 요약 — RAG 가 지금 어떻게 돌고 있나 한 줄에 -->
  <section class="pane">
    <div id="stats" class="stats"></div>
  </section>

  <!-- RAG 이벤트 — 질의 하나가 한 행. 펼치면 사다리·출처·토큰·오류 -->
  <section class="pane">
    <div class="panehead">
      <b>RAG 이벤트</b><span id="evStats" class="sub"></span>
      <span class="grow"></span>
      <select id="evKind">
        <option value="">전체</option>
        <option value="ask">질의(ask)</option>
        <option value="search">검색(search)</option>
        <option value="feedback">피드백</option>
      </select>
      <input id="evQ" type="search" placeholder="질의·오류 검색">
    </div>
    <div id="events" class="events"></div>
  </section>

  <!-- 앱 로그 — 이 프로세스의 링버퍼. 재시작하면 비고, 파일이 정본이다 -->
  <section class="pane">
    <div class="panehead">
      <b>앱 로그</b><span id="appStats" class="sub"></span>
      <span class="grow"></span>
      <select id="appLevel">
        <option value="DEBUG">DEBUG↑</option>
        <option value="INFO" selected>INFO↑</option>
        <option value="WARNING">WARNING↑</option>
        <option value="ERROR">ERROR↑</option>
      </select>
      <input id="appQ" type="search" placeholder="메시지·로거 검색">
    </div>
    <div id="applog" class="loglines"></div>
  </section>

  <!-- 파일 로그 — 수집 로그(kofia_*.log 등)와 회전 파일의 꼬리 -->
  <section class="pane">
    <div class="panehead">
      <b>파일 로그</b><span id="fileStats" class="sub"></span>
      <span class="grow"></span>
      <select id="fileSel"><option value="">파일 선택…</option></select>
    </div>
    <pre id="filetail" class="filetail hidden"></pre>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
