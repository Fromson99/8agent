id: B-09
name: 투자위험등급 고지
type: 존재형
when: always
note: >
  대기 중인 앵커: 준칙에 '위험등급' 126회 / '위험도' 57회로, Ⅴ.16(투자성 상품의 위험등급
  산정)이 6단계 등급표 자체를 정하는 자리다. KOFIA-R 이 배차되면
  `{ doc: KOFIA-R, term: 위험등급 }` 을 추가한다(지금 걸면 이미 해소된 이 항목이 미해소로
  바뀐다). 이 항목은 F-29의 구성 항목이라 confidence 하락의 파급이 크다.
basis:
  - { doc: KSB, section: "제19조", note: "설명의무 — 위험등급은 중요사항이다" }
operational_definition: >
  상품의 투자위험등급을 **숫자 또는 등급명**으로 고지했는지 판정한다. A-05가 고객 성향과의
  대비를 본다면 이 항목은 등급 자체의 고지 여부만 본다. 6단계 중 몇 등급인지, 또는 '높은 위험'
  같은 등급명이 나와야 하며, 정성적 형용("좀 위험한 편")은 등급이 아니다.
  근거는 **PB의 발화만** 인정한다.
  판정은 낱말이 아니라 뜻으로 한다.
  위반 예: "좀 위험한 편이긴 합니다"(등급 아님), "위험등급이야 요즘 다 비슷비슷합니다"
  (등급을 말하지 않고 무의미화), "등급은 형식적인 거라 신경 안 쓰셔도 됩니다"(고지가 아니라
  무력화), 등급 언급이 아예 없는 경우.
  적법 예: "투자위험등급은 2등급으로 높은 위험 상품입니다",
  "6등급 체계에서 1등급, 매우 높은 위험으로 분류된 상품입니다",
  "이 펀드 위험등급은 3등급, 다소 높은 위험입니다".
few_shot:
  - { utterance: "투자위험등급은 2등급으로 높은 위험 상품입니다.", verdict: PASS, reason: "등급 숫자·등급명 명시" }
  - { utterance: "좀 위험한 편이긴 합니다.", verdict: FAIL, reason: "정성적 형용일 뿐 등급 고지가 아니다" }
  - { utterance: "등급은 형식적인 거라 크게 신경 안 쓰셔도 됩니다.", verdict: FAIL, reason: "등급을 말하지 않고 그 의미를 무력화" }
  - { utterance: "6등급 중에 1등급, 매우 높은 위험으로 분류돼 있습니다.", verdict: PASS, reason: "등급 체계와 등급 명시" }
  - { utterance: "위험도는 높은 편으로 나와 있습니다.", verdict: UNCLEAR, reason: "경계 — '높은 위험'이 등급명인지 형용인지 갈린다" }
judgment_hints:
  fail_route: PB보완
  unclear_route: 준법감시큐
