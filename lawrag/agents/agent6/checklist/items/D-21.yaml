id: D-21
name: 손실보전·수익보장 약속 없음
type: 부재형
when: always
note: >
  대기 중인 앵커: 준칙 18.의 제목이 "손실보전 등의 금지" 이고 '손실보전' 실측 준칙 3회 /
  KSB 1회다. 제목 용어라 해소가 정확할 가능성이 높다. KOFIA-R 배차 후
  `{ doc: KOFIA-R, term: 손실보전 }` 을 추가한다 — 지금 걸면 이미 해소된 이 항목이
  미해소로 바뀐다.
basis:
  - { doc: KSB, section: "제21조", note: "부당권유 금지 — 손실보전·수익보장 약속" }
operational_definition: >
  손실을 보전해 주겠다거나 일정 수익을 보장·약속하는 발언이 있었는지 판정한다. 회사 차원이든
  PB 개인 차원이든 똑같이 위반이며, 농담·립서비스라도 녹취에 남은 이상 위반이다.
  **낱말 목록으로 판정하지 않는다.** '보장'·'보전'이라는 말이 없어도 "손해나면 내가 메운다",
  "얼마는 나오게 해 준다"는 뜻이면 위반이다.
  위반 예: "혹시 손실 나면 제가 책임지고 메워드릴게요", "최소 연 4%는 나오게 해 드리겠습니다",
  "제 개인 돈으로라도 채워 드리겠습니다", "손해 보시면 제가 다른 상품으로 만회해 드릴게요"
  (보전을 다른 거래로 약속), "이번에 잘못되면 제가 옷 벗겠습니다"(책임을 걸어 보증하는 인상),
  "고객님은 제가 특별히 관리해서 손해는 안 보게 해 드립니다".
  적법 예: "손실보전이나 수익보장은 법으로 금지되어 있어 약속드릴 수 없습니다",
  "과거 이 유형의 상환 실적은 이러했습니다, 미래 수익을 약속드리는 것은 아닙니다",
  "제가 드릴 수 있는 건 관리이지 수익 보장이 아닙니다".
