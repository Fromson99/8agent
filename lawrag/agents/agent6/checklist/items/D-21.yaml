  - { utterance: "고객님은 제가 특별히 관리해서 손해는 안 보게 해 드립니다.", verdict: FAIL, reason: "'보장'이라는 말이 없어도 결과를 약속한 것이다" }
  - { utterance: "손실보전은 법으로 금지되어 있어서 약속드릴 수 없습니다.", verdict: PASS, reason: "금지 사실을 설명했을 뿐 약속이 아니다" }
  - { utterance: "제가 계속 지켜보다가 위험하면 바로 연락드리겠습니다.", verdict: UNCLEAR, reason: "경계 — 사후관리 약속인지 손실 방지 보증인지 갈린다" }
