id: E-26
name: 부적합 상품 판매 시 부적합 사실 고지·확인
type: 존재형
when: is_suitable == false
note: >
  §3의 when "risk_profile 부적합" 을 옮긴 것. 적합/부적합은 risk_profile 값 자체가 아니라
  고객 성향과 상품 위험등급의 **대조 결과**이므로 별도 메타 필드(is_suitable)로 받는다.
  판정 주체를 전사가 아니라 판매 시스템에 두는 편이 결정론적이다. 메타가 없으면 UNKNOWN →
  보수적 활성.
  근거를 REC(원문 미수집)에서 KOFIA-R 용어 앵커로 옮겼다. 실측: '부적합' 이 준칙 15회 /
  '확인서' 86회이고 KSB·시행령은 '부적합' 0회다 — 부적합 확인서 절차는 준칙에만 있다.
basis:
  - { doc: KSB, section: "제17조", note: "적합성 원칙 — 부적합 상품 권유 금지" }
  - { doc: KSB, section: "제18조", note: "적정성 원칙 — 부적정 사실의 고지·확인" }
  - { doc: KOFIA-R, term: 부적합, note: "준칙 — 부적합 상품 거래 확인서 절차. 실측 15회(KSB 0회·시행령 0회)" }
operational_definition: >
  고객의 투자성향에 비추어 상품이 부적합하다는 **사실을 고객에게 알리고**, 그럼에도 진행하겠다는
  고객의 의사를 확인했는지 판정한다. **두 가지가 모두** 있어야 충족이다 — (1) PB의 부적합
  고지, (2) 그에 대한 고객의 확인 응답.
  (1)의 근거는 **PB의 발화만** 인정한다. (2)는 성격상 고객 발화이며, 이때는 PB의 고지가 앞에
  있어야 쌍이 성립한다.
  판정은 낱말이 아니라 뜻으로 한다. 부적합 사실을 축소하거나 정당화하면 고지가 아니다.
  위반 예: 부적합 사실을 말하지 않고 진행, "성향이랑 조금 안 맞긴 한데 크게 상관은 없습니다"
  (축소), PB가 고지만 하고 고객 의사 확인 없이 넘어감, "확인서에 서명만 하시면 됩니다"
  (절차를 서류 서명으로 축소), "성향을 조금 올려서 다시 받으면 됩니다"(부적합을 우회 —
  중대한 위반이므로 반드시 인용해 보고한다).
  적법 예: PB "고객님 성향은 안정추구형이라 이 상품은 부적합으로 나옵니다. 그래도 진행을
  원하시면 부적합 확인 절차가 필요합니다" → 고객 "네, 알고 진행하겠습니다",
  PB "성향보다 위험도가 높은 상품이라는 점 먼저 말씀드립니다. 이해하시고도 가입 원하십니까?"
  → 고객 "네, 그렇게 해주세요".
few_shot:
  - { utterance: "고객님 성향으로는 부적합으로 나오는데, 그래도 진행하시면 부적합 확인 절차를 거쳐야 합니다.", verdict: PASS, reason: "부적합 사실 고지 + 확인 절차 안내" }
  - { utterance: "성향이랑 조금 안 맞긴 한데 크게 상관은 없습니다.", verdict: FAIL, reason: "부적합 사실을 축소하고 확인 절차가 없다" }
  - { utterance: "성향을 조금 올려서 다시 받으면 문제없이 진행됩니다.", verdict: FAIL, reason: "부적합 판정 자체를 우회 — 고지가 아니라 회피다" }
  - { utterance: "PB: 성향보다 위험도가 높은 상품입니다. 그래도 가입 원하십니까? / 고객: 네, 알고 하겠습니다.", verdict: PASS, reason: "고지와 고객 확인 응답이 쌍으로 존재" }
  - { utterance: "부적합 확인서는 나중에 서명만 하시면 됩니다.", verdict: FAIL, reason: "고지·의사확인을 서류 서명으로 대체" }
judgment_hints:
  fail_route: PB보완
  unclear_route: 준법감시큐
