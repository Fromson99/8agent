id: B-12
name: 환매 방법·환매수수료 설명
type: 존재형
when: always
note: >
  대기 중인 앵커: 준칙에 '환매' 24회(KSB 0회·시행령 2회)로, 준칙 14.(설명의무)가 "조기상환
  또는 환매 조건" 을 설명 대상으로 적는다. KOFIA-R 배차 후 `{ doc: KOFIA-R, term: 환매 }`
  를 추가한다 — 지금 걸면 이미 해소된 이 항목이 미해소로 바뀐다.
basis:
  - { doc: KSB, section: "제19조", note: "설명의무 — 환매·해지 조건" }
operational_definition: >
  자금을 회수하는 방법(환매·매도 신청 경로와 대금 지급 시점)과 환매수수료 유무를 설명했는지
  판정한다. 환매가 제한되는 상품이면 **제한 사실**을 말해야 충족이다("만기 전에는 못 빼십니다"
  도 충족이다). 방법과 비용 중 하나만 있으면 경계다.
  근거는 **PB의 발화만** 인정한다.
  판정은 낱말이 아니라 뜻으로 한다.
  위반 예: 환매·중도 회수 언급이 전혀 없는 경우, "돈 필요하시면 그냥 말씀만 하시면 됩니다"
  (절차·비용 없음), "아무 때나 자유롭게 빼실 수 있습니다"(제한 상품인데 제한을 숨김),
  "환매 얘기는 나중에 하시죠"(회피).
  적법 예: "환매는 영업일 오후 3시 전에 신청하시면 4영업일에 대금이 지급되고, 90일 이내면
  이익금의 70%가 환매수수료로 부과됩니다", "이 상품은 만기까지 중도 환매가 불가능합니다",
  "환매 신청은 창구나 앱에서 가능하고 별도 환매수수료는 없습니다".
few_shot:
  - { utterance: "환매는 영업일 3시 전에 신청하시면 4영업일에 대금이 지급되고, 90일 이내면 환매수수료가 있습니다.", verdict: PASS, reason: "방법·수수료 모두 설명" }
  - { utterance: "돈 필요하시면 그냥 말씀만 하시면 됩니다.", verdict: FAIL, reason: "환매 절차·수수료 설명이 아니다" }
  - { utterance: "이 상품은 만기까지 중도 환매가 불가능합니다.", verdict: PASS, reason: "제한 사실을 말한 것도 충족이다" }
  - { utterance: "언제든 자유롭게 빼실 수 있으니 편하게 생각하세요.", verdict: FAIL, reason: "제한·비용을 감춘 안심 진술" }
  - { utterance: "환매수수료는 없습니다.", verdict: UNCLEAR, reason: "경계 — 비용은 말했으나 신청 방법·지급 시점이 없다" }
judgment_hints:
  fail_route: PB보완
  unclear_route: 준법감시큐
