id: B-10
name: 최대 원금손실 가능금액 고지
type: 존재형
when: is_high_difficulty == true
note: >
  §3의 when "is_high_difficulty" 를 DSL 로 옮긴 것. 메타가 없으면 UNKNOWN → 보수적 활성되어
  confidence 가 한 단계 낮아진다(고난도 여부를 모른 채 이 항목을 끄는 것이 더 위험하다).
  근거를 REC(원문 미수집)에서 옮겼다. 실측: '고난도금융투자상품' 이 준칙 34회 / 시행령 2회 /
  KSB 0회이고, 준칙의 고난도 설명서·확인서 서식이 "최대 원금 전액손실이 가능하며" 를 적시한다.
basis:
  - { doc: KSB, section: "제19조", note: "설명의무 — 손실 발생 가능 범위" }
  - { doc: KOFIA-R, term: 고난도금융투자상품, note: "준칙 — 고난도상품 설명서·확인서의 최대 손실 표기. 실측 34회" }
operational_definition: >
  손실이 발생할 경우의 **최대 손실 규모**를 금액 또는 투자금 대비 비율로 고지했는지 판정한다.
  B-07(손실 가능성)과 달리 여기서는 **크기**가 필요하다 — "손실이 날 수 있다"까지는 B-07이고,
  "얼마까지 잃을 수 있다"가 이 항목이다.
  근거는 **PB의 발화만** 인정한다.
  판정은 낱말이 아니라 뜻으로 한다. 금액·비율이 아니라 "전액"처럼 규모를 특정하는 말도 충족이다.
  위반 예: "손실이 날 수도 있는 상품입니다"(규모 없음), "손실이 나도 얼마 안 됩니다"(축소 진술),
  "최악의 경우라고 해봐야 한두 푼 수준입니다"(규모를 왜곡), "손실 폭은 시장 상황에 따라
  다릅니다"(범위를 끝내 제시하지 않음).
  적법 예: "최악의 경우 투자원금 전액인 5천만원을 모두 잃으실 수 있습니다",
  "기초자산이 반토막 나면 투자금의 50%까지 손실이 확정됩니다",
  "이 구조에서는 원금 100% 손실도 가능합니다".
few_shot:
  - { utterance: "최악의 경우 투자원금 전액인 5천만원을 모두 잃으실 수 있습니다.", verdict: PASS, reason: "최대 손실 금액 제시" }
  - { utterance: "손실이 날 수도 있는 상품입니다.", verdict: FAIL, reason: "규모가 없다 — B-07 수준의 고지일 뿐이다" }
  - { utterance: "최악이라고 해봐야 손실 나봐야 얼마 안 됩니다.", verdict: FAIL, reason: "규모를 제시하는 대신 축소" }
  - { utterance: "이 구조에서는 원금 100% 손실도 가능합니다.", verdict: PASS, reason: "최대 손실을 비율로 특정" }
  - { utterance: "손실 폭은 시장 상황에 따라 달라집니다.", verdict: UNCLEAR, reason: "경계 — 사실이지만 최대 규모를 끝내 제시하지 않았다" }
judgment_hints:
  fail_route: PB보완
  unclear_route: 준법감시큐
