id: B-13
name: 중도해지 시 불이익 설명
type: 존재형
when: has_early_termination_penalty == true
note: >
  §3의 when "상품에 해당 시" 를 상품 메타 필드로 명시화한 것. 중도해지 불이익 유무는 상품
  속성이므로 전사에서 추론하지 않고 메타가 정한다. 메타가 없으면 UNKNOWN → 보수적 활성
  (불이익이 있는 상품인데 항목을 끄는 쪽이 훨씬 위험하다).
  용어 앵커를 걸지 않았다 — 실측상 '중도해지' 는 KSB 0회 / 시행령 0회 / 준칙 0회다.
  현장 용어이지 법령·준칙의 용어가 아니므로 걸 자리가 없고, 지어내지 않는다.
basis:
  - { doc: KSB, section: "제19조", note: "설명의무 — 계약의 해제·해지에 관한 사항" }
operational_definition: >
  만기 전 중도해지·중도상환 시 고객이 입는 불이익(원금 손실 확정, 중도해지수수료, 기준가 차감,
  이자 미지급 등)을 설명했는지 판정한다. "중도해지 가능합니다"만 말하고 불이익을 빠뜨리면
  미충족이다 — 이 항목이 보는 것은 가능 여부가 아니라 **대가**다.
  근거는 **PB의 발화만** 인정한다.
  판정은 낱말이 아니라 뜻으로 한다.
  위반 예: "필요하시면 중간에 해지도 됩니다"(불이익 누락), "급하시면 중간에 빼셔도 됩니다,
  문제 없어요"(불이익을 부정), "중도해지야 뭐 다들 하시는 거니까요"(대가를 말하지 않음),
  "손해는 거의 없다고 보시면 됩니다"(축소).
  적법 예: "중도해지하시면 그 시점 평가금액으로 정산되어 원금 손실이 확정될 수 있습니다",
  "만기 전에 해지하시면 약정 이율이 아니라 중도해지 이율이 적용돼 이자가 거의 없습니다",
  "중도상환 시에는 잔액의 1.5%가 수수료로 부과되고 원금 손실분은 그대로 확정됩니다".
few_shot:
  - { utterance: "중도해지 시에는 그 시점 평가금액으로 정산되어 원금 손실이 확정될 수 있습니다.", verdict: PASS, reason: "불이익을 구체적으로 설명" }
  - { utterance: "급하시면 중간에 빼셔도 됩니다, 문제 없어요.", verdict: FAIL, reason: "불이익 누락 + 오인 소지" }
  - { utterance: "중도해지 원하시면 언제든 신청 가능합니다.", verdict: FAIL, reason: "가능 여부만 말하고 대가를 말하지 않았다" }
  - { utterance: "만기 전에 해지하시면 중도해지 이율이 적용돼서 이자가 거의 안 붙습니다.", verdict: PASS, reason: "불이익의 내용이 드러남" }
  - { utterance: "중도해지하면 조금 손해는 보실 수 있습니다.", verdict: UNCLEAR, reason: "경계 — 불이익을 언급했으나 내용이 특정되지 않았다" }
judgment_hints:
  fail_route: PB보완
  unclear_route: 준법감시큐
