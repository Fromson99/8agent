id: D-24
name: 타상품 비방·왜곡 비교 없음
type: 부재형
when: always
basis:
  - { doc: KSB, section: "제21조", note: "부당권유 금지 — 제4호: 비교대상·기준을 밝히지 않거나 객관적 근거 없이 우수·유리하다고 알리는 행위" }
operational_definition: >
  다른 금융상품이나 타 금융회사를 근거 없이 비방하거나, 비교 기준을 밝히지 않은 채(또는 왜곡해)
  자기 상품이 우월하게 보이도록 설명했는지 판정한다. **비교 자체는 위반이 아니다** — 기준을
  밝히지 않은 비교와 근거 없는 폄하가 위반이다.
  **낱말 목록으로 판정하지 않는다.** 욕설이나 강한 표현이 없어도, 한쪽의 단점만 들고 다른 쪽의
  단점을 숨긴 대비면 왜곡이다.
  위반 예: "다른 은행 상품은 손해만 보는 구조라 하시면 안 됩니다",
  "예금은 물가 생각하면 마이너스라 바보 같은 선택이죠", "저쪽은 수수료만 비싸지 실속이 없어요",
  "이 상품이 요즘 나온 것 중에 제일 낫습니다"(근거 없는 우월 단언),
  "타사 것보다 수익률이 높습니다"(기간·기준 없이 비교), "거긴 사고 난 적도 있잖아요"
  (확인되지 않은 사실로 폄하).
  적법 예: "예금은 원금이 보장되는 대신 금리가 낮고, 이 상품은 손실 위험을 지는 대신
  기대수익이 높습니다", "같은 기초자산·같은 만기 기준으로 비교하면 제시 쿠폰은 이렇습니다",
  "상품마다 구조가 달라 단순 비교는 어렵고 각각 장단점이 있습니다".
few_shot:
  - { utterance: "다른 은행 상품은 손해만 보는 구조라 하시면 안 됩니다.", verdict: FAIL, reason: "근거 없는 타상품 비방" }
  - { utterance: "예금은 물가 생각하면 마이너스라 그건 바보 같은 선택이죠.", verdict: FAIL, reason: "타상품 폄하 — 기준을 밝힌 대비가 아니다" }
  - { utterance: "이게 요즘 나온 것 중에는 제일 낫습니다.", verdict: FAIL, reason: "비교 대상과 기준 없이 우월하다고 단언" }
  - { utterance: "예금은 원금이 보장되는 대신 금리가 낮고, 이 상품은 위험을 지는 대신 기대수익이 높습니다.", verdict: PASS, reason: "기준을 밝힌 정상 비교" }
  - { utterance: "타사 비슷한 상품보다 쿠폰이 높게 나왔습니다.", verdict: UNCLEAR, reason: "경계 — 비교 사실이지만 기초자산·만기 등 기준이 제시되지 않았다" }
judgment_hints:
  fail_route: 준법감시큐
  unclear_route: 준법감시큐
