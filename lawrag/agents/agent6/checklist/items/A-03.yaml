id: A-03
name: 녹취 진행 사실 고지
type: 존재형
when: always
note: >
  근거를 REC(금융위 녹취제도 자료, 원문 미수집)에서 KOFIA-R 용어 앵커로 옮겼다.
  실측: '녹취' 가 준칙 15회 / KSB 3회 / 시행령 1회다. 준칙은 고난도금융투자상품 판매과정의
  녹취 의무와 녹취 범위(회사참고사항 10-6)를 실제로 규정한다 — 없는 코퍼스를 기다리는 것보다
  원문이 있는 문서의 용어를 거는 편이 낫다.
basis:
  - { doc: KOFIA-R, term: 녹취, note: "준칙 — 판매과정 녹취 의무·녹취 범위. 실측 15회" }
operational_definition: >
  통화가 녹취되고 있다는 사실을 고객에게 고지했는지 판정한다. 고지 시점은 상품 설명 이전이어야
  하며, 설명이 끝난 뒤의 사후 고지는 UNCLEAR로 둔다(고지는 있었으나 순서가 어긋났다).
  근거는 **PB의 발화만** 인정한다 — 고객이 "이거 녹음되는 거죠?"라고 물은 것은 고지가 아니다.
  판정은 낱말이 아니라 뜻으로 한다. '녹취'라는 낱말이 없어도 통화가 기록된다는 사실이 고객에게
  전달되면 충족이다.
  위반 예: 녹취 언급이 전사 어디에도 없는 경우, "혹시 모르니 기록은 남겨 둘게요"(무엇이
  기록되는지 불분명), "녹음은 신경 안 쓰셔도 됩니다"(고지가 아니라 무마), 상품 설명과 청약
  의사 확인이 모두 끝난 뒤에야 덧붙인 경우.
  적법 예: "본 통화는 관련 법규에 따라 녹취되고 있음을 먼저 안내드립니다",
  "설명 시작 전에 말씀드리면 지금부터 통화 내용이 녹음됩니다",
  "고난도 상품이라 판매 과정 전체가 녹취되고, 원하시면 파일을 받아보실 수 있습니다".
few_shot:
  - { utterance: "본 통화는 법규에 따라 녹취되고 있음을 먼저 안내드립니다.", verdict: PASS, reason: "명시적 녹취 고지" }
  - { utterance: "그럼 상품 설명 들어가겠습니다.", verdict: FAIL, reason: "녹취 고지 없음" }
  - { utterance: "지금부터 통화 내용이 기록되니 참고해 주세요.", verdict: PASS, reason: "낱말은 달라도 기록 사실이 전달됨" }
  - { utterance: "고객: 이거 녹음되는 거죠? / PB: 네.", verdict: UNCLEAR, reason: "경계 — 고객이 먼저 물었고 PB는 긍정만 했다. 판매자의 고지로 보기 어렵다" }
  - { utterance: "청약까지 다 하셨고요, 아 참 이 통화 녹음된 거 아시죠?", verdict: UNCLEAR, reason: "사후 고지 — 고지는 있었으나 상품 설명 이전이 아니다" }
judgment_hints:
  fail_route: PB보완
  unclear_route: 준법감시큐
