# 금소법 시행령 — **2021년 제정 시점 판본. 현행 아님.**
#
# ## doc_id 를 KSB-D 가 아니라 KSB-D-2021 로 둔 이유
#
# 체크리스트 항목의 basis 가 `KSB-D/...` 를 가리킬 때, 이 파일이 KSB-D 라면 그 좌표가
# **조용히 해소되어** 5년 전 판본을 근거로 판정이 나간다. 낡은 근거로 "적법"을 선언하는
# 것은 이 시스템에서 가장 위험한 실패다. 그래서 다른 ID 로 두어 `KSB-D`(현행 시행령)는
# 계속 MISSING 으로 남게 하고, 해당 항목의 활성화는 차단된 채로 둔다(조용한 실패 금지).
#
# 현행 시행령을 확보해 `KSB-D.pdf` 로 넣으면 그 순간 차단이 풀린다.
# 이 파일을 그대로 근거로 쓰기로 결정한다면 doc_id 와 파일명을 KSB-D 로 바꾸면 되지만,
# 그 결정은 사람이 명시적으로 내려야 한다.

