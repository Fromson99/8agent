# 표준투자권유준칙 용어집 — **문서 안의 앵커** (SPEC §1, AGENT6 §2)
#
# 이 문서는 법령이 아니다. 조/항/호가 아니라 로마숫자 대분류 → 번호 항목 → 괄호번호로
# 짜여 있어(실측: 113p 에서 `제N조(제목)` 마커 1개뿐) 금소법용 인식기가 통하지 않는다.
# 위반이 곧 위법도 아니다(모범규준) — 판정 문구에서 법률 근거와 구별해 표현할 것.
#
# ## 왜 이 문서가 agent6 에 꼭 필요한가 — 실측이 답한다
#
# 원문 3종에서 문자열 등장 횟수(공백 무시):
#
#     용어                  KSB   시행령   준칙
#     고난도금융투자상품        0      2     34
#     고령투자자              0      0     69
#     숙려기간                0      0      7
#     투자자성향              0      0     74
#     투자자정보              0      0    143
#     위험등급                1      1    128
#     부당권유                1      1      4
#
# C-18(숙려기간)·E-27(고령투자자)·A-04(투자자정보)의 진짜 근거는 금소법이 아니라 여기
# 있다. 손으로 조 번호를 세는 방식으로는 찾을 수 없던 자리이고, 용어를 앵커로 걸면
# 자동으로 간다. 개정으로 번호가 밀려도 용어는 남는다.
#
# ## kind 를 어떻게 정했나
#
#   `[section, fact]` — 구역 제목이면서 본문에도 나오는 용어. 이 문서는 조 제목이
#       "제N조(제목)" 처럼 괄호로 묶이지 않고 "11. 고령투자자에 대한 …" 꼴이라 제목이
#       구역 제목으로도, 본문 문장으로도 반복된다.
#   `[section]`      — 제목에만 있고 본문에는 안 나오는 목차 제목.
#   `[fact]`         — 본문에만 나오는 개념어.
#
# value_type 은 전부 기본값 text 다. 준칙에서 뽑을 "값"은 없다 — 필요한 것은 위치다.
#
# 형식 파일의 `term_markers` 는 비어 있다(kofia_rule.format.json 주석 참조). 여기
# `[section]` 을 선언해도 구조화가 구역을 새로 열지는 않는다 — 어휘 등록이고, 앵커
# 해소(`basis.resolve_term()`)와 컴파일 국면의 후보 승격이 그것을 읽는다.
#
# ## 실측 (KOFIA-R.pdf 113p, 2025-09-11 개정. 라우터 실행 2026-08-05)
#
#   제목 앵커가 **한 곳**으로 떨어지는 용어 — basis 에 term 만 적어도 된다
#     투자권유 및 판매 일반 원칙 → Ⅰ/3.        투자권유 절차 → Ⅳ/Ⅳ-2/10.
#     투자권유시 유의사항        → Ⅳ/Ⅳ-2/13.   투자자성향   → Ⅳ/Ⅳ-1/8.
#     적정성원칙                → Ⅲ/7.          손실보전     → Ⅵ/18.
#     투자성 상품               → Ⅴ/16.         초고령자     → Ⅱ/5.#3
#     일반금융소비자·전문금융소비자 → II/5.        총칙         → Ⅰ
#     투자자정보 → Ⅳ/Ⅳ-1 (Ⅳ/Ⅳ-1/8.·Ⅳ/Ⅳ-1/9. 도 걸리지만 Ⅳ/Ⅳ-1 의 자손이라 접힌다)
#     설명의무   → Ⅳ/Ⅳ-3  (Ⅳ/Ⅳ-3/14.·Ⅳ/Ⅳ-3/15. 가 자손이라 접힌다)
#
#   제목 앵커가 **여러 곳**에 걸리는 용어 — section 을 함께 주어 좁혀야 한다
#     고령투자자 5곳(Ⅳ/Ⅳ-2/11. 과 [별첨] 고령투자자 보호 가이드라인 Ⅱ/1.#6·Ⅱ/2.#6·
#       Ⅱ/3.#3·Ⅱ/4.#12) → `{ term: 고령투자자, section: Ⅳ }` 로 좁히면 Ⅳ/Ⅳ-2/11.
#     위험등급 8곳 (Ⅴ/16. 과 [별첨] 위험등급 산정 가이드라인)
#     투자권유 8곳 (문서 전체의 주제어다 — 좁히지 않으면 앵커가 되지 못한다)
#
#   제목이 없어 **본문 앵커**로만 잡히는 용어 (fact 가 걸린 구역 수)
#     고난도금융투자상품 11   부적합 9   청약철회 8   적합성원칙 7   녹취 5
#     부당권유 3   숙려기간 2   조력자 2
#
# 모두 fact 가 1개 이상 잡히는 것만 넣었다 — 잡히지 않는 fact 용어를 선언하면 적합도
# 게이트의 fact_coverage 만 깎이고 진짜 경고가 묻힌다. 이 용어집으로 라우터를 돌린
# 결과는 section 388 / fact 620 / 적합도 0.972(임계 0.60) 통과다.

version: 1
doc_type: 표준투자권유준칙

terms:
  # --- 대분류·목차 제목 (구역 경계) --------------------------------------------
  총칙:
    kind: [section]
    note: Ⅰ. 목적·용어의 정의·일반 원칙
  투자권유 및 판매 일반 원칙:
    kind: [section]
    note: Ⅰ/3. A-01(소속·성명 고지)·F-30(질문 성실 응답)의 근거가 되는 일반 원칙
  투자권유 절차:
    kind: [section]
    note: Ⅳ/Ⅳ-2/10. 적합성 판단 → 설명 → 확인의 순서
  투자권유시 유의사항:
    kind: [section]
    note: Ⅳ/Ⅳ-2/13. D-25(투자 재촉·강요 금지)의 근거

  # --- 투자자 파악 --------------------------------------------------------------
  투자자정보:
    kind: [section, fact]
    aliases: [투자자정보확인서]
    note: >
      Ⅳ/Ⅳ-1 (파악·유효기간). 하위 Ⅳ/Ⅳ-1/8.·Ⅳ/Ⅳ-1/9. 도 제목에 걸리지만 Ⅳ/Ⅳ-1 의
      자손이므로 발췌가 그것들을 포함한다 — 해소기가 조상 하나로 접는다.
  투자자성향:
    kind: [section, fact]
    note: Ⅳ/Ⅳ-1/8. 투자자정보 파악 및 투자자성향 분석
  일반금융소비자:
    kind: [section, fact]
    note: II/5. 일반금융소비자·전문금융소비자의 구분
  전문금융소비자:
    kind: [section, fact]
    note: II/5. 일반금융소비자와 같은 구역이다
  부적합:
    kind: [fact]
    note: 본문 9개 구역. E-26(부적합 사실 고지·의사 확인)이 쓴다
  적합성원칙:
    kind: [fact]
    note: >
      본문 7개 구역. 이 문서에는 "적합성원칙"이라는 **제목**이 없다(원칙 자체는 금소법
      제17조가 정하고 준칙은 그 절차를 적는다) — 조문 근거는 KSB 쪽 앵커를 쓸 것.
  적정성원칙:
    kind: [section, fact]
    note: Ⅲ/7. 적정성 원칙 대상 상품에 대한 특칙

  # --- 설명·위험 ----------------------------------------------------------------
  설명의무:
    kind: [section, fact]
    note: Ⅳ/Ⅳ-3 (14. 설명의무 / 15. 외화증권 등 특칙을 자손으로 포함한다)
  위험등급:
    kind: [section, fact]
    note: >
      Ⅴ/16.(투자성 상품의 위험등급 산정)과 [별첨] 위험등급 산정 가이드라인에 함께
      걸린다(8곳) — section 을 주어 좁힐 것.
  투자성 상품:
    kind: [section, fact]
    note: Ⅴ/16.
  고난도금융투자상품:
    kind: [fact]
    note: >
      본문 11개 구역. 녹취·숙려 의무가 붙는 상품 구분이라 A-03·C-18 이 함께 쓴다.
      금소법 원문에는 이 낱말이 0회다 — 근거가 여기에만 있는 대표 사례다.

  # --- 고령·초고령 투자자 --------------------------------------------------------
  고령투자자:
    kind: [section, fact]
    note: >
      제목이 5곳에 걸린다 — 본칙 Ⅳ/Ⅳ-2/11.("고령투자자에 대한 금융투자상품 판매시
      보호 기준")과 [별첨] 가이드라인 4개 절. E-27 은
      `{ doc: KOFIA-R, term: 고령투자자, section: Ⅳ }` 로 좁혀 본칙으로 간다.
  초고령자:
    kind: [section, fact]
    note: Ⅱ/5.#3 ([별첨]) 초고령자에 대한 추가 보호방안
  조력자:
    kind: [fact]
    note: 본문 2개 구역. 고령투자자 상담 시 가족 등의 조력 절차

  # --- 판매직원 신원 고지 ---------------------------------------------------------
  성명:
    kind: [fact]
    note: >
      원문 13회, fact 7개 구역. A-01(PB 소속·성명 고지)의 근거는
      Ⅳ/Ⅳ-3/14./회사참고사항14-2/10) "임직원등은 … 자신의 성명, 직책, 연락처 및 콜센터
      또는 상담센터 등의 이용방법을 알려야 한다" 이며, 나머지는 확인서 서식의 서명란이라
      term 만으로는 AMBIGUOUS 다 — `section: Ⅳ/Ⅳ-3/14./회사참고사항14-2` 로 좁힐 것.
      (금소법 제21조의2 는 이름과 달리 연락금지 요구권 조항이라 A-01 의 근거가 아니다.
       실제로 본문을 읽고 확인했다.)

  # --- 절차·금지행위 -------------------------------------------------------------
  숙려기간:
    kind: [fact]
    note: >
      본문 2개 구역(Ⅳ/Ⅳ-3/14. 회사참고사항14-4, [별첨] Ⅱ/3.#3 의 "녹취제도 및 숙려 제도").
      금소법·시행령 원문에는 0회다 — C-18 의 근거는 여기밖에 없다.
  녹취:
    kind: [fact]
    note: 본문 5개 구역. A-03(녹취 고지)이 쓴다
  청약철회:
    kind: [fact]
    aliases: [청약의 철회]
    note: >
      본문 8개 구역. 준칙은 "청약철회"(28회)로, 금소법은 조 제목 "청약의 철회"로 쓴다 —
      두 표기를 한 용어로 묶는다.
  부당권유:
    kind: [fact]
    note: 본문 3개 구역. 준칙은 금소법 제21조를 인용하는 형태로 다룬다
  투자권유:
    kind: [section, fact]
    note: >
      이 문서의 주제어다(본문 35개 구역, 제목 8곳). 앵커로 쓰려면 반드시 section 을
      함께 줄 것 — 그러지 않으면 AMBIGUOUS 다.
  손실보전:
    kind: [section, fact]
    note: Ⅵ/18. 손실보전 등의 금지
