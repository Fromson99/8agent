# OQL 패턴 카탈로그 — 탐험 규칙은 코드가 아니라 데이터다.
#
# 원본(DELTAFlow)의 ontology_query_patterns.yaml 형식을 그대로 따른다. 다른 점은
# 실행기뿐이다 — Cypher 컴파일 대신 코퍼스 그래프(core/rag/graph.py) 걷기.
# 걸을 수 있는 간선: MENTIONS(용어↔구역) · HAS_CHILD(계층) · SIBLING · BRIDGE(문서 가로지르기).
#
# 원본에서 가져온 규율: limit 필수(상한 500), return 식 화이트리스트, 파라미터는
# 선언된 것만. milestones 는 결과를 버킷으로 접어 "몇 번까지 볼지" 고르게 한다.

version: 1
name: rag_oql_patterns
patterns:

- id: sec_by_term
  builtin: true
  description: 용어가 등장한 구역 — 그 용어를 다루거나(제목) 언급한(본문) 구역 전부.
    문서별 버킷으로 접힌다. 탐험의 기본 걸음.
  intent_hints: [문서, 구역, 조항, 어디, 규정]
  world: doc
  parameters:
  - {name: tag, type: string, required: true}
  traversal:
    seed: {labels: [Term], match: {key_prop: key, param: tag}}
    steps:
    - {rel: MENTIONS, direction: out, target_label: Section, alias: sec}
  return:
  - {expr: sec.doc, as: doc}
  - {expr: sec.doc_id, as: doc_id}
  - {expr: sec.node, as: node}
  - {expr: sec.path, as: path}
  - {expr: sec.page, as: page}
  - {expr: sec.preview, as: preview}
  limit: 60
  doc_type: 구역(용어 출현)
  result_kind: Section
  milestones: {by: doc, order: page, preview: preview, cutoff: true}
  render: "- **{doc}** ▸ {path} (p{page})\n  {preview}"

- id: bridge_by_term
  builtin: true
  description: 용어가 등장한 구역에서 **다른 문서**의 구역으로 — 같은 용어를 공유하는
    문서를 가로질러 잇는다(원본 collect_connected 의 걸음).
  intent_hints: [연결, 다른 문서, 함께, 비교, 관련]
  world: doc
  parameters:
  - {name: tag, type: string, required: true}
  traversal:
    seed: {labels: [Term], match: {key_prop: key, param: tag}}
    steps:
    - {rel: MENTIONS, direction: out, target_label: Section, alias: sec}
    - {rel: BRIDGE, direction: out, target_label: Section, alias: other}
  return:
  - {expr: other.doc, as: doc}
  - {expr: other.doc_id, as: doc_id}
  - {expr: other.node, as: node}
  - {expr: other.path, as: path}
  - {expr: other.page, as: page}
  - {expr: other.preview, as: preview}
  limit: 40
  doc_type: 연결 구역(문서 가로지르기)
  result_kind: BridgeSection
  milestones: {by: doc, preview: preview}
  render: "- **{doc}** ▸ {path} (p{page})\n  {preview}"

- id: neighbors_of_sec
  builtin: true
  description: 구역의 이웃 — 같은 부모 아래 형제 구역들. 잡힌 구역의 앞뒤 맥락을 편다.
  intent_hints: [이웃, 근처, 앞뒤, 맥락]
  world: doc
  parameters:
  - {name: sec, type: string, required: true}
  traversal:
    seed: {labels: [Section], match: {key_prop: sid, param: sec}}
    steps:
    - {rel: SIBLING, direction: out, target_label: Section, alias: sib}
  return:
  - {expr: sib.doc, as: doc}
  - {expr: sib.doc_id, as: doc_id}
  - {expr: sib.node, as: node}
  - {expr: sib.path, as: path}
  - {expr: sib.page, as: page}
  - {expr: sib.preview, as: preview}
  limit: 30
  doc_type: 이웃 구역
  result_kind: SiblingSection
  milestones: {by: doc, order: page, preview: preview}
  render: "- {path} (p{page}) — {preview}"

- id: terms_of_sec
  builtin: true
  description: 구역에 등장하는 용어들 — 수색대의 표면 수확(다음 홉의 씨앗)에 쓴다.
  intent_hints: [용어, 어휘]
  world: doc
  parameters:
  - {name: sec, type: string, required: true}
  traversal:
    seed: {labels: [Section], match: {key_prop: sid, param: sec}}
    steps:
    - {rel: MENTIONS, direction: in, target_label: Term, alias: t}
  return:
  - {expr: t.term, as: term}
  - {expr: t.n, as: n}
  limit: 30
  doc_type: 구역의 용어
  result_kind: SectionTerm
  milestones: {by: term}
  render: "- {term} ({n}곳)"
