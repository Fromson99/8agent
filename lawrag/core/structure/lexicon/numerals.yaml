# 서수 어휘 — 번호 글자를 정수로 읽는 표 (구조 해석기 게이트 4)
#
# 서수 일관성 검사는 "제5장을 파싱 중인데 제3장이 튀어나오면 그건 참조다" 를 판정한다.
# 그러려면 ①·가·Ⅲ 같은 글자를 정수로 읽어야 한다. 자동 판별이다 — 세 표의 글자군이
# 서로 겹치지 않으므로 구분자가 어느 체계인지 선언하지 않아도 된다.
#
# 겹치지 않음을 로더가 적재 시점에 검사한다. 새 체계를 추가하면서 글자가 겹치면
# 거기서 터진다 — 조용히 잘못 읽는 것보다 낫다.
version: 1

scales:
  # 아라비아 숫자는 표가 필요 없다(로더가 isdigit 로 처리).
  circled:
    "①": 1
    "②": 2
    "③": 3
    "④": 4
    "⑤": 5
    "⑥": 6
    "⑦": 7
    "⑧": 8
    "⑨": 9
    "⑩": 10
    "⑪": 11
    "⑫": 12
    "⑬": 13
    "⑭": 14
    "⑮": 15
    "⑯": 16
    "⑰": 17
    "⑱": 18
    "⑲": 19
    "⑳": 20

  hangul:
    가: 1
    나: 2
    다: 3
    라: 4
    마: 5
    바: 6
    사: 7
    아: 8
    자: 9
    차: 10
    카: 11
    타: 12
    파: 13
    하: 14

  # 전각 로마숫자와 ASCII 표기가 한 문서에 섞여 온다(KOFIA-R 실측).
  roman:
    "Ⅰ": 1
    "Ⅱ": 2
    "Ⅲ": 3
    "Ⅳ": 4
    "Ⅴ": 5
    "Ⅵ": 6
    "Ⅶ": 7
    "Ⅷ": 8
    "Ⅸ": 9
    "Ⅹ": 10
    I: 1
    II: 2
    III: 3
    IV: 4
    V: 5
    VI: 6
    VII: 7
    VIII: 8
    IX: 9
    X: 10
