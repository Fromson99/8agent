version: 1
name: tier1_concept_oql
patterns:

- id: relation_between_concepts
  intent: RELATION_BETWEEN_CONCEPTS
  handler: relation_between_concepts
  parameters:
  - {name: left_concept_ids, type: concept_ids, required: true}
  - {name: right_concept_ids, type: concept_ids, required: true}
  limit: 12

- id: assertions_for_concept
  intent: ASSERTIONS_FOR_CONCEPT
  handler: assertions_for_concept
  parameters:
  - {name: concept_ids, type: concept_ids, required: true}
  limit: 12

- id: actor_obligations
  intent: ACTOR_OBLIGATIONS
  handler: actor_obligations
  parameters:
  - {name: actor_concept_ids, type: concept_ids, required: true}
  limit: 12

- id: actions_on_object
  intent: ACTIONS_ON_OBJECT
  handler: actions_on_object
  parameters:
  - {name: object_concept_ids, type: concept_ids, required: true}
  limit: 12

- id: concept_definition
  intent: CONCEPT_DEFINITION
  handler: concept_definition
  parameters:
  - {name: concept_ids, type: concept_ids, required: true}
  limit: 8
