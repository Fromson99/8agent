  - '^:$'
  - '^\($'

caveats:
  - "법령이 아니라 모범규준이다. 위반이 곧 위법은 아니며, 판정 문구에서 법적 근거와
     구별해 표현해야 한다."
  - "텍스트 레이어의 공백이 일부 소실되어 있다(KSB-D-2021 과 같은 문제). 용어 매칭은
     공백을 지운 정규형으로 하므로 앵커 해소에는 영향이 없다."
  - "[별첨] 고령투자자 보호 가이드라인·위험등급 산정 가이드라인이 본칙과 같은 로마숫자
