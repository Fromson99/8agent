# 표준투자권유준칙 (금융투자협회 모범규준)
#
# ## 이 문서는 법령이 아니다 — 조/항/호 인식기가 통하지 않는다
#
# 실측: 전체 113페이지에서 `제N조(제목)` 마커가 **1개**뿐이다(그것도 본문 속 법 인용).
# 이 문서의 구조는 로마숫자 대분류 → 번호 소분류 → 괄호번호다:
#
#     Ⅰ. 총 칙
#       1. 목 적
#       2. 용어의 정의
#         1) "투자성 상품"이란 …
#         2) "투자권유"란 …
#
# 그래서 금소법용 statute.format.json(조→항→호→목)이 아니라 전용 형식
# `agents/agent6/formats/kofia_rule.format.json` 으로 자른다.
#
# ## doc_type 을 "준칙" 에서 "표준투자권유준칙" 으로 고쳤다 (2026-08-05)
#
# 등록부(core/registry.yaml)의 route 는 `doc_type: 표준투자권유준칙` 인데 이 사이드카가
# `준칙` 이라고 적고 있어 라우터가 배차하지 못했고, 코퍼스 빌드는 UNROUTABLE 로 끝났다.
# 그 결과 KOFIA-R 을 근거로 삼는 A-01·A-04·D-25·E-27·F-30 다섯 항목이 통째로 활성화
# 차단 상태였다. 등록부·형식·용어집 세 곳의 doc_type 은 한 글자도 다르면 안 된다
# (SPEC §00: 그래야 같은 문서가 누가 부르든 같은 규칙으로 처리된다).

