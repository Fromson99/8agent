# 특정금전신탁 계약서 용어집 (SPEC §1)
#
# 이 파일이 **사용자가 시스템에 주는 최우선 입력**이다. 코드가 아니라 데이터이며,
# 컴파일 국면의 후보 승격(§2.4)과 운영 중 추가로 자란다.
#
# kind
#   section — 문서의 구역(section) 경계가 될 수 있는 용어. 문단/구역 레벨.
#   fact    — 값이 붙는 내용 용어. 문장 레벨.
#   한 용어가 양쪽 모두일 수 있다("신탁계약 세부내역"은 별지1의 제목이면서
#   본문 문장 속 mention 으로도 등장한다 — §1.1).
#
# value_type 은 fact 용어에만. aliases 는 다른 문서(투자설명서 등)의 표면형.

version: 1
doc_type: 특정금전신탁

terms:
  # --- section 용어 (구역 경계 후보) ---------------------------------------
  신탁계약 세부내역:
    kind: [section, fact]
  신탁자금 운용방법:
    kind: [section, fact]
    value_type: option_set
    aliases: [운용방법, 운용대상, 편입자산]
  세부 운용지시:
    kind: [section, fact]
    aliases: [투자전략]
  기타 특약사항:
    kind: [section]
  변경계약서:
    kind: [section]

  # --- fact 용어 (값이 붙는 용어) ------------------------------------------
  계좌번호:
    kind: [fact]
    value_type: account_no
    aliases: [신탁계좌번호]
  신탁금액:
    kind: [fact]
    value_type: number
    aliases: [투자금액, 신탁원금, 투자원금, 가입금액]
  신탁기간:
    kind: [fact]
    value_type: date_range
    aliases: [투자기간, 계약기간, 신탁계약기간]
  운용내역 통지여부:
    kind: [fact]
    value_type: option_set
    aliases: [운용내역 통지, 자산운용보고서 수령]
  기본보수:
    kind: [fact]
    value_type: percent
    aliases: [신탁보수, 보수율, 운용보수]
  수익보수:
    kind: [fact]
    value_type: percent
    aliases: [성과보수, 초과성과보수]
  지급주기:
    kind: [fact]
    value_type: text
    aliases: [이익지급주기, 배당주기]
  원금지급비율:
    kind: [fact]
    value_type: percent
  지급기간:
    kind: [fact]
    value_type: date_range
    aliases: [이익지급기간]
  지급계좌:
    kind: [fact]
    value_type: account_no
    aliases: [이익지급계좌, 입금계좌]
  중도해지수수료:
    kind: [fact]
    value_type: range_tiers
    aliases: [중도상환수수료, 해지수수료]
