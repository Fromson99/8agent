# 신탁계약서 ↔ 투자설명서 정합성 비교 규칙 (SPEC §4.1)
#
# 비교는 **"어떤 문서의 어떤 section 에 있는 어떤 용어" ↔ "다른 문서의 어떤 section 의 내용"**
# 을 잇는 매핑이다. source(계약서 별지1)가 정답이고, 다르면 대상(요약서)이 틀린 것이다.
#
# section 은 완전 경로("별지1/신탁계약 세부내역")로도, 경로 성분("계약 개요")으로도 지정한다.
# 표면형 차이(투자금액 ↔ 신탁금액)는 각 문서의 용어집 aliases 가 이미 흡수했으므로
# 여기서는 **정규 용어명만** 쓴다.

source_of_truth: 특정금전신탁
target: 투자설명서

rules:
  - source: { section: "별지1/신탁계약 세부내역", term: 계좌번호 }
    target: { section_any_of: ["계약 개요"], term: 계좌번호 }

  - source: { section: "별지1/신탁계약 세부내역", term: 신탁금액 }
    target: { section_any_of: ["계약 개요", "투자조건"], term: 신탁금액 }

  - source: { section: "별지1/신탁계약 세부내역", term: 신탁기간 }
    target: { section_any_of: ["계약 개요", "투자조건"], term: 신탁기간 }

  - source: { section: "별지1/신탁계약 세부내역", term: 기본보수 }
    target: { section_any_of: ["보수 및 수수료"], term: 기본보수 }

  - source: { section: "별지1/신탁계약 세부내역", term: 수익보수 }
    target: { section_any_of: ["보수 및 수수료"], term: 수익보수 }

  - source: { section: "별지1/신탁계약 세부내역", term: 중도해지수수료 }
    target: { section_any_of: ["보수 및 수수료", "중도해지수수료", "환매"], term: 중도해지수수료 }

  - source: { section: "별지1/신탁계약 세부내역", term: 지급주기 }
    target: { section_any_of: ["이익 지급"], term: 지급주기 }

  - source: { section: "별지1/신탁계약 세부내역", term: 원금지급비율 }
    target: { section_any_of: ["이익 지급"], term: 원금지급비율 }

  - source: { section: "별지1/신탁계약 세부내역", term: 지급기간 }
    target: { section_any_of: ["이익 지급"], term: 지급기간 }

  - source: { section: "별지1/신탁계약 세부내역", term: 지급계좌 }
    target: { section_any_of: ["이익 지급", "계약 개요"], term: 지급계좌 }
    note: 요약서에 지급계좌 항목이 없는 것이 정상일 수 있다 — 누락으로 한 행 남는다

  - source: { section_any_of: ["신탁자금 운용방법"], term: 신탁자금 운용방법 }
    target: { section_any_of: ["운용"], term: 신탁자금 운용방법 }

  - source: { section_any_of: ["세부 운용지시"], term: 세부 운용지시 }
    target: { section_any_of: ["운용"], term: 세부 운용지시 }
