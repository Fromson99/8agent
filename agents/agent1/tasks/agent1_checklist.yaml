# 검사 항목 — 사용자가 미리 정한 질문 (AGENT1 검사 모드)
#
# 기존 규칙(agent1_trust_vs_prospectus.yaml)은 문서 형식을 아는 사람이 section
# 경로를 못박았다. 검사 항목은 반대다 — "이것들을 검사해줘"라고 **용어만** 말하고,
# 그 용어가 어느 구역에 있는지는 런타임이 두 문서에서 각각 찾는다.
#
# aliases — 같은 뜻을 문서마다 다르게 부르는 표면형. 계약서는 `신탁기간`,
# 설명서는 `투자기간`·`신탁계약기간`이라 한다. 두 문서 모두에서 term+aliases
# 전부로 찾으므로 방향(어느 문서의 말인가)은 적지 않는다. 등록부 용어집의
# 별칭도 런타임에 합쳐진다 — 여기 적는 것은 검사 항목 고유의 대응이다.
#
# 항목 필드
#   id       리포트에 남는 항목 식별자
#   term     대표 용어 (리포트의 행 이름)
#   aliases  같은 뜻의 다른 표면형 (선택)
#   note     판정자에게 주는 한 줄 참고 (선택)

checks:
  - id: c-period
    term: 신탁기간
    aliases: [투자기간, 신탁계약기간]
    note: "기간 — 시작·만료가 양쪽에서 같은가"

  - id: c-amount
    term: 신탁금액
    aliases: [투자금액, 모집 예정금액]
    note: "설명서의 모집 예정금액과 계약서의 신탁금액은 층위가 다를 수 있다 — 다르면 그렇게 보고한다."

  - id: c-redeem
    term: 중도해지수수료
    aliases: [환매수수료]

  - id: c-compensation
    term: 손실보전
    aliases: [이익보장]
    note: "보상·손실보전 문구 — 존재 여부와 조건이 양쪽에서 같은가"
