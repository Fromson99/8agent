  - id: t3-15
    question: >-
      유가증권시장에 상장하려면 어디 규정의 어떤 절차부터 봐야 하나요?
    answer: >-
      한국거래소 유가증권시장 상장규정이 근거 규정이다. 신규상장은 상장예비심사를 거쳐야 하므로
      상장예비심사 신청 관련 조항과 신규상장 요건(형식적 심사요건·질적 심사요건) 부분을
      확인해야 하고, 코스닥 상장이면 코스닥시장 상장규정을 본다. 세부 서식·제출서류는
      각 규정의 시행세칙에 있다.
    sources:
      - doc: 유가증권시장 상장규정
        article: 신규상장·상장예비심사 관련 조항
    eval_points:
      - 문서 단위 회수 (유가증권시장 상장규정)
      - 상장예비심사 개념
      - 시장별 규정 구분 (유가증권/코스닥)

  - id: t3-16
    question: >-
      대표주관사로서 발행사 실사할 때 뭘 어디까지 봐야 하는지 기준이 되는 문서가 있나요?
    answer: >-
      금융투자협회의 대표주관업무 등 모범기준이 기업실사(due diligence)의 항목·절차·확인 수준을
      상세히 정한다. 계약 단계 확인사항, 내부통제조직·재무 실사 항목, 수요예측 실무 등이
      단계별로 정리되어 있으므로 이 문서를 기준으로 실사 체크리스트를 구성하면 된다.
      법적 책임 관점에서는 증권신고서·투자설명서 부실기재 시 인수인 배상책임을 정한
      자본시장법 제125조도 함께 확인해야 한다.
    sources:
      - doc: 대표주관업무 등 모범기준
        article: 기업실사 관련 부분
      - doc: 자본시장과 금융투자업에 관한 법률
        article: 제125조
    eval_points:
      - 대표주관업무 등 모범기준 회수
      - 실사와 제125조 배상책임의 연결
