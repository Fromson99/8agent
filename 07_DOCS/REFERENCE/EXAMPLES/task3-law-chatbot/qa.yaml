# 과제3 — 법·규정 조회 RAG 챗봇 예시 Q&A
#
# 태스크: 실무자가 업무 상황을 서술하면, 필요한 법령·규정과 해당 조문을 근거와 함께 제시한다.
# 범위: 법령·규정만 (내규·내부 검토자료 제외 — 2026-08 협의 결과).
# 근거 조문은 전부 corpus/ 에 실재하는 문서에서 실측 확인한 것이다.
#
# 필드:
#   question    — 실무자 말투의 상황 질문
#   answer      — 기대 답변 요지 (근거 조문 포함, 챗봇 답변의 골격)
#   sources     — 반드시 회수·인용되어야 하는 근거 (doc는 corpus 폴더명과 일치)
#   eval_points — 채점 기준: 답변이 반드시 짚어야 하는 포인트

items:
  - id: t3-01
    question: >-
      이번에 비상장사 회사채를 사모로 몇 번 나눠서 발행하려고 하는데,
      금액이 얼마부터 증권신고서를 내야 하나요? 작년에 한 번 공모한 것도 합산되나요?
    answer: >-
      증권의 모집·매출은 자본시장법 제119조제1항에 따라 증권신고서가 수리되지 않으면 할 수 없고,
      신고 대상 기준은 시행령 제120조제1항이 정한다. 모집가액·매출가액과 과거 1년 동안 신고서를
      제출하지 않은 모집·매출가액의 합계가 30억 원 이상이면 신고서를 제출해야 하므로,
      과거 1년 내 이루어진 건은 합산된다. 청약 권유를 합산하는 경우(시행령 제11조제1항)에도
      합계 30억 원 이상이면 신고 대상이다.
    sources:
      - doc: 자본시장과 금융투자업에 관한 법률
        article: 제119조제1항
      - doc: 자본시장과 금융투자업에 관한 법률 시행령
        article: 제120조제1항
    eval_points:
      - 기준금액 30억 원
      - 과거 1년 합산 규칙
      - 법 제119조와 시행령 제120조를 함께 인용

  - id: t3-02
    question: >-
      IPO 대표주관계약을 어제 체결했습니다. 협회 신고는 언제까지 뭘 내야 하죠?
    answer: >-
      증권 인수업무 등에 관한 규정 제3조제1항에 따라 계약 체결일부터 5영업일 이내에
      주식인수의뢰서 사본, 대표주관계약서 사본, 발행회사 사업자등록증 사본을
      한국금융투자협회에 신고해야 한다.
    sources:
      - doc: 증권 인수업무 등에 관한 규정
        article: 제3조제1항
    eval_points:
      - 기한 5영업일
      - 제출 서류 3종
      - 신고처가 금융투자협회

  - id: t3-03
    question: >-
      저희 회사가 발행사 지분을 이해관계인 합산 7% 들고 있는데,
      이 회사 IPO 대표주관을 단독으로 해도 되나요?
    answer: >-
      원칙적으로 안 된다. 증권 인수업무 등에 관한 규정 제6조제1항에 따라 금융투자회사와
      그 이해관계인이 합하여 5% 이상의 주식등을 보유한 회사의 기업공개 주관회사 업무는
      이해관계 없는 다른 금융투자회사와 공동으로 수행해야 한다. 다만 같은 항 단서의
      예외 사유에 해당하는지 확인이 필요하다.
    sources:
      - doc: 증권 인수업무 등에 관한 규정
        article: 제6조제1항
    eval_points:
      - 5% 기준 (질문의 7%는 초과)
      - 공동주관 의무
      - 단서 예외 존재 언급

  - id: t3-04
    question: >-
      공모 규모를 좀 키우려고 초과배정옵션을 걸려고 합니다. 수량이랑 행사기간 제한이 어떻게 되나요?
    answer: >-
      증권 인수업무 등에 관한 규정 제10조제1항에 따라 초과배정수량은 공모주식 수량의 15% 이내,
      행사일은 매매개시일부터 30일 이내에서 대표주관회사와 발행회사가 정하고,
      행사에 따른 신주 발행가격은 공모가격으로 해야 한다.
    sources:
      - doc: 증권 인수업무 등에 관한 규정
        article: 제10조제1항
    eval_points:
      - 수량 한도 15%
      - 행사기간 매매개시일부터 30일
      - 발행가격은 공모가격

  - id: t3-05
    question: >-
      IPO 공모가격은 꼭 수요예측으로만 정해야 하나요? 다른 방식도 있나요?
    answer: >-
      증권 인수업무 등에 관한 규정 제5조제1항이 공모가격 결정 방법을 정한다. 수요예측 결과를
      감안해 인수회사와 발행회사가 협의하여 정하는 방법이 기본이지만, 같은 항 각 호에
      공모예정금액이 일정 규모 미만인 경우의 협의 결정, 경매 방식 등 대체 방식도 열거되어
      있으므로 각 호의 요건을 확인해야 한다.
    sources:
      - doc: 증권 인수업무 등에 관한 규정
        article: 제5조제1항
    eval_points:
      - 수요예측이 원칙적 방법
      - 각 호에 대체 방식 존재
      - 제5조 인용

  - id: t3-06
    question: >-
      저희가 인수단으로 참여한 종목이 다음 주 상장하는데, 리서치에서 바로 커버리지를
      개시해서 보고서를 내고 싶다고 합니다. 언제부터 가능한가요?
    answer: >-
      자본시장법 제71조제4호에 따라 모집·매출 관련 계약 체결일부터 그 증권이 최초로 상장된 후
      대통령령으로 정하는 기간 이내에는 그 증권에 대한 조사분석자료를 공표하거나 특정인에게
      제공하는 행위가 금지된다. 구체적 기간은 시행령(제68조)에서 정하므로 상장 직후 커버리지
      개시는 불가하고, 기간 경과 후 가능하다. 아울러 공표 시에는 제71조제2호의
      공표 후 24시간 자기계산 매매 금지도 함께 적용된다.
    sources:
      - doc: 자본시장과 금융투자업에 관한 법률
        article: 제71조제4호
      - doc: 자본시장과 금융투자업에 관한 법률 시행령
        article: 제68조
    eval_points:
      - 인수 참여 증권의 상장 후 일정 기간 조사분석자료 공표 금지
      - 법 제71조제4호 인용
      - 구체 기간은 시행령 위임임을 명시

  - id: t3-07
    question: >-
      애널리스트 연봉 협상 시즌인데, IB 딜 기여도를 반영해서 성과급을 주는 게 가능한가요?
    answer: >-
      불가하다. 자본시장법 제71조제3호는 조사분석자료 작성 담당자에게 대통령령으로 정하는
      기업금융업무와 연동된 성과보수를 지급하는 행위를 불건전 영업행위로 금지한다.
      기업금융업무의 범위는 시행령(제68조)에서 정한다.
    sources:
      - doc: 자본시장과 금융투자업에 관한 법률
        article: 제71조제3호
    eval_points:
      - 기업금융업무 연동 성과보수 금지
      - 법 제71조제3호 인용

  - id: t3-08
    question: >-
      상장사인 고객사가 재무구조 개선을 위해 특정 투자자에게 제3자배정 유상증자를
      하고 싶어 합니다. 어떤 근거로 가능하고 어떤 절차가 필요한가요?
    answer: >-
      상법 제418조제2항에 따라 정관에 정하는 바에 따라 주주 외의 자에게 신주를 배정할 수 있으나,
      신기술 도입·재무구조 개선 등 경영상 목적 달성에 필요한 경우로 한정된다. 이 경우 같은 조
      제4항에 따라 납입기일 2주 전까지 주주에게 통지·공고해야 한다. 주권상장법인은 자본시장법
      제165조의6제1항제2호가 같은 취지의 배정 방식을 정하고 있으므로 두 규정을 함께 검토해야 한다.
    sources:
      - doc: 상법
        article: 제418조제2항·제4항
      - doc: 자본시장과 금융투자업에 관한 법률
        article: 제165조의6제1항제2호
    eval_points:
      - 정관 근거 + 경영상 목적 요건
      - 납입기일 2주 전 통지·공고
      - 상법과 자본시장법 특례를 모두 인용

  - id: t3-09
    question: >-
      유상증자에서 실권주가 나오면 그냥 이사회 결의로 제3자한테 넘기면 되나요?
    answer: >-
      안 된다. 자본시장법 제165조의6제2항에 따라 주권상장법인은 실권주에 대하여 원칙적으로
      발행을 철회해야 한다. 예외적으로 금융위원회가 고시하는 방법에 따른 가격 이상으로 발행하면서
      특수관계 없는 투자매매업자가 인수인으로서 실권주 전부를 취득하는 계약을 체결한 경우,
      초과청약 방식으로 기존 주주에게 우선 배정하는 경우 등 같은 항 각 호의 요건을 갖춘
      경우에만 발행을 유지할 수 있다.
    sources:
      - doc: 자본시장과 금융투자업에 관한 법률
        article: 제165조의6제2항
    eval_points:
      - 실권주 발행 철회 원칙
      - 예외 요건 (인수계약·초과청약 등)

  - id: t3-10
    question: >-
      IPO 준비 중인 회사의 실사 과정에서 알게 된 정보인데, 아직 공개 전입니다.
      지인이 이 회사 장외주식을 사려고 하는데 말해줘도 되나요? 상장 전 회사라 괜찮지 않나요?
    answer: >-
      안 된다. 자본시장법 제174조제1항의 미공개중요정보 이용행위 금지는 상장법인뿐 아니라
      6개월 이내에 상장하는 법인(상장예정법인등)에도 적용되고, 직무와 관련하여 정보를 알게 된
      자가 타인에게 이용하게 하는 행위도 금지 대상이다. 상장 전 회사라는 이유로 허용되지 않으며
      형사처벌 대상(법 제443조)이다.
    sources:
      - doc: 자본시장과 금융투자업에 관한 법률
        article: 제174조제1항
    eval_points:
      - 상장예정법인(6개월 내 상장)도 적용
      - 타인에게 이용하게 하는 행위도 금지
      - 제174조 인용

  - id: t3-11
    question: >-
      일반청약자한테 투자설명서를 안 주고 청약을 받으면 문제가 되나요?
      이메일로 보내는 것도 인정되나요?
    answer: >-
      자본시장법 제124조제1항에 따라 증권신고 효력이 발생한 증권을 일반투자자에게 취득·매도하게
      하려면 투자설명서를 미리 교부해야 한다(전문투자자 등은 제외). 전자문서로 교부하려면
      수신자의 동의, 수신 매체·장소 지정, 수신 사실 확인, 서면 투자설명서와 내용 동일이라는
      네 가지 요건을 모두 충족해야 교부한 것으로 본다.
    sources:
      - doc: 자본시장과 금융투자업에 관한 법률
        article: 제124조제1항
    eval_points:
      - 사전 교부 의무 (일반투자자 대상)
      - 전자문서 교부 4요건

  - id: t3-12
    question: >-
      증권신고서를 이미 냈는데 발행조건 중 중요한 부분이 바뀌었습니다. 언제까지 어떻게 고치죠?
    answer: >-
      자본시장법 제122조제3항에 따라 신고서에 기재된 증권의 취득·매수 청약일 전일까지
      정정신고서를 제출할 수 있고, 대통령령으로 정하는 중요사항의 정정은 반드시 정정신고서를
      제출해야 한다. 금융위원회도 같은 조 제1항에 따라 형식 미비·거짓 기재 등의 경우 정정을
      요구할 수 있으며, 요구가 있으면 그 신고서는 수리되지 않은 것으로 본다(제2항).
    sources:
      - doc: 자본시장과 금융투자업에 관한 법률
        article: 제122조
    eval_points:
      - 기한이 청약일 전일
      - 중요사항은 정정 의무
      - 정정요구 시 수리 간주 배제

  - id: t3-13
    question: >-
      무보증사채 인수하려는데 발행사가 비용 아낀다고 신용평가를 한 군데만 받겠다고 합니다. 가능한가요?
    answer: >-
      원칙적으로 불가하다. 증권 인수업무 등에 관한 규정 제11조의2제1항에 따라 무보증사채를
      인수하려면 둘 이상의 신용평가회사로부터 평가를 받은 것이어야 한다. 유동화사채 등
      같은 항 괄호의 예외(하나 이상으로 족한 경우)에 해당하는지 확인이 필요하다.
    sources:
      - doc: 증권 인수업무 등에 관한 규정
        article: 제11조의2제1항
    eval_points:
      - 둘 이상 신용평가회사 원칙
      - 예외 사유 존재 언급

  - id: t3-14
    question: >-
      공모주 수요예측에서 어떤 기관이 납입능력보다 훨씬 큰 금액을 써냈습니다. 어떻게 처리해야 하나요?
    answer: >-
      허수성 수요예측 참여는 증권 인수업무 등에 관한 규정 제5조의3에 따라 주금납입능력 확인 등
      협회가 정하는 방법으로 점검해야 하고, 같은 규정 제17조의2제1항의 불성실 수요예측등
      참여행위에 해당하면 협회에 의해 불성실 참여자로 지정되어 일정 기간 수요예측 참여가
      제한될 수 있다. 대표주관회사는 배정에서 제외하는 등의 조치를 검토해야 한다.
    sources:
      - doc: 증권 인수업무 등에 관한 규정
        article: 제5조의3·제17조의2
    eval_points:
