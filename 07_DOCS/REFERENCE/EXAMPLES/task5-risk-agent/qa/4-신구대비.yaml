# 과제5 서브태스크 4 — 내규 신·구 대비 예시 Q&A
#
# 태스크: 내규가 개정되었을 때 이전 판과 무엇이 어떻게 달라졌는지 조문 단위로 답한다.
# 입력: 위험관리기준시행세칙 v1(2024. 1. 2. 제정) ↔ v2(2026. 7. 1. 개정)
#
# v1→v2 변경점 전체 목록 (기대 diff — 채점 기준):
#   제4조②   위원 5인 → 7인, "위원의 과반수는 사외이사" 요건 신설
#   제5조     조직명 리스크관리팀 → 리스크관리부 (제9조②·제15조 등 관련 조문 연동 변경)
#   제7조①   총위험한도 자기자본의 40% → 35%
#   제9조     내부 관리목표 450% → 500%, 조기경보 400% → 450%
#   제10조    점검 월별 → 주별, 위원회 보고 분기 1회 → 월 1회
#   제12조②  신규 장외파생 중지 기준 순자본비율 150% → 120%  ★외규 상충 유발 (서브태스크 2 연계)
#   제13조①  "매년" 이사회 승인 문구 정비
#   제15조    위기상황분석 연 1회 → 반기 1회 이상, 위원회 보고 항(②) 신설
#   제15조의2 비상자금조달계획 신설
#   제16조    외환포지션 한도 삭제 (외환리스크관리세칙으로 이관 — 부칙 경과조치)
#   제17조    100% 미달 시 "분기 종료 후 45일 이내" → "지체없이" 보고 + 매달 보고 항(②) 신설
#   제18조②  경미한 사항 리스크관리부장 전결 개정 단서 신설

items:
  - id: t5s4-01
    question: >-
      위험관리기준시행세칙이 7월에 개정됐다던데, 이전 세칙 대비 어디가 어떻게 바뀌었는지
      전부 정리해줘.
    answer: >-
      2026. 7. 1. 개정으로 12개 조문이 달라졌다. 한도·기준 강화 — 총위험한도 40%→35%(제7조),
      내부 관리목표 450%→500%·조기경보 400%→450%(제9조), 점검 월별→주별·위원회 보고
      분기→월(제10조), 위기상황분석 연 1회→반기 1회 및 위원회 보고 신설(제15조).
      조직 — 위원회 위원 5인→7인·사외이사 과반 신설(제4조), 리스크관리팀→리스크관리부(제5조 등).
      신설 — 비상자금조달계획(제15조의2), 100% 미달 시 매달 보고(제17조제2항), 경미사항
      부서장 전결 개정 단서(제18조제2항). 삭제 — 외환포지션 한도(제16조, 외환리스크관리세칙으로
      이관). 완화 — 신규 장외파생 매매 중지 기준 150%→120%(제12조제2항). 보고 시점 정정 —
      순자본비율 100% 미달 보고가 "분기 종료 후 45일 이내"에서 "지체없이"로(제17조제1항).
    sources:
      - doc: 위험관리기준시행세칙(v1)
      - doc: 위험관리기준시행세칙(v2)
    eval_points:
      - 변경 조문 전수 열거 (누락 없이)
      - 신설·삭제·수정 구분
      - 방향성 요약 (강화/완화/정정)

  - id: t5s4-02
    question: >-
      총위험한도가 개정 전후로 어떻게 달라졌어? 지금 총위험액이 자기자본의 38%면 문제야?
    answer: >-
      제7조제1항의 총위험한도가 자기자본의 40%에서 35%로 축소되었다. 총위험액이 38%라면
      구판에서는 한도 이내였지만 현행 기준으로는 초과이므로, 제11조에 따라 위험관리책임자
      즉시 보고와 3영업일 이내 해소계획 제출이 필요하다.
    sources:
      - doc: 위험관리기준시행세칙(v1)
        article: 제7조
      - doc: 위험관리기준시행세칙(v2)
        article: 제7조·제11조
    eval_points:
      - 40%→35% 변경 인식
      - 38%를 현행 기준으로 판정 (구판 기준 오답 방지)
      - 초과 시 절차 연결

  - id: t5s4-03
    question: >-
      이번 개정에서 새로 생긴 조문이랑 없어진 조문만 알려줘.
    answer: >-
      신설 — 제15조의2(비상자금조달계획: 수립·운영 및 연 1회 실효성 점검), 제15조제2항
      (위기상황분석 결과 위원회 보고), 제17조제2항(순자본비율 회복 시까지 매달 보고),
      제18조제2항(경미사항 리스크관리부장 전결 개정), 제4조제2항의 사외이사 과반 요건.
      삭제 — 제16조(외환포지션 한도). 부칙 경과조치에 따라 기존 한도는 외환리스크관리세칙에
      따라 설정된 것으로 본다.
    sources:
      - doc: 위험관리기준시행세칙(v1)
      - doc: 위험관리기준시행세칙(v2)
    eval_points:
      - 신설 조문 전부
      - 삭제 조문과 이관처(경과조치)

  - id: t5s4-04
    question: >-
      이번 세칙 개정으로 오히려 외부 규정이랑 안 맞게 된 부분이 생겼나?
    answer: >-
      두 곳이 문제다. (1) 제12조제2항 — 신규 장외파생상품 매매 중지 기준이 순자본비율
      150%에서 120%로 완화되었는데, 자본시장법 제166조의2제1항제3호의 법정 중지 기준은
      150%이므로 개정으로 새로 상충이 생겼다. (2) 제18조제2항 — 경미사항 부서장 전결 개정
      단서가 신설되었는데, 금융투자업규정 제3-43조제1항제4호(지침 제·개정은 이사회 심의·의결)
      및 제3-44조제4항(제정·변경 시 금감원장 보고)과 맞지 않는다. 반면 제17조는 개정으로
      기존 상충("분기 후 45일" 보고)이 해소된 경우다.
    sources:
      - doc: 위험관리기준시행세칙(v2)
        article: 제12조제2항·제18조제2항·제17조
      - doc: 자본시장과 금융투자업에 관한 법률
        article: 제166조의2제1항제3호
      - doc: 금융투자업규정
        article: 제3-43조제1항제4호·제3-44조제4항
    eval_points:
      - diff와 외규 점검의 결합 (서브태스크 2와 4의 연계)
      - 새로 생긴 상충 2건과 해소된 상충 1건의 구분

  - id: t5s4-05
    question: >-
      리스크 점검이랑 보고 주기가 개정 전후로 각각 어떻게 바뀌었지?
    answer: >-
      제10조 기준 — 위험한도 운영상황 점검이 월별에서 주별로, 위험관리책임자의 위원회 보고가
      분기 1회에서 월 1회로 단축되었다. 제15조의 위기상황분석도 연 1회에서 반기 1회 이상으로
      바뀌고 결과의 위원회 보고가 신설되었다. 감독당국 보고(제17조)는 순자본비율 100% 미달 시
      "분기 종료 후 45일 이내"에서 "지체없이 + 회복 시까지 매달"로 변경되었다.
    sources:
      - doc: 위험관리기준시행세칙(v1)
        article: 제10조·제15조·제17조
      - doc: 위험관리기준시행세칙(v2)
        article: 제10조·제15조·제17조
    eval_points:
      - 세 조문의 주기 변경을 모두 인식
      - 내부 보고와 감독당국 보고의 구분
