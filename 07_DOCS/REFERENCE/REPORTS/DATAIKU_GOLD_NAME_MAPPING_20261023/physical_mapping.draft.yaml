        원천과결합: 에이전트 실행·재개 상태 / JSON 상태 hash와 revision으로 동시 수정 방지
        주의: scope hash가 접근권한 검사를 대체하지 않음; 미확정 쓰기는 revision/hash로 재조회
        오너: 관리 부서·담당자 미확정; 담당자 확인 필요.
        예시질의: '이 범위의 상태와 변경 순번은 무엇인가?

          SELECT ST_KEY_ID, CHG_SEQ_NO, ST_HASH_VAL FROM <승인스키마>.LGL_EXEC_ST WHERE
          SCOPE_HASH_VAL=:scope_hash_val AND ST_KEY_ID=:st_key_id

          <승인스키마>와 bind 값 확인 전 실행하지 않는 검토 예시.'
      description_plain_text: '논리명(미승인 후보): 에이전트실행상태정보

        요약: 범위별 요청·세션의 작은 상태 객체와 변경 순번·내용 hash를 저장하는 Oracle 상태 포트다. 모든 기존 실행 이력이 이
        포트로 이행됐다는 뜻은 아니다.

        행단위와PK: 권한 범위·상태 키 1건 / PK SCOPE_HASH_VAL + ST_KEY_ID

        답할수있는질문: 이 범위의 상태와 변경 순번은 무엇인가?

        포함제외: 포트가 저장한 작은 요청/세션 상태; 전체 원문 DB·모든 현행 이력 포함 아님

        보유기간과기준시점: 기존 원문·완료 이력은 보존한다. 공식 보유기간·삭제 기준은 담당자 확인 필요. 조회 범위는 데이터 세대/게시 릴리스
        또는 현재 상태 기준.

        갱신주기와완료기준: 게시·선택·상태 변경 시; 운영 시각 미확정 / 완료 기준: 기대 revision으로 쓰기 후 scope·key·revision·value
        hash를 재조회한다. 응답 불명은 성공으로 확정하지 않는다.

        산식과단위: 업무 집계 산식 해당 없음. 식별값·hash·순번·바이트 수의 계산은 컬럼별 생성 규칙에 명시.

        원천과결합: 에이전트 실행·재개 상태 / JSON 상태 hash와 revision으로 동시 수정 방지

        주의: scope hash가 접근권한 검사를 대체하지 않음; 미확정 쓰기는 revision/hash로 재조회

        오너: 관리 부서·담당자 미확정; 담당자 확인 필요.

        예시질의: 이 범위의 상태와 변경 순번은 무엇인가?

        SELECT ST_KEY_ID, CHG_SEQ_NO, ST_HASH_VAL FROM <승인스키마>.LGL_EXEC_ST WHERE SCOPE_HASH_VAL=:scope_hash_val
        AND ST_KEY_ID=:st_key_id

        <승인스키마>와 bind 값 확인 전 실행하지 않는 검토 예시.

        명칭 선정 이유: QUERY_STATE를 에이전트 실행 상태로 명확히 표현한다. EXEC/ST는 실행/상태 약어 후보이며 지식 원문과
        구분한다.

        데이터유형 선정 이유: MASTER 후보: 범위·상태키당 현재 상태와 revision을 갱신한다. 이 테이블 단독으로 과거 상태 전체
        이력을 보존하지 않는다.

        레이어 선정 이유: 질의·실행 상태 책임이므로 Agent 대상이다. Gold 등록 제외 제안이며 기존 테이블 삭제를 뜻하지 않는다.'
