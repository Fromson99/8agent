        또는 현재 상태 기준.

        갱신주기와완료기준: 외규 일일 수집·내규 업로드 후 게시가 목표; 정확 완료 시각 미확정 / 완료 기준: 조회 행의 PK·내용 hash·본문·조회키를
        대조하고 완료 manifest의 종류별 건수를 확인한다. 전체 완료 뒤 별도 활성화를 수행한다.

        산식과단위: 업무 집계 산식 해당 없음. 식별값·hash·순번·바이트 수의 계산은 컬럼별 생성 규칙에 명시.

