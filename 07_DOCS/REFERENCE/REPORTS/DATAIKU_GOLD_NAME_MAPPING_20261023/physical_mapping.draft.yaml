        주의: manifest와 release 해시 확인 필요; 게시 완료와 활성 채널 선택을 구분

        오너: 관리 부서·담당자 미확정; 담당자 확인 필요.

        예시질의: 조회 게시본의 원문 세대와 투영 해시는 무엇인가?

        SELECT SRCH_PBLS_ID, MNFST_JSON_CN FROM <승인스키마>.LGL_SRCH_PBLS WHERE SRCH_PBLS_ID=:srch_pbls_id

        <승인스키마>와 bind 값 확인 전 실행하지 않는 검토 예시.

        명칭 선정 이유: 원문 게시와 별도의 조회 게시임을 SRCH_PBLS로 표현한다. 기존 release 식별값의 의미·생성법은 유지한다.

        데이터유형 선정 이유: SNAPSHOT 후보: 완료 조회 manifest를 불변 보존하며 새 내용은 새로운 조회 게시 ID로 구분한다.

        레이어 선정 이유: 지식 조회의 판본 결속에 필요하므로 Gold 지원 후보다. 등록 대상 선정과 운영 승인을 구분한다.'
