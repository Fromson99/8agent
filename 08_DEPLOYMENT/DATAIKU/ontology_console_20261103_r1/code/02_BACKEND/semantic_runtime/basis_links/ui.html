<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내규 근거 관계</title>
<style>body{font:16px/1.65 system-ui;max-width:1200px;margin:32px auto;padding:0 20px;color:#172534;background:#f7f9fb}button,select,input,textarea{font:inherit;padding:7px;margin:4px;border:1px solid #abb9c5;border-radius:5px}button{background:#fff;cursor:pointer}button:disabled{opacity:.45;cursor:wait}table{width:100%;border-collapse:collapse;background:white}td,th{border-bottom:1px solid #cdd6df;padding:10px;text-align:left;vertical-align:top}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:14px}details{max-width:560px}summary{cursor:pointer}#status{white-space:pre-wrap}label{display:inline-block;margin-right:14px}textarea{display:block;width:90%}</style>
<h1>내규 근거 관계</h1><p>내규와 외규의 실제 원문을 검토해 관계를 승인합니다. 승인과 법률 정답 검증은 별개입니다.</p>
<label>내규 <select id="document"><option value="">전체 관계</option></select></label><label>기준일 <input id="day" type="date"></label><button id="refresh">관계 조회</button>
<div><label><input id="llm" type="checkbox" checked>새 근거 조사에 모델 사용</label><button id="discover">선택 내규 전체 조사</button><button id="continue" disabled>미처리 범위 이어서 조사</button></div>
<p id="status" role="status" aria-live="polite"></p><div><button data-action="approve">선택 승인</button><button data-action="reject">선택 반려</button><button data-action="revoke">선택 승인 취소</button><input id="reason" placeholder="검토 이유 (선택)" aria-label="검토 이유"></div>
<table><thead><tr><th>선택</th><th>내규 · 외규 및 원문</th><th>관계 의견</th><th>상태</th></tr></thead><tbody id="rows"></tbody></table><pre id="report"></pre>
<script>
const labels={BASIS:'근거',IMPLEMENTS:'이행',RELATED:'참고',APPROVED:'승인',PROPOSED:'검토 대기',REJECTED:'반려',REVOKED:'승인 취소',current:'현재 위치',review_needed:'재검토 필요',unresolved:'위치 미확정',UNKNOWN:'시행 정보 미확인',FUTURE:'미래 시행',EXPIRED:'기준일 이전 판본',IN_RECORDED_INTERVAL:'기록된 시행 기간',TRANSITION_REVIEW:'경과조치 검토'};const label=x=>labels[x]||x;const $=id=>document.getElementById(id);let current=null,run=null;const session=sessionStorage.basisSession||(sessionStorage.basisSession=crypto.randomUUID());
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const x=await r.json();if(!r.ok)throw Error(x.message||x.detail||JSON.stringify(x));return x;}
function node(tag,text,parent){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;parent?.append(e);return e;}
async function task(fn){document.querySelectorAll('button').forEach(b=>b.disabled=true);$('status').textContent='처리 중…';try{await fn();}catch(e){$('status').textContent=e.message;}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);$('continue').disabled=!run?.continuation_available;}}
async function load(){const q=new URLSearchParams();if($('document').value)q.set('internal_document_id',$('document').value);if($('day').value)q.set('as_of',$('day').value);current=await api('/v1/basis-links?'+q);draw();$('status').textContent=current.items.length+'개 관계. 승인할 범위와 양쪽 원문을 확인해 주세요.';}
function draw(){$('rows').replaceChildren();current.items.forEach((r,i)=>{const tr=node('tr',undefined,$('rows'));const td=node('td',undefined,tr);const box=node('input',undefined,td);box.type='checkbox';box.value=i+1;node('span',' '+(i+1),td);const sources=node('td',undefined,tr);const ends=r.binding||r.link;for(const side of ['internal','external'])for(const e of ends[side]){const d=node('details',undefined,sources);node('summary',e.document_name+' '+e.title,d);node('p','판본: '+e.document_version,d);node('pre',e.spans.map(p=>p.text).join('\n'),d);}const reason=node('td',r.link.reason,tr);const history=node('button','승인 이력',reason);history.onclick=()=>task(async()=>{const h=await api('/v1/basis-links/'+r.link.link_id+'/history');$('report').textContent=h.events.sort((a,b)=>a.revision-b.revision).map(e=>e.at+' · '+e.actor+' · '+e.action+' · '+(e.reason||'')).join('\n');$('status').textContent='승인 이력을 조회했습니다.';});const edit=node('details',undefined,reason);node('summary','관계 수정',edit);const kinds=node('select',undefined,edit);for(const k of ['BASIS','IMPLEMENTS','RELATED']){const o=node('option',label(k),kinds);o.value=k;}kinds.value=r.link.kind;const text=node('textarea',undefined,edit);text.value=r.link.reason;const save=node('button','수정 후보 저장',edit);save.onclick=()=>task(async()=>{const select=e=>({document_id:e.document_id,unit_id:e.unit_id,scope:e.scope,spans:e.spans});await api('/v1/basis-links/proposals',{request_id:crypto.randomUUID(),link_id:r.link.link_id,expected_revision:r.link.revision,view_hash:r.view_hash,kind:kinds.value,reason:text.value,internal:ends.internal.map(select),external:ends.external.map(select)});await load();$('status').textContent='수정 후보를 저장했습니다. 확인 후 승인할 수 있습니다.';});node('td',label(r.link.status)+' / '+label(r.current_status)+'\n'+r.applicability.items.map(x=>label(x.status)).join(', '),tr);});}
$('refresh').onclick=()=>task(load);document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>task(async()=>{const rows=[...$('rows').querySelectorAll('input:checked')].map(e=>Number(e.value));if(!rows.length)throw Error('처리할 행을 선택해 주세요.');const result=await api('/v1/basis-links/reviews',{view_id:current.view_id,rows,action:b.dataset.action,reason:$('reason').value,request_id:crypto.randomUUID()});await load();$('status').textContent=result.items.map(i=>i.link_id+': '+(i.message||label(i.approval_status))).join('\n');}));
async function discover(continuation){const did=$('document').value;if(!did)throw Error('조사할 내규를 선택해 주세요.');const input={internal_document_id:did,mode:'discover'};if(continuation)input.continuation_of=run.run_id;run=await api('/v1/workflows/run',{workflow_id:'internal_basis_discovery_workflow',input,session_id:session,request_id:crypto.randomUUID(),use_llm:$('llm').checked,as_of:$('day').value||null});$('report').textContent=run.answer.text;await load();$('status').textContent='조사 상태: '+run.status+' · 미처리 '+run.coverage.unprocessed+'개';}
$('discover').onclick=()=>task(()=>discover(false));$('continue').onclick=()=>task(()=>discover(true));
task(async()=>{const docs=await api('/v1/basis-links/documents');for(const d of docs.documents){const o=node('option',d.name,$('document'));o.value=d.document_id;}await load();});
</script></html>
