          표준 매핑 상태: 표준단어·용어·도메인·인포타입 미확인; 승인 필요.

          확인 근거: 02_BACKEND/lawrag/pipeline/oracle_migration.py:source_batch; 02_BACKEND/semantic_runtime/oracle_dp_io.py'
      JSON_TEXT_ELIDED:
        name: JSON_TXT_OMIT_YN
        type: NUMBER(1)
        nullable: true
        default: null
