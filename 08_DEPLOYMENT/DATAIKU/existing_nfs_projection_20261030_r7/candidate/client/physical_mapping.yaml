  asset_part:
    name: LGL_FILE_PART_S
    role: transfer_archive
    description: '논리명(미승인 후보): 파일분할보관정보

      요약: 기존 색인·용어집 등 파일 자산을 분할해 압축·Base64 문자열과 조각 크기·hash로 보관한다. 직접 지식 조회 경로의 원문
      테이블이 아니다.

      행단위와PK: 자산별 조각 1건 / PK FILE_HASH_VAL + PART_SEQ_NO

      답할수있는질문: 이 자산의 분할 조각이 원본 해시와 일치하는가?

      포함제외: zlib+Base64 파일 조각; 직접 지식 조회·원문 문장 테이블 아님

      보유기간과기준시점: 기존 원문·완료 이력은 보존한다. 공식 보유기간·삭제 기준은 담당자 확인 필요. 조회 범위는 데이터 세대/게시 릴리스
      또는 현재 상태 기준.

      갱신주기와완료기준: 게시·선택·상태 변경 시; 운영 시각 미확정 / 완료 기준: 압축 해제한 조각 크기·조각 hash와 전체 자산 hash를
      대조한다. 조각 하나의 적재 완료와 전체 게시 완료는 구분한다.

      산식과단위: 업무 집계 산식 해당 없음. 식별값·hash·순번·바이트 수의 계산은 컬럼별 생성 규칙에 명시.

      원천과결합: 검증한 기존 navigation/fulltext/glossary 파일 / 분할·해시 계산 후 Base64 인코딩하여 보존

      주의: 조각 순서는 0부터; 합쳐 복원할 때 크기·조각/전체 hash 검증

      오너: 관리 부서·담당자 미확정; 담당자 확인 필요.

      예시질의: 이 자산의 분할 조각이 원본 해시와 일치하는가?

      SELECT PART_SEQ_NO, ORG_BYTE_CNT, PART_HASH_VAL FROM (SELECT PART_SEQ_NO, ORG_BYTE_CNT,
      PART_HASH_VAL FROM <승인스키마>.LGL_FILE_PART WHERE FILE_HASH_VAL=:file_hash_val
      ORDER BY PART_SEQ_NO) WHERE ROWNUM<=20

      <승인스키마>와 bind 값 확인 전 실행하지 않는 검토 예시.

      명칭 선정 이유: ASSET_PART를 파일 분할 보관이라는 업무 대상으로 표현한다. FILE/PART는 승인 전 약어 후보다.

      데이터유형 선정 이유: SNAPSHOT 후보: 전체 파일 hash·분할 순번별 불변 조각을 저장한다. 같은 파일 조각은 재사용하고 다른
      바이트로 덮어쓰지 않는다.

      레이어 선정 이유: 이관·보관 영역으로 분류한다. 기존 게시 검증에서 사용하므로 Gold 제외 제안을 곧바로 제거로 해석하지 않는다.

      2026-10-27 사용자 지정 개발계 대상: SIDDS.LGL_FILE_PART_S. 앞의 Gold 후보 설명은 운영 설계 이력이며 현재
      개발 적재 대상은 이 스키마·접미사를 따른다.'
    columns:
      ASSET_SHA256:
        name: FILE_HASH_VAL
        type: VARCHAR2(64 BYTE)
        nullable: false
        default: null
        description: '논리명(미승인 후보): 파일해시값

          업무 의미: 조각으로 나누기 전 전체 파일 자산의 SHA-256이다. 여러 조각을 같은 원본 파일로 묶는 키다.

          허용값·코드·범위: 생성 계약상 64자리 소문자 16진 SHA-256, NULL 불가. DB DDL은 VARCHAR2(64 BYTE)·PK를
          강제하며 16진 CHECK는 없음.

          산식·생성 규칙: sha256(전체 원본 파일 바이트).hexdigest(); 조각 해시와 구분.

          타입·NULL·기본값: VARCHAR2(64 BYTE) / NULL 불가 / 없음

          명칭 선정 이유: 전체 파일 해시값 FILE_HASH_VAL로 조각 해시와 구분한다.

          타입 유지·변경 이유: 문자 식별값·코드·hash 및 선행 0을 보존하기 위해 현행 VARCHAR2 BYTE 계약 유지. 승인 도메인·문자셋과
          실제 최대 길이는 추가 확인.

          표준 매핑 상태: 표준단어·용어·도메인·인포타입 미확인; 승인 필요.

          확인 근거: 02_BACKEND/semantic_runtime/oracle_dp_assets.py:inventory'
      PART_NO:
        name: PART_SEQ_NO
        type: NUMBER(12)
        nullable: false
        default: null
        description: '논리명(미승인 후보): 분할순번

          업무 의미: 전체 파일을 순서대로 나눈 조각의 0 기반 순번이다.

          허용값·코드·범위: NUMBER(12) 정수, 0 이상, NULL 불가. 전체 파일 hash와 함께 PK.

          산식·생성 규칙: PART_BYTES=1,048,576바이트 단위로 분할할 때의 0 기반 순번. 번호 기준을 1로 바꾸지 않음.

          타입·NULL·기본값: NUMBER(12) / NULL 불가 / 없음

          명칭 선정 이유: 임의 업무 번호가 아닌 분할 순번 PART_SEQ_NO로 표시한다.

          타입 유지·변경 이유: 현재 정수 범위·정밀도와 동시성/크기/표시 계약을 보존하기 위해 현행 NUMBER 유지.

          표준 매핑 상태: 표준단어·용어·도메인·인포타입 미확인; 승인 필요.

          확인 근거: 02_BACKEND/semantic_runtime/oracle_dp_assets.py; 02_BACKEND/lawrag/pipeline/oracle_publish.py'
      RAW_BYTES:
        name: ORG_BYTE_CNT
        type: NUMBER(12)
        nullable: false
        default: null
        description: '논리명(미승인 후보): 원본바이트수

          업무 의미: 압축·Base64 처리 전 원본 조각의 바이트 수다. 인코딩된 문자열 길이가 아니다.

          허용값·코드·범위: NUMBER(12), 정수 1~1,048,576, NULL 불가. DDL CHECK와 읽기 후 실제 바이트 길이
          대조.

          산식·생성 규칙: len(raw_part_bytes).

          타입·NULL·기본값: NUMBER(12) / NULL 불가 / 없음

          명칭 선정 이유: 원본 바이트 수 ORG_BYTE_CNT로 단위를 이름에 명시한다.

          타입 유지·변경 이유: 현재 정수 범위·정밀도와 동시성/크기/표시 계약을 보존하기 위해 현행 NUMBER 유지.

          표준 매핑 상태: 표준단어·용어·도메인·인포타입 미확인; 승인 필요.

          확인 근거: 02_BACKEND/semantic_runtime/oracle_dp_assets.py:put_part/get_part'
      PART_SHA256:
        name: PART_HASH_VAL
        type: VARCHAR2(64 BYTE)
        nullable: false
        default: null
        description: '논리명(미승인 후보): 분할해시값

          업무 의미: 압축 전 원본 조각의 SHA-256이다. 전체 파일 hash와 별개로 전송·보관 조각을 검증한다.

          허용값·코드·범위: 생성 계약상 64자리 소문자 16진 SHA-256, NULL 불가. get_part에서 실제 원본 조각 hash와
          대조.

