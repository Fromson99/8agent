tables:
  document:
    name: LGL_DOC_VER_S
    role: gold_knowledge
    description: '논리명(미승인 후보): 문서판본정보

      요약: 검증한 데이터 구축 세대 안에서 내규·외규 문서의 식별값, 문서명, 원본자료 해시와 원문 객체 정보를 보존한다. 법령 개정 판본과
      데이터 구축 세대는 구분한다.

      행단위와PK: 세대 내 문서 1건 / PK DATA_VER_ID + DOC_ID

      답할수있는질문: 이 세대의 문서명과 원본자료 해시는 무엇인가?

      포함제외: 구조화된 문서 메타; 원문 파일 자체와 질문 답변 제외

      보유기간과기준시점: 기존 원문·완료 이력은 보존한다. 공식 보유기간·삭제 기준은 담당자 확인 필요. 조회 범위는 데이터 세대/게시 릴리스
      또는 현재 상태 기준.

      갱신주기와완료기준: 외규 일일 수집·내규 업로드 후 게시가 목표; 정확 완료 시각 미확정 / 완료 기준: 세대·문서 PK별 메타데이터를
      다시 읽어 원천과 대조한다. 테이블 일부 적재만으로 전체 조회 릴리스 완료를 선언하지 않는다.

      산식과단위: 업무 집계 산식 해당 없음. 식별값·hash·순번·바이트 수의 계산은 컬럼별 생성 규칙에 명시.

      원천과결합: 법제처 등 외규 원천·현업 포탈 내규 → 기존 구조화 document / 검증한 문서 정보와 원본 해시를 세대별 적재

      주의: 동일 DOCUMENT_ID라도 DATASET_VERSION이 다르면 별도 행; 구축 세대와 법령 개정 판본을 구분하고 세대 간 중복
      집계 주의

      오너: 관리 부서·담당자 미확정; 담당자 확인 필요.

      예시질의: 이 세대의 문서명과 원본자료 해시는 무엇인가?

      SELECT DOC_ID, DOC_NM, SRC_DATA_HASH_VAL FROM <승인스키마>.LGL_DOC_VER WHERE DATA_VER_ID=:data_ver_id
      AND DOC_ID=:doc_id

      <승인스키마>와 bind 값 확인 전 실행하지 않는 검토 예시.

      명칭 선정 이유: 기존 SRC_DOCUMENT의 역할을 문서 판본·출처 관리로 설명한다. LGL은 법규 업무, DOC는 문서, VER는
      판본을 뜻하는 약어 후보이며 승인 표준단어 대조가 필요하다.

      데이터유형 선정 이유: SNAPSHOT 후보: 데이터 구축 세대별 문서 행을 불변 적재한다. 같은 문서가 다른 세대에 반복돼도 최신 한
      행으로 덮어쓰지 않는다.

      레이어 선정 이유: 원문과 출처를 조회하는 지식 정본이므로 Gold 지식 후보로 선정한다.

      2026-10-27 사용자 지정 개발계 대상: SIDDS.LGL_DOC_VER_S. 앞의 Gold 후보 설명은 운영 설계 이력이며 현재
      개발 적재 대상은 이 스키마·접미사를 따른다.'
    columns:
      DATASET_VERSION:
        name: DATA_VER_ID
        type: VARCHAR2(64 BYTE)
        nullable: false
        default: null
        description: '논리명(미승인 후보): 데이터판본ID

          업무 의미: 동일한 구조화 원문·목차·용어 결속을 재현하기 위한 데이터 구축 세대 식별값이다. 법령 시행일이나 개정번호와 다르다.

          허용값·코드·범위: 이 경로의 생성값은 manifest 원시 바이트 SHA-256의 64자리 소문자 16진 문자열. 원문 writer는
          문자열 길이·NULL/키 계약을 별도로 검사한다.

          산식·생성 규칙: sha256(선택 generation/manifest.json 원시 바이트).hexdigest(); JSON 재직렬화
          후 hash로 대체하지 않음.

          타입·NULL·기본값: VARCHAR2(64 BYTE) / NULL 불가 / 없음

          명칭 선정 이유: 판본을 고정하는 식별값임을 DATA_VER_ID로 표현한다. 숫자 버전으로 변환하지 않는다.

          타입 유지·변경 이유: 문자 식별값·코드·hash 및 선행 0을 보존하기 위해 현행 VARCHAR2 BYTE 계약 유지. 승인 도메인·문자셋과
          실제 최대 길이는 추가 확인.

          표준 매핑 상태: 표준단어·용어·도메인·인포타입 미확인; 승인 필요.

          확인 근거: 02_BACKEND/lawrag/pipeline/oracle_migration.py:source_binding'
      DOCUMENT_ID:
        name: DOC_ID
        type: VARCHAR2(512 BYTE)
        nullable: false
        default: null
        description: '논리명(미승인 후보): 문서ID

          업무 의미: 세대 안에서 원문 문서를 식별하고 원문·구조·조회 행을 연결하는 값이다.

          허용값·코드·범위: 값이 있으면 비어 있지 않은 문자열, UTF-8 512바이트 이내. 원문 테이블은 PK 필수; 조회 투영의 문서
          비소속 행은 NULL 허용.

          산식·생성 규칙: 해당 없음: 구조화 원문의 document_id를 보존한다. 조회키 hash로 치환하지 않음.

          타입·NULL·기본값: VARCHAR2(512 BYTE) / NULL 불가 / 없음

          명칭 선정 이유: DOCUMENT를 DOC로 축약하고 기존 ID 계약을 유지한다. ID 예외는 표준 승인 확인 대상이다.

          타입 유지·변경 이유: 문자 식별값·코드·hash 및 선행 0을 보존하기 위해 현행 VARCHAR2 BYTE 계약 유지. 승인 도메인·문자셋과
          실제 최대 길이는 추가 확인.

          표준 매핑 상태: 표준단어·용어·도메인·인포타입 미확인; 승인 필요.

          확인 근거: 02_BACKEND/semantic_runtime/oracle_dp_io.py:validate_row; 02_BACKEND/semantic_runtime/oracle_query_catalog.py:record/Records.page'
      NAME:
        name: DOC_NM
        type: CLOB
        nullable: true
        default: null
        description: '논리명(미승인 후보): 문서명

          업무 의미: 원문 문서의 표시 이름이다. 문서 ID와 구분하고 법령·내규 제목을 있는 그대로 보존한다.

          허용값·코드·범위: 문자열·빈 CLOB·NULL. 현행 원문 전송 상한은 UTF-8 64MiB이며 DB나 표준 인포타입의 최대 길이를
          뜻하지 않음.

          산식·생성 규칙: 해당 없음: 구조화 document.name을 보존한다.

          타입·NULL·기본값: CLOB / NULL 허용 / 없음

          명칭 선정 이유: 일반 NAME 대신 문서명을 나타내는 DOC_NM을 사용한다.

          타입 유지·변경 이유: 원문·메타/JSON·인코딩 내용의 가변 길이와 무손실 전송을 보존하기 위해 현행 CLOB 유지. 실측과 승인
          인포타입 확인 전 길이 제한 문자열로 축소하지 않음.

          표준 매핑 상태: 표준단어·용어·도메인·인포타입 미확인; 승인 필요.

          확인 근거: 02_BACKEND/semantic_runtime/oracle_dp_io.py:validate_row/bind_row'
      SOURCE_ARTIFACT_SHA256:
        name: SRC_DATA_HASH_VAL
        type: VARCHAR2(64 BYTE)
        nullable: true
        default: null
        description: '논리명(미승인 후보): 원본자료해시값

          업무 의미: 구조화 결과가 참조하는 원본 출처 자료의 무결성 hash다. 구조화 본문 문자열 자체의 hash와 구분한다.

          허용값·코드·범위: 원본 자료 SHA-256 계약의 문자열 또는 NULL. 원문 이관 검사는 비어 있지 않은 문자열·64바이트 이하만
          강제하므로 16진 형식 검증이 항상 수행됐다고 보지 않음.

          산식·생성 규칙: 원천이 기록한 source_artifact_sha256을 그대로 이관; 여기서 다른 대상의 hash를 새로 계산하지
          않음.

          타입·NULL·기본값: VARCHAR2(64 BYTE) / NULL 허용 / 없음

          명칭 선정 이유: 원본자료 해시값이라는 의미를 SRC_DATA_HASH_VAL로 드러낸다.

          타입 유지·변경 이유: 문자 식별값·코드·hash 및 선행 0을 보존하기 위해 현행 VARCHAR2 BYTE 계약 유지. 승인 도메인·문자셋과
          실제 최대 길이는 추가 확인.

          표준 매핑 상태: 표준단어·용어·도메인·인포타입 미확인; 승인 필요.

          확인 근거: 02_BACKEND/lawrag/pipeline/oracle_migration.py:source_batch; 02_BACKEND/semantic_runtime/oracle_dp_io.py:validate_row'
      SOURCE_JSON:
        name: DOC_JSON_CN
        type: CLOB
        nullable: true
        default: null
        description: '논리명(미승인 후보): 문서JSON내용

          업무 의미: 문서 메타정보 원천 객체의 JSON 직렬화 값이다. 기존 필드·판본·출처 정보를 그대로 보존한다.

          허용값·코드·범위: 문자열·빈 CLOB·NULL; 원문 전송 상한 UTF-8 64MiB. 현행 원문 DDL에는 IS JSON CHECK가
          없고 원문 소비자의 별도 계약을 따른다.

          산식·생성 규칙: 해당 없음: 원천 SQLite json 값을 그대로 이관한다. 내부 JSON 키·원문 좌표·값을 개명하지 않음.

          타입·NULL·기본값: CLOB / NULL 허용 / 없음

          명칭 선정 이유: 원천 객체 종류가 문서·구조 단위·블록 중 무엇인지 컬럼명에서 구분한다.

          타입 유지·변경 이유: 원문·메타/JSON·인코딩 내용의 가변 길이와 무손실 전송을 보존하기 위해 현행 CLOB 유지. 실측과 승인
          인포타입 확인 전 길이 제한 문자열로 축소하지 않음.

          표준 매핑 상태: 표준단어·용어·도메인·인포타입 미확인; 승인 필요.

          확인 근거: 02_BACKEND/lawrag/pipeline/oracle_migration.py:source_batch; 02_BACKEND/semantic_runtime/oracle_dp_io.py'
    pk:
    - DATASET_VERSION
    - DOCUMENT_ID
    pk_name: LGL_DOC_VER_PK_S
    indexes: []
    checks: []
    foreign_keys: []
  source_unit:
    name: LGL_DOC_UNIT_S
    role: gold_knowledge
    description: '논리명(미승인 후보): 문서구조단위정보

      요약: 문서의 편·장·절·관·조·항·호·목 등 구조 단위와 상위 단위 관계를 데이터 세대·문서 범위 안에서 보존한다.

      행단위와PK: 세대·문서 내 구조 단위 1건 / PK DATA_VER_ID + DOC_ID + UNIT_ID

      답할수있는질문: 이 조문의 상위 장·절과 하위 구조 단위는 무엇인가?

      포함제외: 문서 내부 구조·부모 관계; 의미 해석 및 승인되지 않은 추정 관계 제외

      보유기간과기준시점: 기존 원문·완료 이력은 보존한다. 공식 보유기간·삭제 기준은 담당자 확인 필요. 조회 범위는 데이터 세대/게시 릴리스
      또는 현재 상태 기준.

      갱신주기와완료기준: 외규 일일 수집·내규 업로드 후 게시가 목표; 정확 완료 시각 미확정 / 완료 기준: PK별 구조 JSON과 부모값을
      원천과 대조한다. 부모 관계의 정합성은 별도 문서·세대 검증으로 확인한다.

      산식과단위: 업무 집계 산식 해당 없음. 식별값·hash·순번·바이트 수의 계산은 컬럼별 생성 규칙에 명시.

      원천과결합: 기존 구조화 source_unit / 장·절·조·항·호·목 등 구조와 부모 관계를 보존해 적재

      주의: 부모 관계는 같은 문서·세대 안에서 확인; 서로 다른 편의 같은 장 번호를 합치지 않음

      오너: 관리 부서·담당자 미확정; 담당자 확인 필요.

      예시질의: 이 조문의 상위 장·절과 하위 구조 단위는 무엇인가?

      SELECT UNIT_ID, PRNT_UNIT_ID, UNIT_JSON_CN FROM <승인스키마>.LGL_DOC_UNIT WHERE DATA_VER_ID=:data_ver_id
      AND DOC_ID=:doc_id AND UNIT_ID=:unit_id

      <승인스키마>와 bind 값 확인 전 실행하지 않는 검토 예시.

      명칭 선정 이유: SOURCE_UNIT을 문서 안의 구조 단위로 명확히 표현한다. DOC와 UNIT은 약어 후보이며 특정 조항 유형 하나로
      범위를 제한하지 않는다.

      데이터유형 선정 이유: SNAPSHOT 후보: 동일 세대·문서의 구조와 부모 관계를 고정한다. 이후 변경은 다른 데이터 세대로 구분한다.

      레이어 선정 이유: 조항 탐색과 원문 범위 확인에 직접 사용하므로 Gold 지식 후보로 선정한다.

      2026-10-27 사용자 지정 개발계 대상: SIDDS.LGL_DOC_UNIT_S. 앞의 Gold 후보 설명은 운영 설계 이력이며 현재
      개발 적재 대상은 이 스키마·접미사를 따른다.'
    columns:
      DATASET_VERSION:
        name: DATA_VER_ID
        type: VARCHAR2(64 BYTE)
        nullable: false
        default: null
        description: '논리명(미승인 후보): 데이터판본ID

          업무 의미: 동일한 구조화 원문·목차·용어 결속을 재현하기 위한 데이터 구축 세대 식별값이다. 법령 시행일이나 개정번호와 다르다.

          허용값·코드·범위: 이 경로의 생성값은 manifest 원시 바이트 SHA-256의 64자리 소문자 16진 문자열. 원문 writer는
          문자열 길이·NULL/키 계약을 별도로 검사한다.

          산식·생성 규칙: sha256(선택 generation/manifest.json 원시 바이트).hexdigest(); JSON 재직렬화
          후 hash로 대체하지 않음.

