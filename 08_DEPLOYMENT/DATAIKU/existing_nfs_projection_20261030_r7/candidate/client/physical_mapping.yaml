  query_row:
    name: LGL_SRCH_ROW_S
    role: gold_knowledge
    description: '논리명(미승인 후보): 지식조회행정보

      요약: 문서 구조·용어·정의·참조·검색·무결성 등 릴리스에 선언된 여러 논리 데이터를 조건별 조회 가능한 행으로 투영해 저장한다.

      행단위와PK: 조회 릴리스·종류 내 행 1건 / PK SRCH_PBLS_ID + ROW_KIND_CD + ROW_ID

      답할수있는질문: 지정 릴리스에서 용어·정의·구조·참조를 어떻게 찾는가?

      포함제외: manifest에 정의된 조회 투영; 새로운 온톨로지/위키 전체 정본 제외

      보유기간과기준시점: 기존 원문·완료 이력은 보존한다. 공식 보유기간·삭제 기준은 담당자 확인 필요. 조회 범위는 데이터 세대/게시 릴리스
      또는 현재 상태 기준.

      갱신주기와완료기준: 외규 일일 수집·내규 업로드 후 게시가 목표; 정확 완료 시각 미확정 / 완료 기준: 조회 행의 PK·내용 hash·본문·조회키를
      대조하고 완료 manifest의 종류별 건수를 확인한다. 전체 완료 뒤 별도 활성화를 수행한다.

      산식과단위: 업무 집계 산식 해당 없음. 식별값·hash·순번·바이트 수의 계산은 컬럼별 생성 규칙에 명시.

      원천과결합: 원문·navigation/fulltext/glossary의 선택된 세대 / oracle_query_publish로 구조·용어·검색·관계·무결성
      행 투영

      주의: KIND별 논리 스키마가 다름; 단일 개념 테이블로 집계 금지

      오너: 관리 부서·담당자 미확정; 담당자 확인 필요.

      예시질의: 지정 릴리스에서 용어·정의·구조·참조를 어떻게 찾는가?

      SELECT ROW_ID, ROW_JSON_CN FROM <승인스키마>.LGL_SRCH_ROW WHERE SRCH_PBLS_ID=:srch_pbls_id
      AND ROW_KIND_CD=:row_kind_cd AND SRCH_KEY_ID=:srch_key_id AND ROWNUM<=20

      <승인스키마>와 bind 값 확인 전 실행하지 않는 검토 예시.

      명칭 선정 이유: QUERY_ROW를 지식 조회용 행으로 표현한다. SRCH는 검색·조회, ROW는 투영 행을 뜻하는 후보다. 한 종류의
      개념이나 관계만 저장하는 테이블로 이름을 좁히지 않는다.

      데이터유형 선정 이유: SNAPSHOT 후보: 완료 조회 릴리스와 종류·행 ID에 결속된 불변 투영이다. 요청별 실행 이력 테이블이 아니다.

      레이어 선정 이유: 원문·용어·관계의 직접 조회 데이터이므로 Gold 지식 후보다. KIND별 의미는 동일 릴리스 manifest에 연결한다.

      2026-10-27 사용자 지정 개발계 대상: SIDDS.LGL_SRCH_ROW_S. 앞의 Gold 후보 설명은 운영 설계 이력이며 현재
      개발 적재 대상은 이 스키마·접미사를 따른다.'
    columns:
      RELEASE_ID:
        name: SRCH_PBLS_ID
        type: VARCHAR2(64 BYTE)
        nullable: false
        default: null
        description: '논리명(미승인 후보): 조회게시ID

          업무 의미: 완료 조회 manifest를 식별한다. 조회 행과 채널이 어떤 조회 게시본에 속하는지 연결한다.

          허용값·코드·범위: 64자리 소문자 16진 digest; NULL 불가. 채널의 값은 조회 게시 테이블을 참조한다.

          산식·생성 규칙: 조회 게시 생성 시 digest(완료 query manifest). 조회 행·채널은 그 값을 참조·보존한다.

          타입·NULL·기본값: VARCHAR2(64 BYTE) / NULL 불가 / 없음

          명칭 선정 이유: 조회 게시 SRCH_PBLS_ID로 원문 게시와 구분하고 참조 컬럼 이름을 맞춘다.

          타입 유지·변경 이유: 문자 식별값·코드·hash 및 선행 0을 보존하기 위해 현행 VARCHAR2 BYTE 계약 유지. 승인 도메인·문자셋과
          실제 최대 길이는 추가 확인.

          표준 매핑 상태: 표준단어·용어·도메인·인포타입 미확인; 승인 필요.

          확인 근거: 02_BACKEND/semantic_runtime/oracle_query_catalog.py:read_release/insert_records/activate'
      KIND:
        name: ROW_KIND_CD
        type: VARCHAR2(64 BYTE)
        nullable: false
        default: null
        description: '논리명(미승인 후보): 조회행종류코드

          업무 의미: 조회 행의 논리 종류로, 같은 릴리스 manifest의 tables에 선언된 투영 스키마를 선택한다.

          허용값·코드·범위: 게시기 패턴 [a-z][a-z0-9_.]{0,63}; 실제 조회 때 완료 manifest의 tables에 있는
          종류만 허용. 전사 숫자 코드로 자동 재번호화하지 않음.

          산식·생성 규칙: 해당 없음: 게시기가 지정한 투영 종류 문자열을 사용한다.

          타입·NULL·기본값: VARCHAR2(64 BYTE) / NULL 불가 / 없음

          명칭 선정 이유: KIND가 조회 행 종류임을 ROW_KIND_CD로 명시한다.

          타입 유지·변경 이유: 문자 식별값·코드·hash 및 선행 0을 보존하기 위해 현행 VARCHAR2 BYTE 계약 유지. 승인 도메인·문자셋과
          실제 최대 길이는 추가 확인.

          표준 매핑 상태: 표준단어·용어·도메인·인포타입 미확인; 승인 필요.

          확인 근거: 02_BACKEND/semantic_runtime/oracle_query_catalog.py:record/Records.page'
      ROW_ID:
        name: ROW_ID
        type: VARCHAR2(64 BYTE)
        nullable: false
        default: null
        description: '논리명(미승인 후보): 조회행ID

          업무 의미: 한 조회 종류 안에서 행을 재현하고 중복을 판별하는 key의 digest다.

          허용값·코드·범위: 64자리 소문자 16진 hash, NULL 불가. 단독 전역 키가 아니라 release·kind와 함께 PK를
          이룬다.

          산식·생성 규칙: digest(key): JSON 정규 직렬화(키 정렬·고정 구분자·NaN 금지)의 UTF-8 SHA-256.

          타입·NULL·기본값: VARCHAR2(64 BYTE) / NULL 불가 / 없음

          명칭 선정 이유: 기존 ROW_ID 유지. 한글 설명에 조회 행과 digest 의미를 보충한다.

          타입 유지·변경 이유: 문자 식별값·코드·hash 및 선행 0을 보존하기 위해 현행 VARCHAR2 BYTE 계약 유지. 승인 도메인·문자셋과
          실제 최대 길이는 추가 확인.

          표준 매핑 상태: 표준단어·용어·도메인·인포타입 미확인; 승인 필요.

          확인 근거: 02_BACKEND/semantic_runtime/oracle_query_catalog.py:record/insert_records;
          02_BACKEND/semantic_runtime/oracle_dp_io.py:canonical/digest'
      DOCUMENT_ID:
        name: DOC_ID
        type: VARCHAR2(512 BYTE)
        nullable: true
        default: null
        description: '논리명(미승인 후보): 문서ID

          업무 의미: 조회 행의 소속 문서를 표시하는 권한 필터용 원문 ID다. 문서에 소속되지 않은 공통 용어집 행은 NULL일 수 있다.
          NULL을 모든 권한 검사가 불필요하다는 의미로 해석하지 않는다.

          허용값·코드·범위: 값이 있으면 비어 있지 않은 문자열, UTF-8 512바이트 이내. 원문 테이블은 PK 필수; 조회 투영의 문서
          비소속 행은 NULL 허용.

          산식·생성 규칙: 해당 없음: 구조화 원문의 document_id를 보존한다. 조회키 hash로 치환하지 않음.

          타입·NULL·기본값: VARCHAR2(512 BYTE) / NULL 허용 / 없음

          명칭 선정 이유: DOCUMENT를 DOC로 축약하고 기존 ID 계약을 유지한다. ID 예외는 표준 승인 확인 대상이다.

          타입 유지·변경 이유: 문자 식별값·코드·hash 및 선행 0을 보존하기 위해 현행 VARCHAR2 BYTE 계약 유지. 승인 도메인·문자셋과
          실제 최대 길이는 추가 확인.

          표준 매핑 상태: 표준단어·용어·도메인·인포타입 미확인; 승인 필요.

          확인 근거: 02_BACKEND/semantic_runtime/oracle_dp_io.py:validate_row; 02_BACKEND/semantic_runtime/oracle_query_catalog.py:record/Records.page'
      LOOKUP_ID:
        name: SRCH_KEY_ID
        type: VARCHAR2(512 BYTE)
        nullable: true
        default: null
        description: '논리명(미승인 후보): 검색키ID

          업무 의미: 표면형·논리 ID 등 후보를 빠르게 찾는 보조 조회키다. 전체 논리 값은 JSON에 보존한다.

          허용값·코드·범위: NULL 또는 비어 있지 않은 UTF-8 512바이트 이하 문자열. 긴 보조키는 호출자가 lookup_key()를
          적용한 경우 sha256: 접두 digest로 인코딩한다.

          산식·생성 규칙: lookup_key(v)는 NULL/512바이트 이하 v를 유지, 초과 시 sha256: + digest(v).
          원문 DOCUMENT_ID에는 이 인코딩을 적용하지 않음.

          타입·NULL·기본값: VARCHAR2(512 BYTE) / NULL 허용 / 없음

          명칭 선정 이유: 검색용 키임을 SRCH_KEY_ID로 표시한다. 원문 문서 식별자와 구분한다.

