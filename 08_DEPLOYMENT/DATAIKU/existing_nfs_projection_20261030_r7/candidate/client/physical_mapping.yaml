      원천과결합: 에이전트 실행·재개 상태 / JSON 상태 hash와 revision으로 동시 수정 방지

      주의: scope hash가 접근권한 검사를 대체하지 않음; 미확정 쓰기는 revision/hash로 재조회

      오너: 관리 부서·담당자 미확정; 담당자 확인 필요.

      예시질의: 이 범위의 상태와 변경 순번은 무엇인가?

      SELECT ST_KEY_ID, CHG_SEQ_NO, ST_HASH_VAL FROM <승인스키마>.LGL_EXEC_ST WHERE SCOPE_HASH_VAL=:scope_hash_val
      AND ST_KEY_ID=:st_key_id

      <승인스키마>와 bind 값 확인 전 실행하지 않는 검토 예시.

      명칭 선정 이유: QUERY_STATE를 에이전트 실행 상태로 명확히 표현한다. EXEC/ST는 실행/상태 약어 후보이며 지식 원문과 구분한다.

      데이터유형 선정 이유: MASTER 후보: 범위·상태키당 현재 상태와 revision을 갱신한다. 이 테이블 단독으로 과거 상태 전체 이력을
      보존하지 않는다.

      레이어 선정 이유: 질의·실행 상태 책임이므로 Agent 대상이다. Gold 등록 제외 제안이며 기존 테이블 삭제를 뜻하지 않는다.

      2026-10-27 사용자 지정 개발계 대상: SIDDA.LGL_EXEC_ST_A. 앞의 Gold 후보 설명은 운영 설계 이력이며 현재
      개발 적재 대상은 이 스키마·접미사를 따른다.'
    columns:
      SCOPE_HASH:
        name: SCOPE_HASH_VAL
        type: VARCHAR2(64 BYTE)
        nullable: false
        default: null
        description: '논리명(미승인 후보): 범위해시값

          업무 의미: 상태 객체가 속한 범위를 결속하는 hash다. hash 값 자체로 접근권한이 승인되지는 않는다.

          허용값·코드·범위: 64자리 소문자 16진 hash, NULL 불가. 실제 입력 범위 구성은 상태 포트 호출자의 계약으로 고정.

          산식·생성 규칙: 해당 없음: 호출자가 제공한 scope_hash를 pin 검증 후 보존; 포트가 임의 사용자 범위를 생성하지 않음.

          타입·NULL·기본값: VARCHAR2(64 BYTE) / NULL 불가 / 없음

          명칭 선정 이유: 범위를 결속하는 해시값임을 SCOPE_HASH_VAL로 표시한다.

          타입 유지·변경 이유: 문자 식별값·코드·hash 및 선행 0을 보존하기 위해 현행 VARCHAR2 BYTE 계약 유지. 승인 도메인·문자셋과
          실제 최대 길이는 추가 확인.

          표준 매핑 상태: 표준단어·용어·도메인·인포타입 미확인; 승인 필요.

          확인 근거: 02_BACKEND/semantic_runtime/oracle_query_state.py:State.__init__'
      STATE_KEY:
        name: ST_KEY_ID
        type: VARCHAR2(128 BYTE)
        nullable: false
        default: null
        description: '논리명(미승인 후보): 상태키ID

          업무 의미: 같은 범위 안의 개별 상태 객체를 찾는 키다.

          허용값·코드·범위: 패턴 [A-Za-z0-9][A-Za-z0-9_.:/-]{0,127}, NULL 불가. 허용 구체 키 목록은 소비자
          계약에 따름.

          산식·생성 규칙: 해당 없음: 상태 소비자가 지정한 key를 보존한다.

          타입·NULL·기본값: VARCHAR2(128 BYTE) / NULL 불가 / 없음

          명칭 선정 이유: 상태키 ID의 역할을 ST_KEY_ID로 나타낸다.

          타입 유지·변경 이유: 문자 식별값·코드·hash 및 선행 0을 보존하기 위해 현행 VARCHAR2 BYTE 계약 유지. 승인 도메인·문자셋과
          실제 최대 길이는 추가 확인.

          표준 매핑 상태: 표준단어·용어·도메인·인포타입 미확인; 승인 필요.

          확인 근거: 02_BACKEND/semantic_runtime/oracle_query_state.py:State._binds'
      REVISION:
        name: CHG_SEQ_NO
        type: NUMBER(18)
        nullable: false
        default: null
        description: '논리명(미승인 후보): 변경순번

          업무 의미: 같은 채널 또는 상태 객체의 동시 수정 충돌을 확인하는 변경 순번이다.

          허용값·코드·범위: NUMBER(18), 정수 1 이상, NULL 불가. 생성 1, 성공 변경 때 1 증가. 원문 개정번호와 다름.

          산식·생성 규칙: 새 revision = expected_revision + 1. 기대 revision과 기존 값 확인 후 CAS
          갱신.

          타입·NULL·기본값: NUMBER(18) / NULL 불가 / 없음

          명칭 선정 이유: REVISION을 변경순번 CHG_SEQ_NO로 표현해 법령 판본과 구분한다.

          타입 유지·변경 이유: 현재 정수 범위·정밀도와 동시성/크기/표시 계약을 보존하기 위해 현행 NUMBER 유지.

          표준 매핑 상태: 표준단어·용어·도메인·인포타입 미확인; 승인 필요.

          확인 근거: 02_BACKEND/semantic_runtime/oracle_query_catalog.py:activate; 02_BACKEND/semantic_runtime/oracle_query_state.py:State.put'
      VALUE_SHA256:
        name: ST_HASH_VAL
        type: VARCHAR2(64 BYTE)
        nullable: false
        default: null
        description: '논리명(미승인 후보): 상태해시값

          업무 의미: 상태의 범위·키·revision·내용이 하나의 갱신에 속하는지 확인하는 hash다.

          허용값·코드·범위: 64자리 소문자 16진 hash, NULL 불가. VALUE_JSON만 hash한 값과 다름.

          산식·생성 규칙: digest({scope_hash,key,revision,value}). 읽기 시 같은 조합으로 재계산한다.

          타입·NULL·기본값: VARCHAR2(64 BYTE) / NULL 불가 / 없음

          명칭 선정 이유: 상태 내용 결속 해시임을 ST_HASH_VAL로 나타낸다.

          타입 유지·변경 이유: 문자 식별값·코드·hash 및 선행 0을 보존하기 위해 현행 VARCHAR2 BYTE 계약 유지. 승인 도메인·문자셋과
          실제 최대 길이는 추가 확인.

          표준 매핑 상태: 표준단어·용어·도메인·인포타입 미확인; 승인 필요.

          확인 근거: 02_BACKEND/semantic_runtime/oracle_query_state.py:State.read/put'
      VALUE_JSON:
        name: ST_JSON_CN
        type: CLOB
        nullable: false
        default: null
        description: '논리명(미승인 후보): 상태JSON내용

          업무 의미: 소비자가 정한 작은 실행 상태 객체의 JSON이다. 질문 답변을 재사용 지식으로 승인하는 필드가 아니다.

          허용값·코드·범위: NULL 불가, DDL IS JSON. json_body 직렬화 결과 상한 8MiB; 소비자의 추가 상태 스키마·예산
          검증 필요.

          산식·생성 규칙: json_body(value): ASCII JSON·키 정렬·고정 구분자·NaN 금지. 상태 hash는 scope/key/revision까지
          포함.

          타입·NULL·기본값: CLOB / NULL 불가 / 없음

          명칭 선정 이유: 상태 JSON 내용 ST_JSON_CN으로 지식 조회 행과 구분한다.

          타입 유지·변경 이유: 원문·메타/JSON·인코딩 내용의 가변 길이와 무손실 전송을 보존하기 위해 현행 CLOB 유지. 실측과 승인
          인포타입 확인 전 길이 제한 문자열로 축소하지 않음.

          표준 매핑 상태: 표준단어·용어·도메인·인포타입 미확인; 승인 필요.

          확인 근거: 02_BACKEND/semantic_runtime/oracle_query_state.py:State.put/read;
          02_BACKEND/semantic_runtime/oracle_query_catalog.py:json_body'
