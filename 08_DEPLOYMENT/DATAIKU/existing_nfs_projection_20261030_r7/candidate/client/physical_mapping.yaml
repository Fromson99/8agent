        nullable: false
        default: SYSTIMESTAMP
        description: '논리명(미승인 후보): 등록일시

          업무 의미: 원문 게시 행이 DB에 등록된 시각이다. 문서 작성일·법령 시행일·GENOS 처리 시작시각과 다르다.

          허용값·코드·범위: TIMESTAMP WITH TIME ZONE, NULL 불가. 기본값 SYSTIMESTAMP; 시간대 정보 보존.

          산식·생성 규칙: 신규 INSERT에서 생략 시 DB SYSTIMESTAMP. 기존 행 이행은 원 등록시각 보존 대상으로 설계.

          타입·NULL·기본값: TIMESTAMP WITH TIME ZONE / NULL 불가 / SYSTIMESTAMP

          명칭 선정 이유: 등록시각을 날짜와 시간이 포함된 일시 도메인 REG_DTM으로 표현한다.

