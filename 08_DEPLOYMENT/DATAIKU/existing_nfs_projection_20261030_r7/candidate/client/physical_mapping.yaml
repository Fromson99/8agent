          업무 의미: 인용·대사에서 실제로 읽는 원문 본문이다. 생성된 요약이나 답변을 저장하는 필드가 아니다.

          허용값·코드·범위: 문자열·빈 CLOB·NULL; 현행 전송 상한 UTF-8 64MiB. NULL과 길이 0 CLOB을 구분해 보존한다.

          산식·생성 규칙: 해당 없음: 원문 block_payload.text를 그대로 이관한다.

          타입·NULL·기본값: CLOB / NULL 허용 / 없음

          명칭 선정 이유: 일반 TEXT 대신 블록 본문 내용이라는 BLK_TXT_CN을 사용한다.

          타입 유지·변경 이유: 원문·메타/JSON·인코딩 내용의 가변 길이와 무손실 전송을 보존하기 위해 현행 CLOB 유지. 실측과 승인
          인포타입 확인 전 길이 제한 문자열로 축소하지 않음.

          표준 매핑 상태: 표준단어·용어·도메인·인포타입 미확인; 승인 필요.

          확인 근거: 02_BACKEND/semantic_runtime/oracle_dp_io.py:validate_row/bind_row/read_rows'
      SOURCE_ARTIFACT_SHA256:
