  block_payload:
    name: LGL_DOC_BLK_S
    role: gold_knowledge
    description: '논리명(미승인 후보): 문서본문블록정보

      요약: 인용·대사에 사용하는 정확한 원문 블록을 문서와 구조 단위에 연결하고, 원본자료 해시 및 JSON 본문 중복 생략 표시를 함께 보존한다.

      행단위와PK: 세대·문서 내 본문 블록 1건 / PK DATA_VER_ID + DOC_ID + BLK_ID

      답할수있는질문: 이 조항의 정확한 원문은 무엇인가?

      포함제외: 본문 블록·구조 단위 연결·원본 해시; 생성 답변 제외

      보유기간과기준시점: 기존 원문·완료 이력은 보존한다. 공식 보유기간·삭제 기준은 담당자 확인 필요. 조회 범위는 데이터 세대/게시 릴리스
      또는 현재 상태 기준.

      갱신주기와완료기준: 외규 일일 수집·내규 업로드 후 게시가 목표; 정확 완료 시각 미확정 / 완료 기준: 블록 PK별 TEXT·SOURCE_JSON·생략
      표시·해시를 다시 읽어 원천과 대조한다. 빈 CLOB과 NULL을 구분한다.

      산식과단위: 업무 집계 산식 해당 없음. 식별값·hash·순번·바이트 수의 계산은 컬럼별 생성 규칙에 명시.

      원천과결합: 기존 구조화 source_block / 정확한 본문·구조 연결·해시를 적재하고 JSON 본문 생략 플래그 보존

      주의: 본문 생략 플래그는 JSON 중복 본문 처리 계약; 원문 부재로 해석하지 않음

      오너: 관리 부서·담당자 미확정; 담당자 확인 필요.

      예시질의: 이 조항의 정확한 원문은 무엇인가?

      SELECT BLK_ID, UNIT_ID, BLK_TXT_CN, JSON_TXT_OMIT_YN FROM <승인스키마>.LGL_DOC_BLK
      WHERE DATA_VER_ID=:data_ver_id AND DOC_ID=:doc_id AND BLK_ID=:blk_id

      <승인스키마>와 bind 값 확인 전 실행하지 않는 검토 예시.

      명칭 선정 이유: PAYLOAD 같은 구현 용어보다 문서 본문 블록이라는 행 단위를 드러낸다. DOC/BLK는 승인 전 약어 후보다.

      데이터유형 선정 이유: SNAPSHOT 후보: 세대·문서·블록 키별 원문을 고정하고 기존 행과 다른 본문을 덮어쓰지 않는다.

      레이어 선정 이유: 실제 인용·검토의 근거 본문이므로 Gold 지식 후보로 선정한다.

      2026-10-27 사용자 지정 개발계 대상: SIDDS.LGL_DOC_BLK_S. 앞의 Gold 후보 설명은 운영 설계 이력이며 현재
      개발 적재 대상은 이 스키마·접미사를 따른다.'
