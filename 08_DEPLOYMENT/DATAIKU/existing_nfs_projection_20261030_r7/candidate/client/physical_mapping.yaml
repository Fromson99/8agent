          허용값·코드·범위: 이 경로의 생성값은 manifest 원시 바이트 SHA-256의 64자리 소문자 16진 문자열. 원문 writer는
          문자열 길이·NULL/키 계약을 별도로 검사한다.

          산식·생성 규칙: sha256(선택 generation/manifest.json 원시 바이트).hexdigest(); JSON 재직렬화
          후 hash로 대체하지 않음.

          타입·NULL·기본값: VARCHAR2(64 BYTE) / NULL 불가 / 없음

          명칭 선정 이유: 판본을 고정하는 식별값임을 DATA_VER_ID로 표현한다. 숫자 버전으로 변환하지 않는다.

          타입 유지·변경 이유: 문자 식별값·코드·hash 및 선행 0을 보존하기 위해 현행 VARCHAR2 BYTE 계약 유지. 승인 도메인·문자셋과
          실제 최대 길이는 추가 확인.

          표준 매핑 상태: 표준단어·용어·도메인·인포타입 미확인; 승인 필요.

