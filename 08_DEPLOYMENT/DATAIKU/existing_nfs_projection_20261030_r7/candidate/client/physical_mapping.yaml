  source_release:
    name: LGL_SRC_PBLS_S
    role: gold_support
    description: '논리명(미승인 후보): 원문게시정보

      요약: 구조화 원문 세대와 navigation·fulltext·glossary 등 자산, 검색 선택 정보를 하나의 완료 게시 명세에 결속해
      보존한다.

      행단위와PK: 원문·자산 완료 릴리스 1건 / PK SRC_PBLS_ID

      답할수있는질문: 이 게시본은 어느 원문 세대·파일 자산에 결속되는가?

      포함제외: 완료 게시 명세와 등록시각; 미완료 게시·임시 작업 상태 제외

      보유기간과기준시점: 기존 원문·완료 이력은 보존한다. 공식 보유기간·삭제 기준은 담당자 확인 필요. 조회 범위는 데이터 세대/게시 릴리스
      또는 현재 상태 기준.

      갱신주기와완료기준: 게시·선택·상태 변경 시; 운영 시각 미확정 / 완료 기준: 원문·자산 검증 뒤 완료 명세를 저장하고 release
      hash와 저장 내용을 다시 확인한다. 자산 조각 테이블 자체를 지식 조회 대상으로 사용하지 않는다.

      산식과단위: 업무 집계 산식 해당 없음. 식별값·hash·순번·바이트 수의 계산은 컬럼별 생성 규칙에 명시.

      원천과결합: 원문 적재 결과·자산 manifest·검색 선택표 / 기존 게시 계약의 완료 명세를 hash와 결속해 저장

      주의: 직접 조회도 참조하는 필수 게시 지원 정보; 자산 보관 테이블과 함께 삭제하지 않음

      오너: 관리 부서·담당자 미확정; 담당자 확인 필요.

      예시질의: 이 게시본은 어느 원문 세대·파일 자산에 결속되는가?

      SELECT SRC_PBLS_ID, DATA_VER_ID, PBLS_JSON_CN, REG_DTM FROM <승인스키마>.LGL_SRC_PBLS
      WHERE SRC_PBLS_ID=:src_pbls_id

      <승인스키마>와 bind 값 확인 전 실행하지 않는 검토 예시.

      명칭 선정 이유: 광범위한 RAG_RELEASE 대신 원문과 자산 게시라는 책임을 표현한다. SRC/PBLS는 원문/게시 약어 후보이며
      조회 게시와 구분한다.

      데이터유형 선정 이유: SNAPSHOT 후보: 완료 manifest 내용에 따른 식별값으로 불변 게시본을 관리한다. CREATED_AT은
      DB 등록시각이다.

      레이어 선정 이유: 직접 조회가 원문 세대를 검증할 때 필요한 지원 정보이므로 Gold 지원 후보다. 실제 Gold 등록 범위는 거버넌스
      확인이 필요하다.

      2026-10-27 사용자 지정 개발계 대상: SIDDS.LGL_SRC_PBLS_S. 앞의 Gold 후보 설명은 운영 설계 이력이며 현재
      개발 적재 대상은 이 스키마·접미사를 따른다.'
    columns:
      RELEASE_ID:
        name: SRC_PBLS_ID
        type: VARCHAR2(64 BYTE)
        nullable: false
        default: null
        description: '논리명(미승인 후보): 원문게시ID

          업무 의미: 완료 원문·자산 게시 명세를 불변 식별하는 값이다.

          허용값·코드·범위: 64자리 소문자 16진 digest; NULL 불가.

          산식·생성 규칙: digest(원문·자산 완료 release 객체). 직렬화 저장 형식과 논리 digest 계산을 구분.

          타입·NULL·기본값: VARCHAR2(64 BYTE) / NULL 불가 / 없음

          명칭 선정 이유: 원문 게시 SRC_PBLS_ID로 조회 게시 식별값과 구분한다.

          타입 유지·변경 이유: 문자 식별값·코드·hash 및 선행 0을 보존하기 위해 현행 VARCHAR2 BYTE 계약 유지. 승인 도메인·문자셋과
          실제 최대 길이는 추가 확인.

          표준 매핑 상태: 표준단어·용어·도메인·인포타입 미확인; 승인 필요.

