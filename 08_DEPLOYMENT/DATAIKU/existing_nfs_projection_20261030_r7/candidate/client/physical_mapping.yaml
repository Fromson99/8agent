          업무 의미: 블록 JSON에서 중복 본문을 생략해 별도 TEXT 값으로 복원해야 하는지를 표시한다. 문서의 원문이 없다는 표시가
          아니다.

          허용값·코드·범위: 코드 허용값 0, 1, NULL. 1은 JSON 본문 생략·별도 본문 사용, 0은 미생략. NULL은 0으로
          추정하지 않고 보존. 현재 DDL은 값 CHECK 없음.

          산식·생성 규칙: 해당 없음: 원천의 json_text_elided 값을 보존한다.

          타입·NULL·기본값: NUMBER(1) / NULL 허용 / 없음

          명칭 선정 이유: JSON 본문의 생략 여부라는 의미를 명시한다. 후보 YN 도메인이 문자형이면 별도 변환 승인 필요.

          타입 유지·변경 이유: 현재 정수 범위·정밀도와 동시성/크기/표시 계약을 보존하기 위해 현행 NUMBER 유지. 후보 여부 도메인이
          문자형이면 0/1/NULL 변환을 별도 승인·검증하며 이번에는 자동 변경하지 않음.

          표준 매핑 상태: 표준단어·용어·도메인·인포타입 미확인; 승인 필요.

