# 레거시 2엔진 API (archive/trust-parser-v1 + first-agent).
#
#   docker compose -f deploy/api/docker-compose.yml up -d --build
#   curl http://localhost:5555/health
#
# 저장소의 기본 서비스는 루트 `docker-compose.yml`(구조 해석기)이다. 이쪽은
# v1·v0 엔진을 계속 띄워야 할 때만 쓴다. 빌드 컨텍스트는 **저장소 루트**여야 하고,
# 루트 `.dockerignore` 가 두 엔진을 빼므로 `Dockerfile.dockerignore` 로 덮어쓴다.
name: 8-agent-legacy-api

services:
  trust-api:
    build:
      context: ../..                        # 저장소 루트 — archive/ 와 first-agent/ 를 복사해야 한다
      dockerfile: deploy/api/Dockerfile
    image: trust-reconciliation-api:latest
    container_name: trust-api
    ports:
      - "${PORT:-5555}:5555"
    environment:
      # 키는 이미지에 굽지 않는다 — 셸/CI 환경변수나 호스트의 .env 에서 주입한다.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-}"
      API_TOKEN: "${API_TOKEN:-}"          # 설정하면 모든 /v1/* 에 Bearer 인증 강제
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-40}"
      PARSER_WORKERS: "2"
      AGENT_WORKERS: "1"                   # 스냅샷·용어집 공유 — 직렬 실행
    volumes:
      # 도클링 모델 캐시. 없으면 컨테이너를 새로 만들 때마다 수백 MB 를 다시 받는다.
      - hf-models:/models
      # LLM 스냅샷 — 같은 입력에 같은 리포트가 나오게 하는 기록본. 살려 둔다.
      - ../../first-agent/snapshots:/app/first-agent/snapshots
      # 파싱 산출물(chunks.json) — 뷰어가 읽는다.
      - ../../archive/trust-parser-v1/out:/app/archive/trust-parser-v1/out
    restart: unless-stopped

volumes:
  hf-models:
