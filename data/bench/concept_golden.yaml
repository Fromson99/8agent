version: 2
name: tier1-concept-oql-golden
expected_count: 50
description: >-
  승인 Concept/Assertion 정렬과 OQL 구조 바인딩을 LLM 없이 검증한다. 양성 25건은
  수동 승인 제64조 Assertion의 표현 변형 14건과 문서·조문으로 한정한 frame
  Assertion 11건이다. 대조군 25건은 잘못된 술어·좌표·문서, 무좌표 다중 후보,
  범용 용어 및 미지원 표현이 안전하게 하위 RAG로 폴백하는지 검증한다.
