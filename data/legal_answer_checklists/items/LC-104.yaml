id: LC-104
name: 준용·참조 연결 폐쇄
scope: routed
severity: blocker
status: trial
triggers: [준용, 따른, 참조, 제2-4조, 제2-6조, 시행규칙, 별표]
basis:
  - path: data/wiki/wiki/해석원칙/준용과-경과조치.md
    anchor: 준용 — 빌려온 조문은 통째로 온다
    note: 준용된 조문의 요건과 효과까지 연결해 읽는다.
operational_definition: >-
  회수 조문이 다른 조·항·호·별표를 준용하거나 참조할 때 그 연결 대상의 필요한 요건과 효과가 함께 확보되고 답변에 반영됐는지 검사한다.
  참조 문구만으로 미회수 대상의 내용을 추정하거나, 준용된 제한·예외를 누락해 결론을 내리면 FAIL이다.
  연결 대상이 근거에 없어서 결론을 확정할 수 없으면 UNCLEAR로 판정한다.
examples:
  pass:
    - 준용 원문과 피준용 조문의 요건을 함께 대조해 적용 결과를 설명한다.
  fail:
    - 제2-4조를 따른다는 문구만 보고 제2-4조의 제외요건을 무시한다.
  unclear:
    - 별표를 참조하지만 별표 내용이 회수 근거에 없다.
learned_from:
  - ADR-0049-legal-minimal-pairs-v1/cross-reference-observations
