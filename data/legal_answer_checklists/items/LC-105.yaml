id: LC-105
name: 법규·보조자료 권위 분리
scope: routed
severity: blocker
status: trial
triggers: [체크리스트, 가이드, 해설, 안내, 규정, 법규, 제정시기, 기재항목]
basis:
  - path: docs/adr/ADR-0049-legal-minimal-pairs/README.md
    anchor: norm-vs-checklist
    note: 규범과 실사 체크리스트를 혼동하는 최소대조쌍에서 유래했다.
operational_definition: >-
  법령·규정·공식 해석과 체크리스트·가이드·위키·설명자료의 권위 수준을 구별했는지 검사한다.
  보조자료가 검색 이유나 점검 항목을 설명할 수는 있지만, 원문 근거 없이 독립적인 법적 의무·기한·금지를 만든 것으로 답하면 FAIL이다.
  자료의 종류가 표시되지 않아 권위 수준을 식별할 수 없으면 UNCLEAR로 판정한다.
examples:
  pass:
    - 체크리스트 항목은 실무 점검사항일 뿐 규정상 제정기한은 아니라고 구분한다.
  fail:
    - 해설서의 권고를 법규상 강행의무라고 단정한다.
  unclear:
    - 근거 문서의 발행주체와 문서 유형이 모두 빠져 있다.
learned_from:
  - ADR-0049-legal-minimal-pairs-v1/norm-vs-checklist
