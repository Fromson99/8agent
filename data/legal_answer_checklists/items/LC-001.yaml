id: LC-001
name: 질문 법률좌표 일치
scope: core
severity: blocker
status: trial
triggers: []
basis:
  - path: data/wiki/wiki/쟁점/포섭의-경계.md
    anchor: '# 포섭의 경계'
    note: 포섭은 대상과 판단축을 먼저 고정해야 한다.
operational_definition: >-
  답변이 질문에서 묻는 행위자, 행위, 객체, 시점, 시장·절차와 동일한 법률좌표를 판단했는지 검사한다.
  근거에 유사한 제도나 인접 주체가 있더라도 질문의 핵심 좌표를 다른 대상으로 바꾸어 결론을 내리면 FAIL이다.
  질문에 좌표가 없거나 회수 근거만으로 좌표 동일성을 확인할 수 없으면 추측하지 말고 UNCLEAR로 판정한다.
examples:
  pass:
    - 질문이 주권상장법인의 의무를 묻고 답도 주권상장법인에 한정해 판단한다.
  fail:
    - 상장 전 발행인의 질문에 이미 상장된 회사 규정을 그대로 적용한다.
  unclear:
    - 질문에 회사 유형과 판단 시점이 없고 근거에도 적용대상이 표시되지 않는다.
learned_from:
  - ADR-0049-legal-minimal-pairs-v1/ipo-issuer-status
