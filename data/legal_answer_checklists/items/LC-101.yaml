id: LC-101
name: 수치 경계 연산
scope: routed
severity: blocker
status: trial
triggers: [미만, 이하, 초과, 이상, 정확히, 억원, 퍼센트, '%', 100분의]
basis:
  - path: docs/adr/ADR-0049-legal-minimal-pairs/README.md
    anchor: capital-threshold
    note: 정확히 10억원과 9억원에서 결론이 뒤집혀야 하는 최소대조쌍이다.
operational_definition: >-
  법문 수치와 사실 수치를 같은 단위로 놓고 미만·이하·초과·이상의 경계 포함 여부를 정확히 계산했는지 검사한다.
  특히 기준값과 정확히 같은 사실에서 미만과 초과는 거짓이고 이하와 이상은 참이어야 한다.
  수치나 단위가 근거에 누락돼 비교할 수 없으면 계산을 만들어내지 말고 UNCLEAR로 판정한다.
examples:
  pass:
    - 10억원 미만 요건에서 정확히 10억원은 포함되지 않는다고 판단한다.
  fail:
    - 10억원 미만에 정확히 10억원도 포함된다고 판단한다.
  unclear:
    - 근거는 비율 기준인데 질문의 분모가 없어 실제 비율을 계산할 수 없다.
learned_from:
  - ADR-0049-legal-minimal-pairs-v1/capital-threshold
