id: LC-004
name: 결론·이유 내부 일치
scope: core
severity: blocker
status: trial
triggers: []
basis:
  - path: docs/adr/0032-haiku-final-answer-reliability-gates.md
    anchor: 수치·기간·양태·예외·기관 권한
    note: 결론과 포섭 과정의 독립 검사가 필요하다.
operational_definition: >-
  답변의 첫 결론, 조건 판단, 설명, 최종 문장이 같은 법적 효과를 가리키는지 검사한다.
  예라고 답한 뒤 이유에서는 금지된다고 설명하거나, 수치 비교식은 요건 불충족인데 최종 결론만 충족이라고 쓰는 등 답변 내부가 모순되면 FAIL이다.
  문장이 지나치게 생략돼 결론과 이유의 관계를 확인할 수 없으면 UNCLEAR로 둔다.
examples:
  pass:
    - 아니오라고 결론 내리고 해당 수치가 미만 요건을 충족하지 않는다고 일관되게 설명한다.
  fail:
    - 가능하다고 결론 낸 뒤 본문에서는 법이 이를 금지한다고 설명한다.
  unclear:
    - 근거 인용만 있고 질문에 대한 명시적 결론이 없다.
learned_from:
  - ADR-0049-legal-minimal-pairs-v1/condition-matrix
