# 과제5 서브태스크 3 — 업로드 문서의 내·외규 저촉 점검 예시 Q&A
#
# 태스크: 사용자가 문서(딜 검토요청서·계약서·상품설명서 등)를 업로드하면,
#         내규·외규를 검색해 저촉 사항을 근거와 함께 열거한다.
# 입력 문서: examples/task5-risk-agent/uploads/신규딜_리스크검토요청서_예시.md
#   (의도된 저촉 4건 + 문제없는 항목 2건이 섞여 있다)

upload: uploads/신규딜_리스크검토요청서_예시.md

items:
  - id: t5s3-01
    question: >-
      첨부한 딜 검토요청서 기준으로, 내규나 법규에 저촉되는 부분을 전부 찾아서 근거랑 같이 알려줘.
    answer: >-
      저촉 4건이 확인된다.
      (1) 인수 한도 초과 — 인수금액 1,200억 원은 자기자본 6,000억 원의 20%로,
      투자및인수위험관리지침 제4조제1항의 동일 딜 한도(자기자본의 15%, 900억 원)를 초과한다.
      같은 조 제3항에 따라 위험관리위원회 사전 승인이 필요하나 요청서상 상정 이력이 없다.
      (2) 신용평가 단일 — 무보증사채는 증권 인수업무 등에 관한 규정 제11조의2제1항 및
      지침 제5조제1항에 따라 둘 이상의 신용평가회사 평가가 필요한데 1개사(A-) 평가만 있다.
      (3) 위험회피 목적 확인 미비 — 발행사는 일반투자자이므로 자본시장법 제166조의2제1항제1호와
      세칙 제12조제3항에 따라 통화선도 체결 전에 회피 위험의 종류·금액 확인과 자료 보관이
      필요한데 "체결 후 추후 징구 예정"으로 되어 있다.
      (4) 파생상품업무책임자 승인 누락 — 법 제166조의2제1항제4호, 세칙 제12조제1항,
      지침 제10조에 따라 매 거래 시 승인이 필요한데 승인란이 공란이다.
      한편 콜차입 300억 원(연간 한도 500억 원 이내)과 순자본비율 620%(신규 장외파생 중지
      기준 미해당)는 문제없다.
    sources:
      - doc: 투자및인수위험관리지침
        article: 제4조·제5조·제10조
      - doc: 증권 인수업무 등에 관한 규정
        article: 제11조의2제1항
      - doc: 자본시장과 금융투자업에 관한 법률
        article: 제166조의2제1항
      - doc: 위험관리기준시행세칙(v2)
        article: 제12조·제13조
    eval_points:
      - 저촉 4건 전부 적발 (한도 초과·신용평가 단일·위험회피 확인 미비·책임자 승인 누락)
      - 20% > 15% 계산을 문서의 숫자로 수행
      - 문제없는 항목(콜차입·순자본비율)을 저촉으로 오판하지 않음
      - 각 건마다 내규·외규 근거 병기

  - id: t5s3-02
    question: >-
      이 딜 인수금액이 우리 내규 한도 안에 들어오나? 계산해서 알려줘.
    answer: >-
      한도를 초과한다. 투자및인수위험관리지침 제4조제1항의 동일 딜 총액인수 한도는 직전
      사업연도말 자기자본(6,000억 원)의 15%인 900억 원인데, 이 딜은 1,200억 원(20%)이다.
      진행하려면 같은 조 제3항에 따라 위험관리위원회의 사전 승인이 필요하다. 참고로
      인수잔량 합계 한도(50%, 3,000억 원)는 기존 800억 원에 이 딜을 더해도 2,000억 원으로
      한도 이내다.
    sources:
      - doc: 투자및인수위험관리지침
        article: 제4조
    eval_points:
      - 900억 한도 대비 1,200억 초과 계산
      - 위험관리위원회 사전 승인 경로 제시
      - 인수잔량 한도는 이내라는 구분

  - id: t5s3-03
    question: >-
      요청서에 있는 통화선도 거래, 이대로 진행해도 되는 거야?
    answer: >-
      이대로는 안 된다. 발행사가 전문투자자 지정을 받지 않은 일반투자자이므로 자본시장법
      제166조의2제1항제1호에 따라 위험회피 목적 거래인 경우에만 가능하고, 체결 전에 회피하려는
      위험의 종류와 금액을 확인하고 관련 자료를 보관해야 한다 — 확인서를 "체결 후 추후 징구"
      하는 방식은 허용되지 않는다. 또한 같은 항 제4호와 세칙 제12조제1항에 따라 파생상품업무
      책임자의 승인을 먼저 받아야 하는데 승인란이 공란이다. 두 요건을 갖춘 뒤 진행해야 한다.
      거래 자체는 발행대금 환헤지 목적이므로 요건만 갖추면 가능한 구조다.
    sources:
      - doc: 자본시장과 금융투자업에 관한 법률
        article: 제166조의2제1항제1호·제4호
      - doc: 위험관리기준시행세칙(v2)
        article: 제12조
    eval_points:
      - 사전 확인·사전 승인 요건 (사후 징구 불가)
      - 거래 자체는 요건 충족 시 가능하다는 균형 잡힌 결론

  - id: t5s3-04
    question: >-
      이 요청서대로면 승인 절차는 어디까지 밟아야 완결이야? 지금까지 받은 걸로 충분한가?
    answer: >-
      불충분하다. 지금까지 받은 것은 투자심사위원회 의결(2026. 8. 7.)뿐이다. 추가로
      (1) 인수 한도 초과이므로 투자및인수위험관리지침 제4조제3항의 위험관리위원회 사전 승인,
      (2) 통화선도에 대한 파생상품업무책임자 승인(세칙 제12조제1항)이 필요하다.
      투자심사위원회 의결 자체는 지침 제3조제1항(500억 원 이상)에 따른 것으로 적정하다.
    sources:
      - doc: 투자및인수위험관리지침
        article: 제3조·제4조제3항
      - doc: 위험관리기준시행세칙(v2)
        article: 제12조제1항
    eval_points:
      - 완료된 승인과 누락된 승인의 구분
      - 누락 2건 (위험관리위원회·파생상품업무책임자)
