id: LC-005
name: 결론 필수쟁점 완결성
scope: core
severity: blocker
status: trial
triggers: []
basis:
  - path: data/wiki/wiki/쟁점/포섭의-경계.md
    anchor: '# 포섭의 경계'
    note: 결론에 필요한 분류 기준과 사실의 대응을 확인한다.
operational_definition: >-
  질문에 직접 답하기 위해 반드시 판단해야 하는 핵심 쟁점을 답변이 누락하지 않았는지 검사한다.
  관련 조문을 인용했어도 적용대상, 임계값, 예외 또는 법적 효과 중 결론을 뒤집을 필수 요소를 다루지 않으면 FAIL이다.
  회수 근거에 필수 요소가 존재하지 않아 답변도 유보한 경우에는 FAIL이 아니라 UNCLEAR로 판정한다.
examples:
  pass:
    - 대상 법인 여부와 임계값 충족 여부를 모두 판단한 뒤 결론을 제시한다.
  fail:
    - 관련 규정 제목만 소개하고 질문의 허용 여부를 판단하지 않는다.
  unclear:
    - 답변은 필요한 추가 사실을 특정해 유보했고 근거에도 그 사실이 없다.
learned_from:
  - ADR-0049-legal-minimal-pairs-v1/all-pairs
