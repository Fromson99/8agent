id: LC-103
name: 행위자·정의 범위
scope: routed
severity: blocker
status: trial
triggers: [주권상장법인, 금융기관, 전문투자자, 벤처금융, 발행인, 해당, 대상]
basis:
  - path: data/wiki/wiki/방법/정의-우선.md
    anchor: 정의 규정은 해석지침이다
    note: 정의된 용어의 범위를 먼저 고정한다.
operational_definition: >-
  질문의 주체나 객체가 법문에 정의된 범주에 실제로 들어가는지, 그리고 답변이 그 정의 범위를 넓히거나 줄이지 않았는지 검사한다.
  이름이 비슷하다는 이유만으로 다른 행위자를 포함하거나 상장 전후처럼 법적 지위가 달라지는 대상을 같은 것으로 취급하면 FAIL이다.
  정의 원문이나 포섭에 필요한 사실이 회수되지 않았으면 UNCLEAR로 판정한다.
examples:
  pass:
    - 상장 전 발행인과 이미 주권상장법인인 발행인을 구분해 적용 조항을 판단한다.
  fail:
    - 벤처금융이 아닌 일반 투자자를 벤처금융 정의에 포함시킨다.
  unclear:
    - 전문투자자 정의가 근거에 없고 질문에도 자격 사실이 없다.
learned_from:
  - ADR-0049-legal-minimal-pairs-v1/ipo-issuer-status
  - ADR-0049-legal-minimal-pairs-v1/exception-investor
