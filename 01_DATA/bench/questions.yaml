# RAG 벤치 질문셋 — scripts/rag_bench.py 가 읽는다.
#
# 형식: sets[].questions[] — 자유롭게 고치고 늘리면 된다. 같은 set 안의
# 질문들은 같은 주제를 다른 말로 물은 변형이다(패러프레이즈 회수 점검용).
# 러너는 질문마다 /v1/rag/ask 를 부르고 answerable · 첫 글자 시간(TTFT) ·
# 총 시간 · 근거 수 · 지문/교정 수를 표로 보고한다.
#
# 주의: 채권 운용 준칙·ELB·전결권 등은 아직 저장소에 없는 문서를 겨냥한
# 질문이다 — 그 문서가 올라오기 전에는 "회수 안 됨"이 정답이다(부재 단정이
# 아니라 회수 실패를 말해야 한다). 문서가 들어오면 같은 셋으로 다시 돌려
# 전후를 비교한다.

sets:
  - id: bond-grade
    title: 채권 운용 기준등급
    questions:
      - "채권 운용 기준등급 관련 준칙은 뭘 봐야해?"
      - "채권 운용 최저 등급은?"
      - "채권 편입 가능 등급?"
      - "채권 편입시 규정?"
      - "채권 운용 관련 등급 기준은?"

  - id: elb-grade
    title: ELB 운용 가능 등급
    questions:
      - "ELB 내에 운용가능 등급은 어떤지 알려줘"
      - "ELB 채권 편입 기준은?"
      - "ELB 운용시 채권 관련 기준은?"

  - id: unsold
    title: 미매각 절차
    questions:
      - "미매각 관련 절차는 어떻게 돼?"

  - id: overlap
    title: 준칙 간 유사·상충
    questions:
      - "채권 중개 및 중개운용준칙과 내용이 비슷하거나 상충되는 규정들이 있나"

  - id: cb-authority
    title: CB 투자 전결권
    questions:
      - "상장사 CB 투자 50억 하려고 하는데 전결권 알려줘"

  - id: credit-limit
    title: 신용한도 협의
    questions:
      - "롯데캐피탈 100억 담아야는데 신용한도 협의 해야될까"

  - id: refinancing
    title: 인수금융 리파이낸싱 한도 증액
    questions:
      - "기존에 실행한 인수금융 리파이낸싱 보유한도 증액하려고 하는데 절차 알려줘"
