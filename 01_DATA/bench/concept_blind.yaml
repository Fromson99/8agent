version: 1
name: tier1-concept-oql-blind
expected_count: 50
description: >-
  concept_golden.yaml 및 concept_holdout.yaml과 질문과 양성 근거 좌표가 겹치지
  않도록 동결한 신규 블라인드셋이다. 양성 25건은 서로 다른 미사용 문서의 승인
  Frame Assertion을 자연스러운 변형 표현으로 묻는다. 음성 25건은 술어 반전,
  좌표 이동, 다른 문서명, 무좌표 중의성, 교차 도메인 오염을 각각 5건 검사한다.
  최초 실제 LLM 실행 뒤에는 구현 튜닝에 사용하지 않는다.
axis_order: [outcome, source_tier, scope, expression, challenge, domain]

