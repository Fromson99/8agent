[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lawrag"
version = "0.1.0"
description = "Receipt-bound legal document retrieval and analysis runtime"
requires-python = ">=3.11"

[project.scripts]
lawrag-ontology-pipeline = "lawrag.pipeline.ontology:main"

[tool.setuptools]
package-dir = {"" = "02_BACKEND"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["02_BACKEND"]
include = ["lawrag*"]
exclude = ["lawrag.research*"]

[tool.setuptools.package-data]
lawrag = [
  "api/viewer/**/*",
  "core/*.yaml",
  "core/**/*.yaml",
  "core/structure/templates/*.json",
  "agents/agent6/formats/*.json",
  "agents/agent6/checklist/items/*.yaml",
  "agents/agent6/glossary/*.yaml",
]
